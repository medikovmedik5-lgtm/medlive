<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedElin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            text-align: center;
        }

        .language {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        select {
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: white;
            font-size: 14px;
        }

        .container {
            max-width: 450px;
            margin: 90px auto;
            padding: 20px;
        }

        .logo {
            font-size: 65px;
        }

        h1 {
            color: #3f51b5;
            font-size: 40px;
            margin: 10px;
        }

        h2 {
            color: #444;
        }

        input {
            display: block;
            width: 280px;
            max-width: 90%;
            margin: 15px auto;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 17px;
        }

        .button {
            width: 280px;
            max-width: 90%;
            padding: 15px;
            margin: 10px auto;
            border: none;
            border-radius: 12px;
            background: #536dfe;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #3f51b5;
        }

        .error {
            color: #e53935;
            font-weight: bold;
            margin-top: 15px;
        }

        #palatalar {
            display: none;
        }
    </style>
</head>

<body>

    <!-- DİL -->
    <div class="language">
        <select id="language" onchange="dilDeyis()">
            <option value="az">🇦🇿 Azərbaycan</option>
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Русский</option>
        </select>
    </div>


    <!-- GİRİŞ SƏHİFƏSİ -->
    <div id="loginPage" class="container">

        <div class="logo">🏥</div>

        <h1>MedElin</h1>

        <h2 id="loginTitle">Daxil ol</h2>

        <input
            type="text"
            id="username"
            placeholder="Login"
        >

        <input
            type="password"
            id="password"
            placeholder="Şifrə"
        >

        <button class="button" onclick="giris()" id="loginButton">
            🔐 Daxil ol
        </button>

        <div id="error" class="error"></div>

    </div>


    <!-- PALATALAR -->
    <div id="palatalar" class="container">

        <div class="logo">🏥</div>

        <h1>MedElin</h1>

        <h2 id="roomsTitle">🛏️ Palatalar</h2>

        <button class="button"
            onclick="window.location.href='palata-406.html'">
            🛏️ Palata 406
        </button>

        <button class="button"
            onclick="window.location.href='palata-407.html'">
            🛏️ Palata 407
        </button>

        <button class="button"
            onclick="window.location.href='palata-408.html'">
            🛏️ Palata 408
        </button>

    </div>


<script>

    // LOGIN: palata
    // ŞİFRƏ: 1234

    function giris() {

        const login =
            document.getElementById("username").value.trim();

        const sifre =
            document.getElementById("password").value;

        if (login === "palata" && sifre === "1234") {

            document.getElementById("loginPage").style.display = "none";

            document.getElementById("palatalar").style.display = "block";

            document.getElementById("error").textContent = "";

        } else {

            const dil =
                document.getElementById("language").value;

            if (dil === "az") {
                document.getElementById("error").textContent =
                    "❌ Login və ya şifrə səhvdir!";
            }

            if (dil === "en") {
                document.getElementById("error").textContent =
                    "❌ Incorrect login or password!";
            }

            if (dil === "ru") {
                document.getElementById("error").textContent =
                    "❌ Неверный логин или пароль!";
            }
        }
    }


    function dilDeyis() {

        const dil =
            document.getElementById("language").value;

        const loginTitle =
            document.getElementById("loginTitle");

        const username =
            document.getElementById("username");

        const password =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const roomsTitle =
            document.getElementById("roomsTitle");


        if (dil === "az") {

            loginTitle.textContent = "Daxil ol";

            username.placeholder = "Login";

            password.placeholder = "Şifrə";

            loginButton.textContent = "🔐 Daxil ol";

            roomsTitle.textContent = "🛏️ Palatalar";
        }


        if (dil === "en") {

            loginTitle.textContent = "Login";

            username.placeholder = "Username";

            password.placeholder = "Password";

            loginButton.textContent = "🔐 Login";

            roomsTitle.textContent = "🛏️ Rooms";
        }


        if (dil === "ru") {

            loginTitle.textContent = "Вход";

            username.placeholder = "Логин";

            password.placeholder = "Пароль";

            loginButton.textContent = "🔐 Войти";

            roomsTitle.textContent = "🛏️ Палаты";
        }
    }

</script>

</body>
</html>
