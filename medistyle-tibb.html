<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedLive - Tibb İşçisi Paneli</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef8f4, #f8fbfa);
    color: #20332b;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(30,70,55,.10);
}

.login {
    max-width: 430px;
    margin: 50px auto;
    text-align: center;
}

.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 22px;
    background: #edf7f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

h1,
h2 {
    color: #244d3d;
}

input,
select {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 1px solid #dce9e2;
    border-radius: 13px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.loginBtn {
    background: #244d3d;
    color: white;
}

.logout {
    background: #fff1ef;
    color: #a33d32;
}

.status {
    padding: 13px;
    border-radius: 13px;
    background: #edf7f2;
    color: #2d654e;
    font-weight: bold;
    margin-top: 15px;
}

.roomSelect {
    margin-top: 20px;
    padding: 20px;
    border-radius: 18px;
    background: #f7fbf9;
    border: 1px solid #dce9e2;
}

.roomSelect label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #244d3d;
}

.changeRoom {
    background: #244d3d;
    color: white;
}

.request {
    border: 1px solid #dce9e2;
    border-radius: 18px;
    padding: 18px;
    margin: 12px 0;
    background: #fbfdfc;
}

.request.new {
    border-left: 5px solid #e09b35;
}

.request.accepted {
    border-left: 5px solid #2d654e;
    opacity: .85;
}

.room {
    font-size: 20px;
    font-weight: bold;
    color: #244d3d;
}

.time {
    color: #89958f;
    font-size: 13px;
    margin-top: 6px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.actions button {
    flex: 1;
}

.accept {
    background: #244d3d;
    color: white;
}

.delete {
    background: #fff1ef;
    color: #a33d32;
}

.voice {
    margin-top: 15px;
    padding: 15px;
    border-radius: 16px;
    background: #f5f9ff;
    border: 1px solid #dce8f5;
}

.voice audio {
    width: 100%;
    margin-top: 10px;
}

.empty {
    text-align: center;
    color: #89958f;
    padding: 25px;
}

.hidden {
    display: none;
}

.selectedRoom {
    font-size: 18px;
    font-weight: bold;
    color: #244d3d;
    margin-top: 10px;
}

@media(max-width:600px) {
    .actions {
        flex-direction: column;
    }

    body {
        padding: 10px;
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div id="loginPage" class="card login">

    <div class="logo">🩺</div>

    <h1>MedLive</h1>

    <p>Tibb işçisi paneli</p>

    <h2>🔐 Giriş</h2>

    <input
        id="username"
        type="text"
        placeholder="İstifadəçi adı"
        autocomplete="username"
    >

    <input
        id="password"
        type="password"
        placeholder="Şifrə"
        autocomplete="current-password"
    >

    <button
        class="loginBtn"
        onclick="login()"
    >
        Daxil ol
    </button>

    <div id="loginStatus"></div>

</div>


<div id="panel" class="container hidden">

    <div class="card">

        <div class="logo">🩺</div>

        <h1>MedLive</h1>

        <p>Tibb işçisi paneli</p>

        <div id="userInfo" class="status"></div>

        <div class="roomSelect">

            <label for="palataSec">
                🏥 Bu gün hansı palataya baxırsınız?
            </label>

            <select id="palataSec">

                <option value="">
                    Palata seçin
                </option>

                <option value="406">
                    Palata 406
                </option>

                <option value="407">
                    Palata 407
                </option>

                <option value="408">
                    Palata 408
                </option>

            </select>

            <button
                class="changeRoom"
                onclick="palataSeciminiYaddaSaxla()"
            >
                ✅ Palatanı seç
            </button>

            <div
                id="selectedRoom"
                class="selectedRoom"
            ></div>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            🚪 Çıxış
        </button>

    </div>


    <div class="card">

        <h2>🔔 Xəstə çağırışları</h2>

        <div id="cagirislar">

            <div class="empty">
                Əvvəlcə palata seçin.
            </div>

        </div>

    </div>


    <div class="card">

        <h2>🎙️ Səsli mesajlar</h2>

        <div id="sesler">

            <div class="empty">
                Əvvəlcə palata seçin.
            </div>

        </div>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://medlive.onrender.com";

let aktivUser = null;
let aktivPalata = null;

let sonCagirisId = null;
let ringtoneInterval = null;
let audioContext = null;


// ==========================================
// LOGIN
// ==========================================

async function login() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const status =
        document
        .getElementById("loginStatus");


    if (!username || !password) {

        status.textContent =
            "❌ İstifadəçi adı və şifrəni yazın.";

        return;
    }


    status.textContent =
        "⏳ Giriş edilir...";


    try {

        const response =
            await fetch(
                BACKEND_URL + "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            username,

                        password:
                            password

                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            status.textContent =
                "❌ " +
                (
                    data.message ||
                    "Login məlumatları yanlışdır."
                );

            return;
        }


        aktivUser =
            data.user;


        sessionStorage.setItem(
            "medliveUser",
            JSON.stringify(
                aktivUser
            )
        );


        // Telefon/brauzerdə səs konteksti
        // login klikindən sonra aktivləşir.

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        paneliGoster();

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "❌ Serverə qoşulmaq olmadı.";

    }
}


// ==========================================
// PANELİ GÖSTƏR
// ==========================================

function paneliGoster() {

    document
        .getElementById("loginPage")
        .classList
        .add("hidden");


    document
        .getElementById("panel")
        .classList
        .remove("hidden");


    document
        .getElementById("userInfo")
        .textContent =
        "🟢 Xoş gəldiniz, " +
        (aktivUser.ad || aktivUser.username) +
        "!";


    const yaddaQalanPalata =
        sessionStorage.getItem(
            "medlivePalata"
        );


    if (yaddaQalanPalata) {

        aktivPalata =
            yaddaQalanPalata;


        document
            .getElementById("palataSec")
            .value =
            aktivPalata;


        palataEkrandaGoster();

        cagirislarGetir();

        sesleriGetir();

    }

}


// ==========================================
// PALATA SEÇ
// ==========================================

function palataSeciminiYaddaSaxla() {

    const select =
        document
        .getElementById("palataSec");


    const palata =
        select.value;


    if (!palata) {

        alert(
            "❗ Əvvəlcə palata seçin."
        );

        return;
    }


    aktivPalata =
        palata;


    sessionStorage.setItem(
        "medlivePalata",
        aktivPalata
    );


    // Yeni palataya keçəndə
    // son ID-ni sıfırlayırıq.

    sonCagirisId = null;


    palataEkrandaGoster();

    cagirislarGetir();

    sesleriGetir();

}


// ==========================================
// SEÇİLƏN PALATANI GÖSTƏR
// ==========================================

function palataEkrandaGoster() {

    document
        .getElementById("selectedRoom")
        .textContent =
        "🟢 Hazırda baxdığınız palata: " +
        aktivPalata;

}


// ==========================================
// ÇIXIŞ
// ==========================================

function logout() {

    ringtoneDayandir();

    sessionStorage.removeItem(
        "medliveUser"
    );

    sessionStorage.removeItem(
        "medlivePalata"
    );

    location.reload();

}


// ==========================================
// SESSION YOXLA
// ==========================================

function sessionYoxla() {

    const saved =
        sessionStorage.getItem(
            "medliveUser"
        );


    if (!saved) {
        return;
    }


    try {

        aktivUser =
            JSON.parse(saved);

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        paneliGoster();

    }

    catch {

        sessionStorage.removeItem(
            "medliveUser"
        );

    }

}


// ==========================================
// UZUN ZƏNG SƏSİ
// ==========================================

function zengSesi() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    // Artıq zəng çalırsa yenisini
    // başlatma.

    if (ringtoneInterval) {
        return;
    }


    let say = 0;


    function beep() {

        if (say >= 12) {

            clearInterval(
                ringtoneInterval
            );

            ringtoneInterval = null;

            return;
        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            say % 2 === 0
                ? 880
                : 660;


        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.35,
            audioContext.currentTime + 0.05
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + 0.9
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.9
        );


        say++;

    }


    beep();


    ringtoneInterval =
        setInterval(
            beep,
            1100
        );

}


// ==========================================
// ZƏNGİ DAYANDIR
// ==========================================

function ringtoneDayandir() {

    if (ringtoneInterval) {

        clearInterval(
            ringtoneInterval
        );

        ringtoneInterval = null;

    }

}


// ==========================================
// 407 YENİ ÇAĞIRIŞ YOXLAMASI
// ==========================================

async function 407Yoxla() {

    // Yalnız 407 seçilibsə işləsin.

    if (
        String(aktivPalata) !== "407"
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/cagirislar"
            );


        const data =
            await response.json();


        let list = [];


        // Server massiv qaytarır.

        if (
            Array.isArray(data)
        ) {

            list = data;

        }

        else if (
            data &&
            Array.isArray(
                data.cagirislar
            )
        ) {

            list =
                data.cagirislar;

        }


        const yeni407 =
            list
            .filter(
                cagiris =>
                    String(
                        cagiris.palata
                    ) === "407" &&
                    (
                        cagiris.status ===
                        "yeni" ||
                        cagiris.status ===
                        "new"
                    )
            )
            .sort(
                (a, b) =>
                    Number(b.id) -
                    Number(a.id)
            );


        if (
            yeni407.length === 0
        ) {

            return;

        }


        const son =
            yeni407[0];


        const yeniId =
            Number(son.id);


        // İlk yoxlamada mövcud çağırışa
        // zəng çalmasın.

        if (
            sonCagirisId === null
        ) {

            sonCagirisId =
                yeniId;

            return;

        }


        // Yeni çağırış gəlibsə.

        if (
            yeniId >
            sonCagirisId
        ) {

            sonCagirisId =
                yeniId;


            // Səhifəni yeniləmədən siyahını dəyiş.

            await cagirislarGetir();


            // Uzun zəng.

            zengSesi();

        }

    }

    catch (error) {

        console.error(
            "407 yoxlama xətası:",
            error
        );

    }

}


// ==========================================
// HƏR 2 SANİYƏDƏ 407-Nİ YOXLAYIR
// ==========================================

setInterval(
    407Yoxla,
    2000
);


// ==========================================
// ÇAĞIRIŞLARI GƏTİR
// ==========================================

async function cagirislarGetir() {

    const box =
        document
        .getElementById(
            "cagirislar"
        );


    if (!aktivPalata) {

        box.innerHTML =
            `
            <div class="empty">
                🏥 Əvvəlcə palata seçin.
            </div>
            `;

        return;
    }


    box.innerHTML =
        `
        <div class="empty">
            ⏳ Palata ${aktivPalata}
            çağırışları yüklənir...
        </div>
        `;


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/cagirislar"
            );


        const data =
            await response.json();


        let list = [];


        if (
            Array.isArray(data)
        ) {

            list = data;

        }

        else if (
            data &&
            Array.isArray(
                data.cagirislar
            )
        ) {

            list =
                data.cagirislar;

        }


        list =
            list.filter(
                cagiris =>
                    String(
                        cagiris.palata
                    ) ===
                    String(
                        aktivPalata
                    )
            );


        if (list.length === 0) {

            box.innerHTML =
                `
                <div class="empty">
                    🔔 Palata ${aktivPalata}
                    üçün yeni çağırış yoxdur.
                </div>
                `;

            return;
        }


        box.innerHTML = "";


        list
            .sort(
                (a, b) =>
                    Number(b.id) -
                    Number(a.id)
            )
            .forEach(
                cagiris =>
                    cagirisGoster(
                        cagiris
                    )
            );

    }

    catch (error) {

        console.error(error);


        box.innerHTML =
            `
            <div class="empty">
                ❌ Çağırışları yükləmək olmadı.
            </div>
            `;

    }

}


// ==========================================
// ÇAĞIRIŞ GÖSTƏR
// ==========================================

function cagirisGoster(cagiris) {

    const box =
        document
        .getElementById(
            "cagirislar"
        );


    const div =
        document
        .createElement(
            "div"
        );


    const status =
        cagiris.status;


    div.className =
        "request " +
        (
            status === "accepted" ||
            status === "qebul edildi"
                ? "accepted"
                : "new"
        );


    const tarix =
        new Date(
            cagiris.vaxt
        ).toLocaleString(
            "az-AZ"
        );


    let qebul = "";


    if (
        status === "accepted" ||
        status === "qebul edildi"
    ) {

        qebul =
            `
            <p>
                ✅ Qəbul edildi
                ${
                    cagiris.qebulEden
                    ? " — " +
                      escapeHTML(
                          cagiris.qebulEden
                      )
                    : ""
                }
            </p>
            `;

    }


    div.innerHTML = `

        <div class="room">
            🛏️ Palata
            ${escapeHTML(
                String(
                    cagiris.palata
                )
            )}
        </div>

        <div
            style="
                margin-top:10px;
                font-size:18px;
            "
        >
            ${escapeHTML(
                cagiris.istek || ""
            )}
        </div>

        <div class="time">
            🕒 ${tarix}
        </div>

        ${qebul}

        <div class="actions">

            ${
                (
                    status !== "accepted" &&
                    status !== "qebul edildi"
                )
                ?
                `
                <button
                    class="accept"
                    onclick="
                        qebulEt(
                            ${Number(
                                cagiris.id
                            )}
                        )
                    "
                >
                    ✅ Qəbul et
                </button>
                `
                :
                ""
            }

            <button
                class="delete"
                onclick="
                    cagirisSil(
                        ${Number(
                            cagiris.id
                        )}
                    )
                "
            >
                🗑️ Sil
            </button>

        </div>

    `;


    box.appendChild(div);

}


// ==========================================
// QƏBUL ET
// ==========================================

async function qebulEt(id) {

    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/cagir/" +
                id +
                "/qebul",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        qebulEden:
                            aktivUser.ad ||
                            aktivUser.username

                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Qəbul etmək olmadı."
            );

            return;
        }


        ringtoneDayandir();

        await cagirislarGetir();

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Serverə qoşulmaq olmadı."
        );

    }

}


// ==========================================
// ÇAĞIRIŞI SİL
// ==========================================

async function cagirisSil(id) {

    const tesdiq =
        confirm(
            "Bu çağırışı həqiqətən silmək istəyirsiniz?"
        );


    if (!tesdiq) {
        return;
    }


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/cagir/" +
                id,
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Silinmədi."
            );

            return;
        }


        ringtoneDayandir();

        await cagirislarGetir();

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Serverə qoşulmaq olmadı."
        );

    }

}


// ==========================================
// SƏSLƏRİ GƏTİR
// ==========================================

async function sesleriGetir() {

    const box =
        document
        .getElementById(
            "sesler"
        );


    if (!aktivPalata) {

        box.innerHTML =
            `
            <div class="empty">
                🎙️ Əvvəlcə palata seçin.
            </div>
            `;

        return;
    }


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/sesler"
            );


        const data =
            await response.json();


        let list = [];


        if (
            Array.isArray(data)
        ) {

            list = data;

        }

        else if (
            data &&
            Array.isArray(
                data.sesler
            )
        ) {

            list =
                data.sesler;

        }


        list =
            list.filter(
                ses =>
                    String(
                        ses.palata
                    ) ===
                    String(
                        aktivPalata
                    )
            );


        if (list.length === 0) {

            box.innerHTML =
                `
                <div class="empty">
                    🎙️ Palata ${aktivPalata}
                    üçün yeni səs yoxdur.
                </div>
                `;

            return;
        }


        box.innerHTML = "";


        list
            .sort(
                (a, b) =>
                    Number(b.id) -
                    Number(a.id)
            )
            .forEach(
                ses =>
                    sesGoster(ses)
            );

    }

    catch (error) {

        console.error(error);


        box.innerHTML =
            `
            <div class="empty">
                ❌ Səsləri yükləmək olmadı.
            </div>
            `;

    }

}


// ==========================================
// SƏS GÖSTƏR
// ==========================================

function sesGoster(ses) {

    const box =
        document
        .getElementById(
            "sesler"
        );


    const div =
        document
        .createElement(
            "div"
        );


    div.className =
        "voice";


    const tarix =
        new Date(
            ses.vaxt
        ).toLocaleString(
            "az-AZ"
        );


    const audioUrl =
        "data:" +
        ses.mimetype +
        ";base64," +
        ses.audio;


    div.innerHTML = `

        <strong>
            🎙️ Palata
            ${escapeHTML(
                String(
                    ses.palata
                )
            )}
        </strong>

        <div class="time">
            🕒 ${tarix}
        </div>

        <audio
            controls
            src="${audioUrl}"
        ></audio>

        <button
            class="delete"
            onclick="
                sesSil(
                    ${Number(ses.id)}
                )
            "
        >
            🗑️ Səsi sil
        </button>

    `;


    box.appendChild(div);

}


// ==========================================
// SƏSİ SİL
// ==========================================

async function sesSil(id) {

    const tesdiq =
        confirm(
            "Bu səsli mesajı silmək istəyirsiniz?"
        );


    if (!tesdiq) {
        return;
    }


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/ses/" +
                id,
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Səs silinmədi."
            );

            return;
        }


        await sesleriGetir();

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Serverə qoşulmaq olmadı."
        );

    }

}

function escapeHTML(text) {

    const div =
        document
        .createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}

sessionYoxla();
