<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172b3a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:68px;
    background:#102a43;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:.8px;
}

.room{
    color:#c8d5e2;
    font-size:15px;
    font-weight:600;
}

#status{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#526579;
    font-size:18px;
    font-weight:600;
}

#startPanel{
    width:min(680px,90vw);
    margin:35px auto;
    background:#fff;
    border:1px solid #e3e9ef;
    border-radius:28px;
    padding:42px 30px;
    text-align:center;
    box-shadow:0 18px 50px rgba(16,42,67,.08);
}

.startTitle{
    font-size:30px;
    font-weight:800;
    color:#102a43;
    margin-bottom:14px;
}

.startText{
    color:#718096;
    font-size:16px;
    line-height:1.6;
    margin-bottom:28px;
}

#start{
    border:0;
    background:#102a43;
    color:#fff;
    padding:20px 35px;
    border-radius:16px;
    font-size:18px;
    font-weight:700;
}

#video{
    display:none;
}

/* =========================
   KALİBRASİYA
========================= */

#calibration{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#f5f7fa;
}

.calTitle{
    position:absolute;
    top:28px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:23px;
    font-weight:800;
    color:#102a43;
}

.calText{
    position:absolute;
    top:68px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:15px;
    color:#718096;
}

.point{
    display:none;
    position:absolute;
    width:28px;
    height:28px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#c62828;
    border:5px solid white;
    box-shadow:0 0 0 7px rgba(198,40,40,.14);
}

.point.active{
    display:block;
}

/* =========================
   HƏ / YOX
========================= */

#choices{
    display:none;

    width:100%;
    height:calc(100vh - 138px);

    padding:25px 20px 70px;

    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    gap:70px;
}

.choice{
    width:min(650px,78vw);
    height:240px;

    border:0;
    border-radius:30px;

    color:#fff;

    font-size:58px;
    font-weight:800;

    box-shadow:
        0 18px 45px rgba(16,42,67,.12);

    transition:
        transform .18s,
        box-shadow .18s;
}

.yes{
    background:#147d64;
}

.no{
    background:#344054;
}

.choice.active{
    transform:scale(1.045);

    box-shadow:
        0 0 0 8px rgba(16,42,67,.12),
        0 22px 50px rgba(16,42,67,.18);
}

/* =========================
   PROGRESS
========================= */

#progress{
    display:none;
    position:fixed;
    left:20%;
    right:20%;
    bottom:25px;
    height:8px;
    background:#dce3ea;
    border-radius:20px;
    overflow:hidden;
}

#bar{
    width:0%;
    height:100%;
    background:#102a43;
}

#reset{
    display:none;
    position:fixed;
    right:15px;
    top:78px;
    z-index:200;
    border:0;
    background:transparent;
    color:#718096;
    font-size:12px;
}

@media(max-width:650px){

    header{
        height:60px;
        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{
        font-size:13px;
    }

    #status{
        height:60px;
        font-size:15px;
    }

    #startPanel{
        margin-top:25px;
        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    .startText{
        font-size:15px;
    }

    #choices{
        height:calc(100vh - 120px);
        padding:25px 18px 65px;
        gap:55px;
    }

    .choice{
        width:78vw;
        height:210px;
        font-size:42px;
        border-radius:25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MEDELIN</div>
    <div class="room">PALATA 402</div>
</header>

<div id="status">
    Sistem hazır deyil
</div>

<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>

<video id="video" autoplay playsinline></video>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə sakit şəkildə baxın
    </div>

    <!-- 1 MƏRKƏZ -->

    <div class="point"
         data-key="center"
         style="left:50%;top:50%">
    </div>

    <!-- 2 SOL -->

    <div class="point"
         data-key="left"
         style="left:15%;top:50%">
    </div>

    <!-- 3 SAĞ -->

    <div class="point"
         data-key="right"
         style="left:85%;top:50%">
    </div>

    <!-- 4 YUXARI -->

    <div class="point"
         data-key="up"
         style="left:50%;top:22%">
    </div>

    <!-- 5 AŞAĞI -->

    <div class="point"
         data-key="down"
         style="left:50%;top:78%">
    </div>

</div>


<!-- =========================
     HƏ YUXARIDA
     YOX AŞAĞIDA
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>

    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">
    <div id="bar"></div>
</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =====================================================
   ELEMENTLƏR
===================================================== */

const video =
document.getElementById("video");

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    ...document.querySelectorAll(".point")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =====================================================
   PARAMETRLƏR
===================================================== */

const STORAGE_KEY =
"MEDELIN_402_VERTICAL_V3";

const POINT_TIME =
1600;

const DWELL_TIME =
1800;

const SMOOTH =
0.10;


/* =====================================================
   DƏYİŞƏNLƏR
===================================================== */

let running = false;

let collecting = false;

let calibrationData = null;

let lastEyeX = .5;

let lastEyeY = .5;

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStarted = 0;

let locked = false;


/* =====================================================
   MEDIAPIPE
===================================================== */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


/* =====================================================
   ORTAQ NÖQTƏ
===================================================== */

function average(
    landmarks,
    indexes
){

    let x = 0;
    let y = 0;
    let count = 0;


    for(
        const index of indexes
    ){

        if(!landmarks[index]){
            continue;
        }

        x +=
        landmarks[index].x;

        y +=
        landmarks[index].y;

        count++;

    }


    if(!count){
        return null;
    }


    return {

        x:x/count,

        y:y/count

    };

}


/* =====================================================
   GÖZ İSTİQAMƏTİ
===================================================== */

function getEye(
    landmarks
){

    const leftIris =
    average(
        landmarks,
        [468,469,470,471,472]
    );


    const rightIris =
    average(
        landmarks,
        [473,474,475,476,477]
    );


    if(
        !leftIris ||
        !rightIris
    ){

        return null;

    }


    const lo =
    landmarks[33];

    const li =
    landmarks[133];

    const lt =
    landmarks[159];

    const lb =
    landmarks[145];


    const ri =
    landmarks[362];

    const ro =
    landmarks[263];

    const rt =
    landmarks[386];

    const rb =
    landmarks[374];


    if(
        !lo || !li ||
        !lt || !lb ||
        !ri || !ro ||
        !rt || !rb
    ){

        return null;

    }


    const leftWidth =
    Math.max(
        Math.abs(
            li.x-lo.x
        ),
        .0001
    );


    const rightWidth =
    Math.max(
        Math.abs(
            ro.x-ri.x
        ),
        .0001
    );


    const leftHeight =
    Math.max(
        Math.abs(
            lb.y-lt.y
        ),
        .0001
    );


    const rightHeight =
    Math.max(
        Math.abs(
            rb.y-rt.y
        ),
        .0001
    );


    const lx =
    (leftIris.x-lo.x) /
    leftWidth;


    const rx =
    (rightIris.x-ri.x) /
    rightWidth;


    const ly =
    (leftIris.y-lt.y) /
    leftHeight;


    const ry =
    (rightIris.y-rt.y) /
    rightHeight;


    return {

        x:(lx+rx)/2,

        y:(ly+ry)/2

    };

}


/* =====================================================
   FACE NƏTİCƏLƏRİ
===================================================== */

faceMesh.onResults(
function(results){

    if(!running){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    const eye =
    getEye(
        results.multiFaceLandmarks[0]
    );


    if(!eye){
        return;
    }


    lastEyeX =
    eye.x;

    lastEyeY =
    eye.y;


    /*
       Kalibrasiya zamanı
       heç nə etmə.
    */

    if(collecting){
        return;
    }


    /*
       Kalibrasiya hazırdırsa
       göz istiqamətini hesabla.
    */

    if(
        calibrationData
    ){

        const position =
        predictGaze(
            eye.x,
            eye.y
        );


        updateGaze(
            position.x,
            position.y
        );

    }

});


/* =====================================================
   SİSTEMİ BAŞLAT
===================================================== */

async function startSystem(){

    start.disabled =
    true;


    statusBox.innerText =
    "Kamera hazırlanır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                }
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running =
        true;


        startPanel.style.display =
        "none";


        statusBox.innerText =
        "Göz sistemi hazırlanır...";


        const camera =
        new Camera(
            video,
            {

                onFrame:
                async function(){

                    try{

                        await faceMesh.send({
                            image:video
                        });

                    }
                    catch(error){

                        console.log(error);

                    }

                },

                width:640,

                height:480

            }
        );


        camera.start();


        setTimeout(
            begin,
            1500
        );

    }
    catch(error){

        console.error(error);

        statusBox.innerText =
        "Kamera açıla bilmədi";

        start.disabled =
        false;

    }

}


/* =====================================================
   BAŞLA
===================================================== */

function begin(){

    const saved =
    localStorage.getItem(
        STORAGE_KEY
    );


    if(saved){

        try{

            const data =
            JSON.parse(saved);


            if(
                data.center &&
                data.left &&
                data.right &&
                data.up &&
                data.down
            ){

                calibrationData =
                data;

                showChoices();

                return;

            }

        }
        catch(error){

            localStorage.removeItem(
                STORAGE_KEY
            );

        }

    }


    startCalibration();

}


/* =====================================================
   KALİBRASİYA
===================================================== */

function startCalibration(){

    calibrationData = {

        center:null,
        left:null,
        right:null,
        up:null,
        down:null

    };


    calibration.style.display =
    "block";


    choices.style.display =
    "none";


    progress.style.display =
    "none";


    reset.style.display =
    "none";


    let index = 0;


    function nextPoint(){

        points.forEach(
            p =>
            p.classList.remove(
                "active"
            )
        );


        /*
           5 nöqtə bitdi
        */

        if(
            index >=
            points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        const key =
        point.dataset.key;


        point.classList.add(
            "active"
        );


        statusBox.innerText =
        "Nöqtəyə baxın  " +
        (index+1) +
        " / 5";


        collecting =
        true;


        /*
           Bu nöqtəyə baxmaq
           üçün 1.6 saniyə.
        */

        setTimeout(
        function(){

            collecting =
            false;


            const rect =
            point.getBoundingClientRect();


            /*
               Son görülən göz
               koordinatını saxla.
            */

            calibrationData[key] = {

                eyeX:
                lastEyeX,

                eyeY:
                lastEyeY,

                screenX:
                rect.left+
                rect.width/2,

                screenY:
                rect.top+
                rect.height/2

            };


            index++;


            setTimeout(
                nextPoint,
                300
            );

        },
        POINT_TIME
        );

    }


    nextPoint();

}


/* =====================================================
   KALİBRASİYA BİTİR
===================================================== */

function finishCalibration(){

    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            calibrationData
        )
    );


    calibration.style.display =
    "none";


    showChoices();

}


/* =====================================================
   HƏ / YOX EKRANI
===================================================== */

function showChoices(){

    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    reset.style.display =
    "block";


    gazeX =
    null;

    gazeY =
    null;

    currentButton =
    null;

    lookStarted =
    0;


    statusBox.innerText =
    "Hazırdır — HƏ və ya YOX-a bax";

}


/* =====================================================
   GÖZÜ EKRANA XƏRİTƏLƏ
===================================================== */

function predictGaze(
    x,
    y
){

    const left =
    calibrationData.left;

    const right =
    calibrationData.right;

    const up =
    calibrationData.up;

    const down =
    calibrationData.down;


    /*
       X oxu
    */

    let nx =
    (x-left.eyeX) /
    Math.max(
        right.eyeX-left.eyeX,
        .0001
    );


    /*
       Y oxu

       YUXARI = HƏ
       AŞAĞI = YOX
    */

    let ny =
    (y-up.eyeY) /
    Math.max(
        down.eyeY-up.eyeY,
        .0001
    );


    nx =
    Math.max(
        0,
        Math.min(
            1,
            nx
        )
    );


    ny =
    Math.max(
        0,
        Math.min(
            1,
            ny
        )
    );


    /*
       Ekran koordinatı

       YUXARI hissə:
       HƏ

       AŞAĞI hissə:
       YOX
    */

    const screenX =
    window.innerWidth/2;


    const screenY =
    window.innerHeight *
    (
        .22 +
        ny*.56
    );


    return {

        x:screenX,

        y:screenY

    };

}


/* =====================================================
   GÖZÜ YUMŞALT
===================================================== */

function updateGaze(
    x,
    y
){

    if(
        gazeX === null
    ){

        gazeX =
        x;

        gazeY =
        y;

    }
    else{

        gazeX +=
        (x-gazeX) *
        SMOOTH;


        gazeY +=
        (y-gazeY) *
        SMOOTH;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =====================================================
   HƏ / YOX SEÇ
===================================================== */

function checkButton(
    x,
    y
){

    if(locked){
        return;
    }


    let target =
    null;


    /*
       Yalnız Y koordinatına
       əsaslanırıq.

       Ekranın yuxarısı:
       HƏ

       Ekranın aşağısı:
       YOX
    */

    const middle =
    window.innerHeight/2;


    /*
       YUXARI ZONA
    */

    if(
        y <
        middle-35
    ){

        target =
        buttons[0];

    }


    /*
       AŞAĞI ZONA
    */

    else if(
        y >
        middle+35
    ){

        target =
        buttons[1];

    }


    /*
       Ortada qalırsa
       seçim dəyişmir.
    */

    else{

        return;

    }


    /*
       Yeni düymə
    */

    if(
        target !==
        currentButton
    ){

        currentButton =
        target;


        lookStarted =
        Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       Eyni düyməyə
       sabit baxış
    */

    const elapsed =
    Date.now() -
    lookStarted;


    const percent =
    Math.min(
        100,
        elapsed /
        DWELL_TIME *
        100
    );


    bar.style.width =
    percent+"%";


    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =====================================================
   SEÇİM
===================================================== */

function selectButton(
    button
){

    if(locked){
        return;
    }


    locked =
    true;


    const action =
    button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
        "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
        "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked =
        false;


        currentButton =
        null;


        lookStarted =
        0;


        gazeX =
        null;


        gazeY =
        null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
        "0%";


        statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

    },
    1200
    );

}


/* =====================================================
   YENİDƏN KALİBRASİYA
===================================================== */

reset.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            STORAGE_KEY
        );


        calibrationData =
        null;


        gazeX =
        null;

        gazeY =
        null;


        startCalibration();

    }
);


/* =====================================================
   START
===================================================== */

start.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
