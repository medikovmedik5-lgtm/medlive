<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef5fb;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #172b4d;
}

header {
  background: #1976b9;
  color: white;
  padding: 25px 10px;
  font-size: 30px;
  font-weight: bold;
}

.status {
  background: white;
  margin: 30px 0 20px;
  padding: 20px;
  border-radius: 20px;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.dot {
  display: inline-block;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: red;
  margin-right: 8px;
}

.main {
  max-width: 850px;
  margin: auto;
  padding: 10px 20px 40px;
}

h1 {
  font-size: 30px;
}

.info {
  font-size: 20px;
  line-height: 1.5;
  margin: 20px 0 30px;
}

#startBtn {
  width: 90%;
  max-width: 650px;
  padding: 24px;
  border: 0;
  border-radius: 22px;
  background: #1976b9;
  color: white;
  font-size: 23px;
  font-weight: bold;
}

#choices {
  display: none;
  margin-top: 30px;
  gap: 18px;
  flex-direction: column;
}

.choice {
  border: 0;
  border-radius: 25px;
  min-height: 130px;
  color: white;
  font-size: 32px;
  font-weight: bold;
}

#yes {
  background: #22a447;
}

#call {
  background: #e53935;
}

#no {
  background: #555;
}

.selected {
  outline: 8px solid #ffd600;
  transform: scale(1.02);
}

#gazeText {
  margin-top: 25px;
  font-size: 20px;
  min-height: 35px;
}

.warning {
  margin-top: 40px;
  color: #777;
  font-size: 14px;
}

/* KAMERA TAM GİZLİDİR */
#camera {
  position: fixed;
  left: -10000px;
  top: -10000px;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

@media (min-width: 650px) {

  #choices {
    flex-direction: row;
  }

  .choice {
    flex: 1;
    min-height: 180px;
  }
}
</style>
</head>

<body>

<header>
🏥 MEDELIN — PALATA 402
</header>

<div class="status">
<span class="dot" id="dot"></span>
<span id="statusText">
Göz izləmə sistemi hazır deyil
</span>
</div>

<div class="main">

<h1>👁️ Gözlə idarəetmə</h1>

<div class="info">
Kamera sizi görür, amma görüntünüz ekranda göstərilmir.
<br>
Seçimə baxaraq cavab vermək üçün sistemi başladın.
</div>

<button id="startBtn">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="choices">

<button class="choice" id="yes">
HƏ
</button>

<button class="choice" id="call">
🚨 OTAĞA GƏL
</button>

<button class="choice" id="no">
YOX
</button>

</div>

<div id="gazeText"></div>

<div class="warning">
Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
</div>

</div>

<video id="camera" autoplay playsinline muted></video>

<script>

const video = document.getElementById("camera");

const startBtn = document.getElementById("startBtn");
const choices = document.getElementById("choices");

const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");
const gazeText = document.getElementById("gazeText");

let running = false;


/* =========================
   SƏS
========================= */

function speak(text) {

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang = "az-AZ";
  voice.rate = 0.85;

  speechSynthesis.speak(voice);
}


/* =========================
   DÜYMƏ SEÇİMİ
========================= */

function selectButton(button) {

  document.querySelectorAll(".choice").forEach(b => {
    b.classList.remove("selected");
  });

  button.classList.add("selected");

  const text = button.innerText;

  gazeText.innerText = "Seçildi: " + text;

  speak(text);

  if (button.id === "call") {

    console.log("PALATA 402 → OTAĞA GƏL");

    // Gələcəkdə burada tibb bacısına
    // real bildiriş göndəriləcək.
  }
}


/* =========================
   MEDIAPIPE
========================= */

const faceMesh = new FaceMesh({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});

faceMesh.setOptions({

  maxNumFaces: 1,

  refineLandmarks: true,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


/* =========================
   ÜZ TAPILANDA
========================= */

faceMesh.onResults((results) => {

  if (!running) return;

  if (
    results.multiFaceLandmarks &&
    results.multiFaceLandmarks.length > 0
  ) {

    statusText.innerText =
      "🟢 Kamera aktivdir — gözlər izlənilir";

    dot.style.background = "#20b957";

    /*
      Burada göz landmark-ları alınır.

      Sol iris:
      468

      Sağ iris:
      473

      Bu məlumat sonrakı mərhələdə
      ekrandakı koordinata çevriləcək.
    */

    const face = results.multiFaceLandmarks[0];

    const leftIris = face[468];
    const rightIris = face[473];

    console.log(
      "Göz:",
      leftIris.x,
      leftIris.y,
      rightIris.x,
      rightIris.y
    );

    gazeText.innerText =
      "👁️ Gözlər aşkar edildi";

  } else {

    statusText.innerText =
      "🟡 Üz görünmür — kameraya baxın";

    dot.style.background = "#ff9800";

    gazeText.innerText =
      "Kameraya baxın";
  }

});


/* =========================
   BAŞLAT
========================= */

startBtn.addEventListener("click", async () => {

  if (running) return;

  try {

    statusText.innerText =
      "🟡 Kamera açılır...";

    /*
      TELEFON KAMERASINI AÇIRIQ
      AMMA VIDEO EKRANDA GÖRÜNMÜR.
    */

    const stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user",
        width: {
          ideal: 640
        },
        height: {
          ideal: 480
        }
      },

      audio: false

    });

    video.srcObject = stream;

    await video.play();

    running = true;

    startBtn.style.display = "none";

    choices.style.display = "flex";

    statusText.innerText =
      "🟢 Kamera aktivdir — sizi görür, görüntü göstərilmir.";

    dot.style.background = "#20b957";


    /*
      MEDIAPIPE KAMERA
    */

    const camera = new Camera(video, {

      onFrame: async () => {

        await faceMesh.send({
          image: video
        });

      },

      width: 640,
      height: 480

    });

    camera.start();

  }

  catch (error) {

    console.error(error);

    statusText.innerText =
      "🔴 Kamera açıla bilmədi";

    dot.style.background = "red";

    gazeText.innerText =
      "Telefonun kamera icazəsini yoxlayın.";

  }

});


/* =========================
   DÜYMƏLƏRƏ TOXUNMA TESTİ
========================= */

document.getElementById("yes").addEventListener(
  "click",
  function() {
    selectButton(this);
  }
);

document.getElementById("call").addEventListener(
  "click",
  function() {
    selectButton(this);
  }
);

document.getElementById("no").addEventListener(
  "click",
  function() {
    selectButton(this);
  }
);

</script>

</body>
</html>
