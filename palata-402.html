<style>

}

   KALİBRASİYA
================================================= */

#calibration{

    display:none;

    inset:0;

.point{

    display:none;

    position:absolute;

    width:28px;

    height:28px;

    transform:
        translate(-50%,-50%);

    border:5px solid white;

    box-shadow:

/* =================================================
   HƏ / YOX
================================================= */

#choices{

    display:none;

    position:fixed;

    top:68px;

    left:0;

    bottom:0;

    width:100%;

    justify-content:center !important;

    gap:90px !important;
}


.choice{

    display:flex;

    flex:none !important;

    width:min(680px,82vw);

    height:230px;

    margin:0 !important;

    border:0;

    border-radius:32px;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:60px;

    font-weight:800;

    box-shadow:
        0 18px 45px
        rgba(16,42,67,.12);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.yes{

}


.no{

}


.choice.active{

    transform:scale(1.035);

    box-shadow:

        0 0 0 8px
        rgba(16,42,67,.12),

}


/* =================================================
   PROGRESS
================================================= */

#progress{

    display:none;

    position:fixed;

    }

    }

    }


    #status{

    }

    }

            25px 18px

        flex-direction:column !important;

        flex-wrap:nowrap !important;

        align-items:center !important;

        justify-content:center !important;

        gap:85px !important;
    }


    .choice{

        width:82vw;

        height:205px;

        flex:none !important;

    }

}


@media(max-width:400px){

    #choices{

        gap:70px !important;
    }


    .choice{

        width:84vw;

    }

}

</style>

<body>


<header>

    <div class="logo">
        MEDELIN
    </div>

    <div class="room">
        PALATA 402
    </div>

</header>


<div id="status">
    Sistem hazır deyil
</div>


<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>


<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =================================================
     KALİBRASİYA
================================================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə sakit şəkildə baxın
    </div>


    <div
        class="point"
        data-key="center"
        style="left:50%;top:50%;">
    </div>


    <div
        class="point"
        data-key="left"
        style="left:15%;top:50%;">
    </div>


    <div
        class="point"
        data-key="right"
        style="left:85%;top:50%;">
    </div>


    <div
        class="point"
        data-key="up"
        style="left:50%;top:22%;">
    </div>


    <div
        class="point"
        data-key="down"
        style="left:50%;top:78%;">
    </div>

</div>


<!-- =================================================
     SEÇİMLƏR
================================================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>


    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">

    <div id="bar"></div>

</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const video =
document.getElementById("video");

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    ...document.querySelectorAll(".point")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =================================================
   PARAMETRLƏR
================================================= */

const STORAGE_KEY =
"MEDELIN_402_EYE_ACCURATE_V5";


/*
   Hər nöqtə üçün ümumi vaxt
*/

const CALIBRATION_TIME =
2300;


/*
   İlk hissə gözün
   yerləşməsinə getsin.
*/

const SETTLE_TIME =
500;


/*
   Seçim üçün əvvəlkindən
   bir az daha rahat
*/

const DWELL_TIME =
1500;


/*
   Göz smoothing
*/

const SMOOTH =
0.22;


/*
   Səhv dəyişmənin qarşısı
*/

const SWITCH_CONFIRM =
250;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let running =
false;


let collecting =
false;


let calibrationData =
null;


/*
   Hazırkı kalibrasiya
   nümunələri
*/

let samples =
[];


let gazeX =
null;


let gazeY =
null;


let currentButton =
null;


let candidateButton =
null;


let candidateSince =
0;


let lookStarted =
0;


let locked =
false;


/* =================================================
   MEDIAPIPE
================================================= */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return
        "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
        + file;

    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.60,

    minTrackingConfidence:0.60

});


/* =================================================
   ORTAQ NÖQTƏ
================================================= */

function average(
    landmarks,
    indexes
){

    let x =
    0;

    let y =
    0;

    let count =
    0;


    for(
        const index of indexes
    ){

        if(
            !landmarks[index]
        ){

            continue;

        }


        x +=
        landmarks[index].x;


        y +=
        landmarks[index].y;


        count++;

    }


    if(
        count === 0
    ){

        return null;

    }


    return {

        x:
        x/count,

        y:
        y/count

    };

}


/* =================================================
   MEDİAN
================================================= */

function median(values){

    if(
        !values.length
    ){

        return 0.5;

    }


    const sorted =
    [...values].sort(
        (a,b)=>a-b
    );


    const middle =
    Math.floor(
        sorted.length/2
    );


    if(
        sorted.length % 2
    ){

        return sorted[middle];

    }


    return (
        sorted[middle-1] +
        sorted[middle]
    ) / 2;

}


/* =================================================
   GÖZ FEATURE
================================================= */

function getEye(
    landmarks
){

    const leftIris =
    average(
        landmarks,
        [
            468,
            469,
            470,
            471,
            472
        ]
    );


    const rightIris =
    average(
        landmarks,
        [
            473,
            474,
            475,
            476,
            477
        ]
    );


    if(
        !leftIris ||
        !rightIris
    ){

        return null;

    }


    const lo =
    landmarks[33];

    const li =
    landmarks[133];

    const lt =
    landmarks[159];

    const lb =
    landmarks[145];


    const ri =
    landmarks[362];

    const ro =
    landmarks[263];

    const rt =
    landmarks[386];

    const rb =
    landmarks[374];


    if(
        !lo || !li ||
        !lt || !lb ||
        !ri || !ro ||
        !rt || !rb
    ){

        return null;

    }


    const leftWidth =
    Math.max(
        Math.abs(
            li.x-lo.x
        ),
        0.0001
    );


    const rightWidth =
    Math.max(
        Math.abs(
            ro.x-ri.x
        ),
        0.0001
    );


    const leftHeight =
    Math.max(
        Math.abs(
            lb.y-lt.y
        ),
        0.0001
    );


    const rightHeight =
    Math.max(
        Math.abs(
            rb.y-rt.y
        ),
        0.0001
    );


    /*
       X istiqaməti
    */

    const lx =
    (leftIris.x-lo.x) /
    leftWidth;


    const rx =
    (rightIris.x-ri.x) /
    rightWidth;


    /*
       Y istiqaməti
    */

    const ly =
    (leftIris.y-lt.y) /
    leftHeight;


    const ry =
    (rightIris.y-rt.y) /
    rightHeight;


    return {

        x:
        (lx+rx)/2,

        y:
        (ly+ry)/2

    };

}


/* =================================================
   FACE RESULTS
================================================= */

faceMesh.onResults(
function(results){

    if(
        !running
    ){

        return;

    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    const landmarks =
    results.multiFaceLandmarks[0];


    const eye =
    getEye(
        landmarks
    );


    if(
        !eye
    ){

        return;

    }


    /*
       KALİBRASİYA
    */

    if(
        collecting
    ){

        samples.push({

            x:
            eye.x,

            y:
            eye.y

        });


        return;

    }


    /*
       NORMAL REJİM
    */

    if(
        calibrationData
    ){

        const p =
        predictGaze(
            eye.x,
            eye.y
        );


        updateGaze(
            p.x,
            p.y
        );

    }

});


/* =================================================
   START
================================================= */

async function startSystem(){

    start.disabled =
    true;


    statusBox.innerText =
    "Kamera hazırlanır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running =
        true;


        startPanel.style.display =
        "none";


        statusBox.innerText =
        "Göz sistemi hazırlanır...";


        const camera =
        new Camera(
            video,
            {

                onFrame:
                async function(){

                    try{

                        await faceMesh.send({

                            image:
                            video

                        });

                    }
                    catch(error){

                        console.log(
                            error
                        );

                    }

                },

                width:640,

                height:480

            }
        );


        camera.start();


        /*
           Kamera tam otursun
        */

        setTimeout(
            startCalibration,
            1800
        );

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "Kamera açıla bilmədi";


        start.disabled =
        false;

    }

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrationData = {

        center:null,

        left:null,

        right:null,

        up:null,

        down:null

    };


    calibration.style.display =
    "block";


    choices.style.display =
    "none";


    progress.style.display =
    "none";


    reset.style.display =
    "none";


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    let index =
    0;


    const keys =
    [
        "center",
        "left",
        "right",
        "up",
        "down"
    ];


    function nextPoint(){

        points.forEach(
            p =>
            p.classList.remove(
                "active"
            )
        );


        /*
           Bitdi
        */

        if(
            index >=
            points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        const key =
        keys[index];


        point.classList.add(
            "active"
        );


        statusBox.innerText =
        "Nöqtəyə baxın  " +
        (index+1) +
        " / 5";


        /*
           Təzə nümunələr
        */

        samples =
        [];


        collecting =
        false;


        /*
           Əvvəl 500ms gözün
           oturmasını gözləyirik
        */

        setTimeout(
        function(){

            samples =
            [];

            collecting =
            true;

        },
        SETTLE_TIME
        );


        /*
           2.3 saniyənin sonunda
           nöqtəni tamamla
        */

        setTimeout(
        function(){

            collecting =
            false;


            /*
               Ayrı X və Y massivləri
            */

            const xs =
            samples.map(
                s=>s.x
            );


            const ys =
            samples.map(
                s=>s.y
            );


            /*
               Median istifadə edirik.
               Bu, ani səhv göz
               ölçülərini zəiflədir.
            */

            const eyeX =
            median(xs);


            const eyeY =
            median(ys);


            const rect =
            point.getBoundingClientRect();


            calibrationData[key] = {

                eyeX:
                eyeX,

                eyeY:
                eyeY,

                screenX:
                rect.left +
                rect.width/2,

                screenY:
                rect.top +
                rect.height/2

            };


            index++;


            setTimeout(
                nextPoint,
                300
            );

        },
        CALIBRATION_TIME
        );

    }


    nextPoint();

}


/* =================================================
   KALİBRASİYA BİTİR
================================================= */

function finishCalibration(){

    collecting =
    false;


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    /*
       Yuxarı və aşağı
       həqiqətən fərqlidirsə
       yadda saxla.
    */

    const up =
    calibrationData.up;


    const down =
    calibrationData.down;


    const center =
    calibrationData.center;


    /*
       Fərq çox zəifdirsə
       sistem yenə işləsin,
       amma xəbər verək.
    */

    if(
        Math.abs(
            down.eyeY -
            up.eyeY
        ) < 0.015
    ){

        console.log(
            "Göz Y fərqi zəifdir"
        );

    }


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            calibrationData
        )
    );


    calibration.style.display =
    "none";


    showChoices();

}


/* =================================================
   SEÇİMLƏRİ GÖSTƏR
================================================= */

function showChoices(){

    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    reset.style.display =
    "block";


    gazeX =
    null;


    gazeY =
    null;


    currentButton =
    null;


    candidateButton =
    null;


    lookStarted =
    0;


    candidateSince =
    0;


    bar.style.width =
    "0%";


    buttons.forEach(
        b =>
        b.classList.remove(
            "active"
        )
    );


    statusBox.innerText =
    "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GAZE PREDICTION
================================================= */

function predictGaze(
    x,
    y
){

    const center =
    calibrationData.center;


    const up =
    calibrationData.up;


    const down =
    calibrationData.down;


    /*
       Mərkəzdən yuxarı/aşağı
       məsafə
    */

    const upGap =
    Math.abs(
        center.eyeY -
        up.eyeY
    );


    const downGap =
    Math.abs(
        down.eyeY -
        center.eyeY
    );


    /*
       YUXARI
    */

    const upperThreshold =
    center.eyeY -
    upGap *
    0.38;


    /*
       AŞAĞI
    */

    const lowerThreshold =
    center.eyeY +
    downGap *
    0.38;


    /*
       HƏ üçün yuxarı
    */

    if(
        y <
        upperThreshold
    ){

        return {

            x:
            window.innerWidth/2,

            y:
            window.innerHeight *
            0.27

        };

    }


    /*
       YOX üçün aşağı
    */

    if(
        y >
        lowerThreshold
    ){

        return {

            x:
            window.innerWidth/2,

            y:
            window.innerHeight *
            0.73

        };

    }


    /*
       ORTA

       İki düymənin arasında
       böyük boşluq.
    */

    return {

        x:
        window.innerWidth/2,

        y:
        window.innerHeight/2

    };

}


/* =================================================
   SMOOTH
================================================= */

function updateGaze(
    x,
    y
){

    if(
        gazeX === null
    ){

        gazeX =
        x;

        gazeY =
        y;

    }
    else{

        gazeX +=
        (
            x -
            gazeX
        ) *
        SMOOTH;


        gazeY +=
        (
            y -
            gazeY
        ) *
        SMOOTH;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =================================================
   DÜYMƏNİ TAP
================================================= */

function checkButton(
    x,
    y
){

    if(
        locked
    ){

        return;

    }


    const yes =
    buttons[0];


    const no =
    buttons[1];


    const yesRect =
    yes.getBoundingClientRect();


    const noRect =
    no.getBoundingClientRect();


    const yesCenter =
    yesRect.top +
    yesRect.height/2;


    const noCenter =
    noRect.top +
    noRect.height/2;


    /*
       İki düymənin tam ortası
    */

    const middle =
    (
        yesCenter +
        noCenter
    ) / 2;


    /*
       HƏ zonasının
       aşağı sərhədi
    */

    const yesZone =
    middle -
    45;


    /*
       YOX zonasının
       yuxarı sərhədi
    */

    const noZone =
    middle +
    45;


    let target =
    null;


    /*
       YUXARI
    */

    if(
        y <
        yesZone
    ){

        target =
        yes;

    }


    /*
       AŞAĞI
    */

    else if(
        y >
        noZone
    ){

        target =
        no;

    }


    /*
       Ortada:
       seçim dəyişmir.
    */

    else{

        return;

    }


    /*
       Yeni namizəd
    */

    if(
        target !==
        candidateButton
    ){

        candidateButton =
        target;

        candidateSince =
        Date.now();

        return;

    }


    /*
       Target sabit qalıbsa
    */

    if(
        target !==
        currentButton
    ){

        const stableTime =
        Date.now() -
        candidateSince;


        /*
           250ms sabitlik
        */

        if(
            stableTime <
            SWITCH_CONFIRM
        ){

            return;

        }


        currentButton =
        target;


        lookStarted =
        Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";

    }


    /*
       Sabit baxış müddəti
    */

    const elapsed =
    Date.now() -
    lookStarted;


    const percent =
    Math.min(
        100,
        (
            elapsed /
            DWELL_TIME
        ) *
        100
    );


    bar.style.width =
    percent +
    "%";


    /*
       SEÇ
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =================================================
   SEÇİM
================================================= */

function selectButton(
    button
){

    if(
        locked
    ){

        return;

    }


    locked =
    true;


    const action =
    button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
        "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
        "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked =
        false;


        currentButton =
        null;


        candidateButton =
        null;


        lookStarted =
        0;


        candidateSince =
        0;


        gazeX =
        null;


        gazeY =
        null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
        "0%";


        statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

    },
    1000
    );

}


/* =================================================
   RESET
================================================= */

reset.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            STORAGE_KEY
        );


        calibrationData =
        null;


        gazeX =
        null;


        gazeY =
        null;


        currentButton =
        null;


        candidateButton =
        null;


        startCalibration();

    }
);


/* =================================================
   START
================================================= */

start.addEventListener(
    "click",
    startSystem
);
