<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f4f7fa;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:manipulation;
}

header{
    height:65px;
    background:#0b7285;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
    font-weight:bold;
}

#status{
    height:60px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:18px;
    font-weight:bold;

    padding:0 10px;
}

#start{
    display:block;

    margin:20px auto;

    padding:20px 28px;

    border:0;
    border-radius:18px;

    background:#0b7285;
    color:white;

    font-size:20px;
    font-weight:bold;
}

#video{
    /*
       Kamera görüntüsü xəstə ekranında
       heç vaxt görünmür.
    */
    position:fixed;

    width:1px;
    height:1px;

    opacity:0;

    pointer-events:none;

    left:-100px;
    top:-100px;
}

/* =========================
   KALİBRASİYA
========================= */

#calibration{
    display:none;

    position:fixed;

    inset:0;

    z-index:50;

    background:#f4f7fa;
}

.point{
    position:absolute;

    width:38px;
    height:38px;

    background:red;

    border:4px solid white;

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 0 6px
        rgba(255,0,0,.20);

    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

}

/* =========================
   DÜYMƏLƏR
========================= */

#choices{
    display:none;

    height:
        calc(100vh - 125px);

    padding:15px 20px;

    gap:18px;

    align-items:center;

    justify-content:center;

    flex-direction:column;
}

.choice{

    width:88vw;

    max-width:520px;

    height:120px;

    border:0;

    border-radius:25px;

    color:white;

    font-size:38px;

    font-weight:bold;

    transition:
        transform .15s,
        box-shadow .15s;
}

.choice.active{

    transform:scale(1.05);

    box-shadow:
        0 0 0 8px
        rgba(0,0,0,.20);
}

.yes{
    background:#198754;
}

.call{
    background:#dc3545;
}

.no{
    background:#6c757d;
}

/* =========================
   PROGRESS
========================= */

#progress{

    display:none;

    position:fixed;

    left:10%;

    bottom:15px;

    width:80%;

    height:14px;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;

    z-index:100;
}

#bar{

    width:0%;

    height:100%;

    background:#0b7285;

    transition:
        width .08s linear;
}

</style>
</head>


<body>

<header>
    MEDELIN — PALATA 402
</header>


<div id="status">
    Sistem hazır deyil
</div>


<button id="start">
    👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>


<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="point"
         style="left:10%;top:15%">
    </div>

    <div class="point"
         style="left:50%;top:15%">
    </div>

    <div class="point"
         style="left:90%;top:15%">
    </div>


    <div class="point"
         style="left:10%;top:50%">
    </div>

    <div class="point"
         style="left:50%;top:50%">
    </div>

    <div class="point"
         style="left:90%;top:50%">
    </div>


    <div class="point"
         style="left:10%;top:85%">
    </div>

    <div class="point"
         style="left:50%;top:85%">
    </div>

    <div class="point"
         style="left:90%;top:85%">
    </div>

</div>


<!-- =========================
     DÜYMƏLƏR
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>


    <button
        class="choice call"
        data-action="CALL">

        🚨 OTAĞA GƏL

    </button>


    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">

    <div id="bar"></div>

</div>


<script>

/* =====================================================
   ELEMENTLƏR
===================================================== */

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("start");

const statusBox =
    document.getElementById("status");

const calibration =
    document.getElementById("calibration");

const choices =
    document.getElementById("choices");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const buttons =
    [...document.querySelectorAll(".choice")];



/* =====================================================
   FACE MESH
===================================================== */

const faceMesh =
    new FaceMesh({

        locateFile:function(file){

            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

        }

    });


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});



/* =====================================================
   SİSTEM DƏYİŞƏNLƏRİ
===================================================== */

let camera = null;

let running = false;

let calibrationCollecting = false;

let calibrationData = [];

let currentSamples = [];

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStart = 0;

let locked = false;

let processing = false;


/*
   Gözün ekrandakı hərəkətini
   yumşaltmaq üçün.
*/

const SMOOTHING = 0.22;


/*
   Düyməni seçmək üçün
   baxış müddəti.
*/

const DWELL_TIME = 1800;



/* =====================================================
   GÖZ FEATURE-LƏRİ
===================================================== */

/*
   ƏVVƏLKİ KODDA PROBLEM BURADA İDİ.

   Əvvəl:
   iris.x və iris.y birbaşa istifadə olunurdu.

   İndi:
   iris-in gözün daxilindəki NİSBİ mövqeyini
   hesablayırıq.

   Bu, başın bir az sağa-sola hərəkət etməsinə
   daha dözümlüdür.
*/

function getEyeFeatures(landmarks){

    try{

        /*
           SOL GÖZ
        */

        const leftIris = [
            468,
            469,
            470,
            471,
            472
        ];

        let leftIX = 0;
        let leftIY = 0;


        for(const index of leftIris){

            leftIX += landmarks[index].x;
            leftIY += landmarks[index].y;

        }


        leftIX /= leftIris.length;
        leftIY /= leftIris.length;


        /*
           Sol göz kənarları
        */

        const leftOuter =
            landmarks[33];

        const leftInner =
            landmarks[133];


        /*
           Sol göz üst-alt
        */

        const leftTop =
            landmarks[159];

        const leftBottom =
            landmarks[145];


        /*
           Sağ göz
        */

        const rightIris = [
            473,
            474,
            475,
            476,
            477
        ];

        let rightIX = 0;
        let rightIY = 0;


        for(const index of rightIris){

            rightIX += landmarks[index].x;
            rightIY += landmarks[index].y;

        }


        rightIX /= rightIris.length;
        rightIY /= rightIris.length;


        /*
           Sağ göz kənarları
        */

        const rightOuter =
            landmarks[362];

        const rightInner =
            landmarks[263];


        /*
           Sağ göz üst-alt
        */

        const rightTop =
            landmarks[386];

        const rightBottom =
            landmarks[374];


        /*
           Gözün eni
        */

        const leftWidth =
            Math.max(
                Math.abs(
                    leftInner.x -
                    leftOuter.x
                ),
                0.0001
            );


        const rightWidth =
            Math.max(
                Math.abs(
                    rightInner.x -
                    rightOuter.x
                ),
                0.0001
            );


        /*
           Gözün hündürlüyü
        */

        const leftHeight =
            Math.max(
                Math.abs(
                    leftBottom.y -
                    leftTop.y
                ),
                0.0001
            );


        const rightHeight =
            Math.max(
                Math.abs(
                    rightBottom.y -
                    rightTop.y
                ),
                0.0001
            );


        /*
           İrisin göz daxilində
           horizontal mövqeyi
        */

        const leftX =
            (leftIX - leftOuter.x) /
            leftWidth;


        const rightX =
            (rightIX - rightOuter.x) /
            rightWidth;


        /*
           İrisin göz daxilində
           vertical mövqeyi
        */

        const leftY =
            (leftIY - leftTop.y) /
            leftHeight;


        const rightY =
            (rightIY - rightTop.y) /
            rightHeight;


        /*
           İki gözün ortalaması
        */

        return {

            x:
                (leftX + rightX) / 2,

            y:
                (leftY + rightY) / 2,

            lx:leftX,

            ly:leftY,

            rx:rightX,

            ry:rightY

        };

    }catch(error){

        return null;

    }

}



/* =====================================================
   FACE MESH NƏTİCƏLƏRİ
===================================================== */

faceMesh.onResults(function(results){

    if(!running){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        return;

    }


    const landmarks =
        results.multiFaceLandmarks[0];


    const eye =
        getEyeFeatures(landmarks);


    if(!eye){
        return;
    }


    /*
       KALİBRASİYA
    */

    if(calibrationCollecting){

        currentSamples.push({

            x:eye.x,

            y:eye.y,

            lx:eye.lx,

            ly:eye.ly,

            rx:eye.rx,

            ry:eye.ry

        });

        return;

    }


    /*
       NORMAL GÖZ İZLƏMƏ
    */

    if(calibrationData.length >= 5){

        const position =
            predictGaze(eye);


        if(position){

            updateGaze(
                position.x,
                position.y
            );

        }

    }

});



/* =====================================================
   KAMERA + SİSTEMİ BAŞLAT
===================================================== */

async function startSystem(){

    startButton.style.display =
        "none";


    statusBox.innerText =
        "Kamera açılır...";


    try{

        /*
           Kameranı birbaşa video elementinə bağlayırıq.

           Ayrı getUserMedia açıb sonra bağlamırıq.
           Bu mobil telefonlarda problem yarada bilər.
        */

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        running = true;


        statusBox.innerText =
            "Kamera hazırdır";


        /*
           MediaPipe Camera
        */

        camera =
            new Camera(

                video,

                {

                    onFrame:
                    async function(){

                        if(processing){
                            return;
                        }

                        processing = true;

                        try{

                            await faceMesh.send({

                                image:video

                            });

                        }catch(error){

                            console.error(error);

                        }

                        processing = false;

                    },

                    width:640,

                    height:480

                }

            );


        camera.start();


        /*
           Kameranın üzünü tapması üçün
           bir az vaxt veririk.
        */

        setTimeout(

            function(){

                startCalibration();

            },

            1800

        );


    }catch(error){

        console.error(
            "KAMERA XƏTASI:",
            error
        );


        statusBox.innerText =
            "Kameraya icazə verilmədi";


        startButton.style.display =
            "block";

    }

}



/* =====================================================
   KALİBRASİYA
===================================================== */

function startCalibration(){

    calibrationData = [];

    calibrationCollecting = false;

    calibration.style.display =
        "block";


    const points =
        [
            ...document.querySelectorAll(".point")
        ];


    let index = 0;


    function nextPoint(){

        if(index >= points.length){

            finishCalibration();

            return;

        }


        const point =
            points[index];


        const rect =
            point.getBoundingClientRect();


        const targetX =
            rect.left +
            rect.width / 2;


        const targetY =
            rect.top +
            rect.height / 2;


        /*
           Əvvəlki nümunələri silirik.
        */

        currentSamples = [];


        /*
           Nöqtəyə baxmağa
           hazırlaşırıq.
        */

        calibrationCollecting =
            false;


        statusBox.innerText =
            "Nöqtəyə bax  " +
            (index + 1) +
            " / " +
            points.length;


        /*
           500 ms gözləyirik.

           Sonra nümunə toplama başlayır.
        */

        setTimeout(function(){

            currentSamples = [];

            calibrationCollecting =
                true;


            /*
               1800 ms nümunə yığılır.
            */

            setTimeout(function(){

                calibrationCollecting =
                    false;


                /*
                   Nümunələr kifayətdirsə
                   ortalamasını götürürük.
                */

                if(currentSamples.length >= 10){

                    const average =
                        getAverageSample(
                            currentSamples
                        );


                    calibrationData.push({

                        features:average,

                        screenX:targetX,

                        screenY:targetY

                    });

                }


                index++;


                /*
                   Növbəti nöqtəyə keçirik.
                */

                setTimeout(

                    nextPoint,

                    300

                );


            },1800);


        },500);

    }


    nextPoint();

}



/* =====================================================
   ORTA NÜMUNƏ
===================================================== */

function getAverageSample(samples){

    /*
       Kənardakı səhv nümunələri
       azaltmaq üçün ortalama.
    */

    let sx = 0;
    let sy = 0;

    let slx = 0;
    let sly = 0;

    let srx = 0;
    let sry = 0;


    for(const sample of samples){

        sx += sample.x;
        sy += sample.y;

        slx += sample.lx;
        sly += sample.ly;

        srx += sample.rx;
        sry += sample.ry;

    }


    const count =
        samples.length;


    return {

        x:sx/count,

        y:sy/count,

        lx:slx/count,

        ly:sly/count,

        rx:srx/count,

        ry:sry/count

    };

}



/* =====================================================
   KALİBRASİYANIN BİTMƏSİ
===================================================== */

function finishCalibration(){

    calibrationCollecting =
        false;


    calibration.style.display =
        "none";


    choices.style.display =
        "flex";


    progress.style.display =
        "block";


    gazeX = null;
    gazeY = null;


    statusBox.innerText =
        "Hazırdır — düyməyə bax";


    /*
       Əgər az nümunə yığılıbsa
    */

    if(calibrationData.length < 7){

        statusBox.innerText =
            "Kalibrasiya zəif oldu — yenidən başlat";


        console.warn(
            "Kalibrasiya nöqtələri:",
            calibrationData.length
        );

    }

}



/* =====================================================
   GÖZÜ EKRANA XƏRİTƏLƏ
===================================================== */

/*
   9 nöqtədən ən yaxın nöqtələri tapırıq.

   Amma artıq sadəcə x/y deyil,
   4 göz xüsusiyyətindən istifadə olunur.
*/

function featureDistance(a,b){

    const dx =
        a.lx - b.features.lx;

    const dy =
        a.ly - b.features.ly;

    const rx =
        a.rx - b.features.rx;

    const ry =
        a.ry - b.features.ry;


    return Math.sqrt(

        dx*dx +
        dy*dy +
        rx*rx +
        ry*ry

    );

}



function predictGaze(eye){

    if(calibrationData.length < 5){

        return null;

    }


    /*
       Bütün kalibrasiya nöqtələrinin
       məsafəsini hesablayırıq.
    */

    const distances =
        calibrationData.map(function(point){

            return {

                point:point,

                distance:
                    featureDistance(
                        eye,
                        point
                    )

            };

        });


    distances.sort(function(a,b){

        return a.distance -
               b.distance;

    });


    /*
       Ən yaxın 4 nöqtəni götürürük.
    */

    const nearest =
        distances.slice(0,4);


    /*
       Birbaşa nöqtənin üstündəyiksə
       həmin nöqtəni qaytar.
    */

    if(
        nearest[0].distance <
        0.015
    ){

        return {

            x:
                nearest[0].point.screenX,

            y:
                nearest[0].point.screenY

        };

    }


    let totalWeight = 0;

    let screenX = 0;

    let screenY = 0;


    for(const item of nearest){

        /*
           Yaxın nöqtəyə daha çox
           ağırlıq verilir.
        */

        const weight =
            1 /
            Math.pow(
                Math.max(
                    item.distance,
                    0.005
                ),
                2
            );


        screenX +=
            item.point.screenX *
            weight;


        screenY +=
            item.point.screenY *
            weight;


        totalWeight +=
            weight;

    }


    screenX /=
        totalWeight;


    screenY /=
        totalWeight;


    /*
       Ekrandan kənara çıxmasına
       icazə vermirik.
    */

    screenX =
        Math.max(
            0,
            Math.min(
                window.innerWidth,
                screenX
            )
        );


    screenY =
        Math.max(
            0,
            Math.min(
                window.innerHeight,
                screenY
            )
        );


    return {

        x:screenX,

        y:screenY

    };

}



/* =====================================================
   GÖZ HƏRƏKƏTİNİ YUMŞALT
===================================================== */

function updateGaze(x,y){

    if(
        gazeX === null ||
        gazeY === null
    ){

        gazeX = x;

        gazeY = y;

    }else{

        gazeX +=
            (x - gazeX) *
            SMOOTHING;


        gazeY +=
            (y - gazeY) *
            SMOOTHING;

    }


    checkButton(
        gazeX,
        gazeY
    );

}



/* =====================================================
   DÜYMƏNİ TAP
===================================================== */

function checkButton(x,y){

    if(locked){

        return;

    }


    let target = null;

    let bestDistance =
        Infinity;


    for(const button of buttons){

        const rect =
            button.getBoundingClientRect();


        /*
           Bir az geniş zona yaradırıq.

           Məsələn göz düymənin tam
           kənarına düşsə belə qəbul edir.
        */

        const tolerance = 35;


        const left =
            rect.left -
            tolerance;


        const right =
            rect.right +
            tolerance;


        const top =
            rect.top -
            tolerance;


        const bottom =
            rect.bottom +
            tolerance;


        const inside =
            x >= left &&
            x <= right &&
            y >= top &&
            y <= bottom;


        if(!inside){

            continue;

        }


        const cx =
            rect.left +
            rect.width / 2;


        const cy =
            rect.top +
            rect.height / 2;


        const dx =
            x - cx;


        const dy =
            y - cy;


        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        if(
            distance <
            bestDistance
        ){

            bestDistance =
                distance;

            target =
                button;

        }

    }


    /*
       Heç bir düyməyə baxmır.
    */

    if(!target){

        currentButton =
            null;


        lookStart =
            0;


        buttons.forEach(function(button){

            button.classList.remove(
                "active"
            );

        });


        bar.style.width =
            "0%";


        return;

    }


    /*
       Yeni düymə.
    */

    if(
        target !==
        currentButton
    ){

        currentButton =
            target;


        lookStart =
            Date.now();


        buttons.forEach(function(button){

            button.classList.remove(
                "active"
            );

        });


        target.classList.add(
            "active"
        );


        bar.style.width =
            "0%";


        return;

    }


    /*
       Eyni düyməyə baxmağa davam edir.
    */

    const elapsed =
        Date.now() -
        lookStart;


    const percent =
        Math.min(

            100,

            (
                elapsed /
                DWELL_TIME
            ) * 100

        );


    bar.style.width =
        percent + "%";


    /*
       1.8 saniyə tamamlandı.
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}



/* =====================================================
   SEÇİM
===================================================== */

function selectButton(button){

    if(locked){

        return;

    }


    locked = true;


    const action =
        button.dataset.action;


    if(action === "YES"){

        statusBox.innerText =
            "✅ HƏ";

    }


    if(action === "CALL"){

        statusBox.innerText =
            "🚨 PALATA 402 — OTAĞA GƏL";

    }


    if(action === "NO"){

        statusBox.innerText =
            "❌ YOX";

    }


    /*
       Hazırda sadəcə test üçündür.
       Daha sonra CALL düyməsini backend-ə
       qoşub tibb bacısının telefonuna
       bildiriş göndərə bilərik.
    */

    console.log(
        "PALATA 402 →",
        action
    );


    bar.style.width =
        "100%";


    setTimeout(function(){

        locked = false;


        currentButton =
            null;


        lookStart =
            0;


        gazeX =
            null;


        gazeY =
            null;


        button.classList.remove(
            "active"
        );


        bar.style.width =
            "0%"
        ;


        statusBox.innerText =
