<style>

    font-weight:600;

}

#startPanel{
    width:min(680px,90vw);

    margin:35px auto;

    background:white;

    border:1px solid #e3e9ef;

    box-shadow:

}

#start{
    border:0;

    background:#102a43;

    color:white;

    padding:20px 35px;

    border-radius:16px;

    font-size:18px;

    font-weight:700;
}

#video{
    display:none;
}

/* =========================
   KALİBRASİYA
========================= */

#calibration{
    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:#f5f7fa;
}

.calTitle{
    position:absolute;

    top:28px;

    left:20px;
    right:20px;

    text-align:center;

    font-size:23px;
    font-weight:800;

    color:#102a43;
}

.calText{
    position:absolute;

    top:68px;

    left:20px;
    right:20px;

    text-align:center;

    font-size:15px;

    color:#718096;
}

.point{
    display:none;

    position:absolute;

    width:28px;
    height:28px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#c62828;

    border:5px solid white;

    box-shadow:
        0 0 0 7px
        rgba(198,40,40,.14);
}

.point.active{
    display:block;
}

/* =========================
   HƏ / YOX
========================= */

#choices{

    display:none;

    position:fixed;

    top:68px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(100vh - 68px);

    padding:35px 20px 75px;

    flex-direction:column !important;

    flex-wrap:nowrap !important;

    align-items:center !important;

    justify-content:center !important;

    gap:100px !important;
}

.choice{

    display:flex;

    flex:none !important;

    width:min(680px,82vw);

    height:230px;

    margin:0 !important;

    border:0;

    border-radius:32px;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:60px;

    font-weight:800;

    box-shadow:
        0 18px 45px
        rgba(16,42,67,.12);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.yes{
    background:#147d64;
}

.no{
    background:#344054;
}

.choice.active{

    transform:scale(1.045);

    box-shadow:
        0 0 0 8px
        rgba(16,42,67,.12),

        0 22px 50px
        rgba(16,42,67,.18);
}

/* PROGRESS */

#progress{

    display:none;

    position:fixed;

    left:18%;
    right:18%;

    bottom:25px;

    height:8px;

    background:#dce3ea;

    border-radius:20px;

    overflow:hidden;

    z-index:150;
}

#bar{

    width:0%;

    height:100%;

    background:#102a43;
}

#reset{

    display:none;

    position:fixed;

    top:78px;
    right:15px;

    z-index:200;

    border:0;

    background:transparent;

    color:#718096;

    font-size:12px;
}

@media(max-width:700px){

    header{

        height:60px;

        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{

    }

    #status{

        height:60px;

        font-size:15px;
    }

    #startPanel{

        margin-top:25px;

        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    .startText{
        font-size:15px;
    }

    #choices{

        top:60px;

        height:calc(100vh - 60px);

        padding:
            25px 18px
            70px;

        flex-direction:column !important;

        flex-wrap:nowrap !important;

        align-items:center !important;

        justify-content:center !important;

        gap:90px !important;
    }

    .choice{

        width:82vw;

        height:205px;

        flex:none !important;

        font-size:43px;
    }
}

@media(max-width:400px){

    #choices{

        gap:75px !important;
    }

    .choice{

        width:84vw;

        height:185px;

        font-size:38px;
    }
}

<body>

<header>

    <div class="logo">
        MEDELIN
    </div>

    <div class="room">
        PALATA 402
    </div>

</header>


<div id="status">
    Sistem hazır deyil
</div>


<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>


<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə sakit şəkildə baxın
    </div>


    <div
        class="point"
        data-key="center"
        style="left:50%;top:50%;">
    </div>


    <div
        class="point"
        data-key="left"
        style="left:15%;top:50%;">
    </div>


    <div
        class="point"
        data-key="right"
        style="left:85%;top:50%;">
    </div>


    <div
        class="point"
        data-key="up"
        style="left:50%;top:22%;">
    </div>


    <div
        class="point"
        data-key="down"
        style="left:50%;top:78%;">
    </div>

</div>


<!-- =========================
     HƏ YUXARI
     YOX AŞAĞI
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>


    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">

    <div id="bar"></div>

</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const video =
document.getElementById("video");

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    ...document.querySelectorAll(".point")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =================================================
   YENİ KALİBRASİYA VERSİYASI
================================================= */

const STORAGE_KEY =
"MEDELIN_402_EYE_FINAL_V4";


const POINT_TIME =
1800;


const DWELL_TIME =
1800;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let running =
false;


let collecting =
false;


let calibrationData =
null;


/*
   Hər kalibrasiya nöqtəsi
   üçün nümunələr
*/

let samples =
[];


let gazeX =
null;


let gazeY =
null;


let currentButton =
null;


let lookStarted =
0;


let locked =
false;


/* =================================================
   MEDIAPIPE
================================================= */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return
        "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
        + file;

    }

});


/* =================================================
   YUXARIDAKI return PROBLEMİNİ
   ARADAN QALDIRAN YANAŞMA
================================================= */

faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.55,

    minTrackingConfidence:0.55

});


/* =================================================
   ORTAQ NÖQTƏ
================================================= */

function average(
    landmarks,
    indexes
){

    let x =
    0;

    let y =
    0;

    let count =
    0;


    for(
        const index of indexes
    ){

        if(
            !landmarks[index]
        ){
            continue;
        }


        x +=
        landmarks[index].x;


        y +=
        landmarks[index].y;


        count++;

    }


    if(
        count === 0
    ){

        return null;

    }


    return {

        x:x/count,

        y:y/count

    };

}


/* =================================================
   GÖZÜ TAP
================================================= */

function getEye(
    landmarks
){

    const leftIris =
    average(
        landmarks,
        [
            468,
            469,
            470,
            471,
            472
        ]
    );


    const rightIris =
    average(
        landmarks,
        [
            473,
            474,
            475,
            476,
            477
        ]
    );


    if(
        !leftIris ||
        !rightIris
    ){

        return null;

    }


    const lo =
    landmarks[33];

    const li =
    landmarks[133];

    const lt =
    landmarks[159];

    const lb =
    landmarks[145];


    const ri =
    landmarks[362];

    const ro =
    landmarks[263];

    const rt =
    landmarks[386];

    const rb =
    landmarks[374];


    if(
        !lo || !li ||
        !lt || !lb ||
        !ri || !ro ||
        !rt || !rb
    ){

        return null;

    }


    const leftWidth =
    Math.max(
        Math.abs(
            li.x-lo.x
        ),
        0.0001
    );


    const rightWidth =
    Math.max(
        Math.abs(
            ro.x-ri.x
        ),
        0.0001
    );


    const leftHeight =
    Math.max(
        Math.abs(
            lb.y-lt.y
        ),
        0.0001
    );


    const rightHeight =
    Math.max(
        Math.abs(
            rb.y-rt.y
        ),
        0.0001
    );


    const lx =
    (leftIris.x-lo.x) /
    leftWidth;


    const rx =
    (rightIris.x-ri.x) /
    rightWidth;


    const ly =
    (leftIris.y-lt.y) /
    leftHeight;


    const ry =
    (rightIris.y-rt.y) /
    rightHeight;


    return {

        x:
        (lx+rx)/2,

        y:
        (ly+ry)/2

    };

}


/* =================================================
   FACE NƏTİCƏLƏRİ
================================================= */

faceMesh.onResults(
function(results){

    if(
        !running
    ){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    const eye =
    getEye(
        results.multiFaceLandmarks[0]
    );


    if(!eye){
        return;
    }


    /*
       KALİBRASİYA
    */

    if(
        collecting
    ){

        samples.push({

            x:eye.x,

            y:eye.y

        });


        return;

    }


    /*
       NORMAL İŞ
    */

    if(
        calibrationData &&
        calibrationData.center &&
        calibrationData.up &&
        calibrationData.down
    ){

        const position =
        predictGaze(
            eye.x,
            eye.y
        );


        updateGaze(
            position.x,
            position.y
        );

    }

});


/* =================================================
   START
================================================= */

async function startSystem(){

    start.disabled =
    true;


    statusBox.innerText =
    "Kamera hazırlanır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running =
        true;


        startPanel.style.display =
        "none";


        statusBox.innerText =
        "Göz sistemi hazırlanır...";


        const camera =
        new Camera(
            video,
            {

                onFrame:
                async function(){

                    try{

                        await faceMesh.send({

                            image:
                            video

                        });

                    }
                    catch(error){

                        console.log(
                            error
                        );

                    }

                },

                width:640,

                height:480

            }
        );


        camera.start();


        setTimeout(
            startCalibration,
            1500
        );

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "Kamera açıla bilmədi";


        start.disabled =
        false;

    }

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    /*
       Köhnə kalibrasiyanı
       istifadə etmirik.
    */

    calibrationData = {

        center:null,

        left:null,

        right:null,

        up:null,

        down:null

    };


    calibration.style.display =
    "block";


    choices.style.display =
    "none";


    progress.style.display =
    "none";


    reset.style.display =
    "none";


    let index =
    0;


    function nextPoint(){

        points.forEach(
            p =>
            p.classList.remove(
                "active"
            )
        );


        if(
            index >=
            points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        const key =
        point.dataset.key;


        point.classList.add(
            "active"
        );


        statusBox.innerText =
        "Nöqtəyə baxın  " +
        (index+1) +
        " / 5";


        /*
           Təzə nümunələr
        */

        samples =
        [];


        collecting =
        true;


        setTimeout(
        function(){

            collecting =
            false;


            /*
               Nümunələrin
               ortalamasını götürürük
            */

            let eyeX =
            0.5;

            let eyeY =
            0.5;


            if(
                samples.length > 0
            ){

                for(
                    const sample
                    of samples
                ){

                    eyeX +=
                    sample.x;

                    eyeY +=
                    sample.y;

                }


                eyeX /=
                samples.length + 1;


                eyeY /=
                samples.length + 1;

            }


            const rect =
            point.getBoundingClientRect();


            calibrationData[key] = {

                eyeX:eyeX,

                eyeY:eyeY,

                screenX:
                rect.left +
                rect.width/2,

                screenY:
                rect.top +
                rect.height/2

            };


            index++;


            setTimeout(
                nextPoint,
                300
            );

        },
        POINT_TIME
        );

    }


    nextPoint();

}


/* =================================================
   KALİBRASİYA BİTİR
================================================= */

function finishCalibration(){

    collecting =
    false;


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    /*
       Yeni kalibrasiyanı yadda saxla
    */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            calibrationData
        )
    );


    calibration.style.display =
    "none";


    showChoices();

}


/* =================================================
   SEÇİM EKRANI
================================================= */

function showChoices(){

    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    reset.style.display =
    "block";


    gazeX =
    null;


    gazeY =
    null;


    currentButton =
    null;


    lookStarted =
    0;


    buttons.forEach(
        b =>
        b.classList.remove(
            "active"
        )
    );


    bar.style.width =
    "0%";


    statusBox.innerText =
    "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GÖZÜ EKRANA XƏRİTƏLƏ
================================================= */

function predictGaze(
    x,
    y
){

    const center =
    calibrationData.center;


    const up =
    calibrationData.up;


    const down =
    calibrationData.down;


    /*
       Mərkəzdən yuxarı/aşağı
       real məsafəni hesablayırıq.
    */

    const centerY =
    center.eyeY;


    const upDistance =
    Math.abs(
        up.eyeY -
        centerY
    );


    const downDistance =
    Math.abs(
        down.eyeY -
        centerY
    );


    /*
       Yuxarı və aşağı
       istiqamətin tərs olub-olmadığını
       avtomatik müəyyən edirik.
    */

    const total =
    upDistance +
    downDistance;


    let normalized =
    0.5;


    if(
        total > 0.0001
    ){

        if(
            Math.abs(
                y-centerY
            ) <
            Math.min(
                upDistance,
                downDistance
            ) *
            0.30
        ){

            /*
               Mərkəzə yaxın
            */

            normalized =
            0.5;

        }
        else{

            const direction =
            (
                y-centerY
            ) /
            Math.max(
                down.eyeY -
                centerY,
                0.0001
            );


            /*
               Əgər down tərs istiqamətdədirsə
            */

            normalized =
            0.5 +
            direction *
            0.5;

        }

    }


    normalized =
    Math.max(
        0,
        Math.min(
            1,
            normalized
        )
    );


    /*
       EKRANDA Y:

       HƏ düyməsinin mərkəzi
       ≈ 27%

       YOX düyməsinin mərkəzi
       ≈ 73%
    */

    const screenY =
    window.innerHeight *
    (
        0.27 +
        normalized *
        0.46
    );


    return {

        x:
        window.innerWidth/2,

        y:
        screenY

    };

}


/* =================================================
   YUMŞALTMA
================================================= */

function updateGaze(
    x,
    y
){

    if(
        gazeX === null
    ){

        gazeX =
        x;

        gazeY =
        y;

    }
    else{

        gazeX +=
        (
            x-gazeX
        ) *
        0.16;


        gazeY +=
        (
            y-gazeY
        ) *
        0.16;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =================================================
   HƏ / YOX SEÇİMİ
================================================= */

function checkButton(
    x,
    y
){

    if(
        locked
    ){
        return;
    }


    let target =
    null;


    /*
       REAL DÜYMƏ MƏRKƏZLƏRİ
    */

    const yesRect =
    buttons[0]
    .getBoundingClientRect();


    const noRect =
    buttons[1]
    .getBoundingClientRect();


    const yesCenter =
    yesRect.top +
    yesRect.height/2;


    const noCenter =
    noRect.top +
    noRect.height/2;


    /*
       Yuxarı düymənin
       təhlükəsiz sahəsi
    */

    const yesLimit =
    (
        yesCenter +
        noCenter
    ) / 2;


    /*
       Aşağı düymənin
       təhlükəsiz sahəsi
    */

    if(
        y <
        yesLimit
    ){

        target =
        buttons[0];

    }
    else{

        target =
        buttons[1];

    }


    /*
       Yeni target
    */

    if(
        target !==
        currentButton
    ){

        currentButton =
        target;


        lookStarted =
        Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       Eyni düyməyə baxış
    */

    const elapsed =
    Date.now() -
    lookStarted;


    const percent =
    Math.min(
        100,
        (
            elapsed /
            DWELL_TIME
        ) *
        100
    );


    bar.style.width =
    percent +
    "%";


    /*
       1.8 saniyə
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =================================================
   SEÇİM
================================================= */

function selectButton(
    button
){

    if(
        locked
    ){
        return;
    }


    locked =
    true;


    const action =
    button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
        "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
        "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked =
        false;


        currentButton =
        null;


        lookStarted =
        0;


        gazeX =
        null;


        gazeY =
        null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
        "0%";


        statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

    },
    1200
    );

}


/* =================================================
   YENİDƏN KALİBRASİYA
================================================= */

reset.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            STORAGE_KEY
        );


        calibrationData =
        null;


        gazeX =
        null;


        gazeY =
        null;


        startCalibration();

    }
);


/* =================================================
   START BUTTON
================================================= */

start.addEventListener(
    "click",
    startSystem
);

</script>
