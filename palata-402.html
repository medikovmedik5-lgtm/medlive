<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172b3a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:64px;

    background:#102a43;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;
}

.logo{
    font-size:19px;
    font-weight:800;
}

.room{
    font-size:14px;
    color:#c8d5e2;
    font-weight:600;
}

/* STATUS */

#status{
    height:64px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:17px;
    font-weight:600;

    color:#526579;
}

/* START */

#startPanel{
    width:min(680px,90vw);

    margin:35px auto;

    padding:40px 28px;

    background:white;

    border:1px solid #e3e9ef;

    border-radius:26px;

    text-align:center;

    box-shadow:
        0 18px 50px
        rgba(16,42,67,.08);
}

.startTitle{
    font-size:29px;
    font-weight:800;

    color:#102a43;

    margin-bottom:14px;
}

.startText{
    font-size:16px;
    color:#718096;

    line-height:1.6;

    margin-bottom:28px;
}

#start{
    border:0;

    background:#102a43;

    color:white;

    padding:19px 34px;

    border-radius:15px;

    font-size:18px;

    font-weight:700;
}


/* =================================================
   KALİBRASİYA
================================================= */

#calibration{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:#f5f7fa;
}

.calTitle{

    position:absolute;

    top:28px;

    left:20px;
    right:20px;

    text-align:center;

    color:#102a43;

    font-size:23px;

    font-weight:800;
}

.calText{

    position:absolute;

    top:68px;

    left:20px;
    right:20px;

    text-align:center;

    color:#718096;

    font-size:15px;
}

.point{

    display:none;

    position:absolute;

    width:30px;
    height:30px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#c62828;

    border:5px solid white;

    box-shadow:
        0 0 0 7px
        rgba(198,40,40,.15);
}

.point.active{
    display:block;
}


/* =================================================
   HƏ / YOX
================================================= */

#choices{

    display:none;

    position:fixed;

    top:64px;

    left:0;
    right:0;
    bottom:0;

    width:100%;

    height:calc(100vh - 64px);

    padding:
        25px 18px
        70px;

    flex-direction:column !important;

    flex-wrap:nowrap !important;

    align-items:center !important;

    justify-content:center !important;

    gap:95px !important;
}


.choice{

    width:min(680px,82vw);

    height:225px;

    flex:none !important;

    border:0;

    border-radius:30px;

    color:white;

    font-size:58px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 18px 45px
        rgba(16,42,67,.12);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.yes{
    background:#147d64;
}

.no{
    background:#344054;
}

.choice.active{

    transform:scale(1.035);

    box-shadow:
        0 0 0 8px
        rgba(16,42,67,.12),

        0 22px 50px
        rgba(16,42,67,.18);
}


/* =================================================
   PROGRESS
================================================= */

#progress{

    display:none;

    position:fixed;

    left:16%;
    right:16%;

    bottom:23px;

    height:8px;

    background:#dce3ea;

    border-radius:20px;

    overflow:hidden;

    z-index:150;
}

#bar{

    width:0%;

    height:100%;

    background:#102a43;
}


/* RESET */

#reset{

    display:none;

    position:fixed;

    top:72px;

    right:14px;

    z-index:200;

    border:0;

    background:transparent;

    color:#718096;

    font-size:12px;
}


/* =================================================
   MOBILE
================================================= */

@media(max-width:700px){

    header{
        height:60px;
        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{
        font-size:13px;
    }

    #status{
        height:60px;
        font-size:15px;
    }

    #startPanel{
        margin-top:25px;
        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    .startText{
        font-size:15px;
    }

    #choices{

        top:60px;

        height:calc(100vh - 60px);

        padding:
            20px 18px
            65px;

        flex-direction:column !important;

        flex-wrap:nowrap !important;

        align-items:center !important;

        justify-content:center !important;

        gap:85px !important;
    }

    .choice{

        width:82vw;

        height:205px;

        flex:none !important;

        font-size:42px;
    }
}

@media(max-width:400px){

    #choices{
        gap:70px !important;
    }

    .choice{
        width:84vw;
        height:185px;
        font-size:38px;
    }
}

</style>
</head>


<body>


<header>

    <div class="logo">
        MEDELIN
    </div>

    <div class="room">
        PALATA 402
    </div>

</header>


<div id="status">
    Sistem hazır deyil
</div>


<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>


<!-- =================================================
     KALİBRASİYA
================================================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə baxın və başınızı mümkün qədər sabit saxlayın
    </div>


    <div
        class="point"
        id="p1"
        style="left:50%;top:20%;">
    </div>


    <div
        class="point"
        id="p2"
        style="left:20%;top:50%;">
    </div>


    <div
        class="point"
        id="p3"
        style="left:80%;top:50%;">
    </div>


    <div
        class="point"
        id="p4"
        style="left:50%;top:50%;">
    </div>


    <div
        class="point"
        id="p5"
        style="left:50%;top:80%;">
    </div>

</div>


<!-- =================================================
     SEÇİMLƏR
================================================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>


    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">

    <div id="bar"></div>

</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    document.getElementById("p1"),
    document.getElementById("p2"),
    document.getElementById("p3"),
    document.getElementById("p4"),
    document.getElementById("p5")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =================================================
   PARAMETRLƏR
================================================= */

const CALIBRATION_TIME =
2200;

const DWELL_TIME =
1300;

const SWITCH_TIME =
250;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let gazeReady =
false;

let calibrating =
false;

let calibrationIndex =
0;

let currentButton =
null;

let candidateButton =
null;

let candidateSince =
0;

let lookStart =
0;

let locked =
false;

let smoothY =
null;


/* =================================================
   WEBGAZER
================================================= */

webgazer
    .setRegression("ridge")
    .setTracker("TFFacemesh")

    .setGazeListener(
    function(data){

        if(!data){
            return;
        }


        if(
            typeof data.x !== "number" ||
            typeof data.y !== "number"
        ){

            return;

        }


        /*
           Kalibrasiya zamanı
           BU SƏTİR ÇOX VACİBDİR.

           Baxdığımız nöqtəni
           WebGazer modelinə yazırıq.
        */

        if(calibrating){

            webgazer.recordScreenPosition(
                data.x,
                data.y,
                "gaze"
            );

            return;

        }


        /*
           Kalibrasiya bitəndən
           sonra real seçim.
        */

        if(gazeReady){

            processGaze(
                data.x,
                data.y
            );

        }

    })

    .showVideoPreview(false)

    .showPredictionPoints(false)

    .showFaceOverlay(false)

    .showFaceFeedbackBox(false);


/* =================================================
   START
================================================= */

async function startSystem(){

    start.disabled =
        true;


    statusBox.innerText =
        "Kamera hazırlanır...";


    try{

        await webgazer.begin();


        /*
           Kamera tam açılsın
        */

        await new Promise(
            resolve =>
            setTimeout(
                resolve,
                1800
            )
        );


        startPanel.style.display =
            "none";


        statusBox.innerText =
            "Kalibrasiya başlayır...";


        startCalibration();

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
            "Göz sistemi açıla bilmədi";


        start.disabled =
            false;

    }

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrationIndex =
        0;


    calibrating =
        false;


    gazeReady =
        false;


    calibration.style.display =
        "block";


    choices.style.display =
        "none";


    progress.style.display =
        "none";


    reset.style.display =
        "none";


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    nextPoint();

}


/* =================================================
   NÖVBƏTİ NÖQTƏ
================================================= */

function nextPoint(){

    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    /*
       BİTDİ
    */

    if(
        calibrationIndex >=
        points.length
    ){

        finishCalibration();

        return;

    }


    const point =
        points[calibrationIndex];


    point.classList.add(
        "active"
    );


    statusBox.innerText =
        "Nöqtəyə baxın  " +
        (
            calibrationIndex + 1
        ) +
        " / 5";


    /*
       Birinci 500ms
       göz yerləşsin.
    */

    calibrating =
        false;


    setTimeout(
    function(){

        /*
           Əsl kalibrasiya başlayır.
        */

        calibrating =
            true;


        /*
           İlk bir neçə nümunə
           modelə yazılmasın.
        */

        let count =
            0;


        const timer =
            setInterval(
            function(){

                if(!calibrating){

                    clearInterval(
                        timer
                    );

                    return;

                }


                /*
                   WebGazer-in son
                   gaze məlumatı
                   recordScreenPosition
                   vasitəsilə yazılır.

                   Xüsusi olaraq nöqtənin
                   öz koordinatını modelə
                   öyrədirik.
                */

                const rect =
                    point.getBoundingClientRect();


                const targetX =
                    rect.left +
                    rect.width/2;


                const targetY =
                    rect.top +
                    rect.height/2;


                webgazer.recordScreenPosition(
                    targetX,
                    targetY,
                    "click"
                );


                count++;

            },
            120
            );


        /*
           2.2 saniyə
        */

        setTimeout(
        function(){

            calibrating =
                false;


            clearInterval(
                timer
            );


            calibrationIndex++;


            setTimeout(
                nextPoint,
                350
            );

        },
        CALIBRATION_TIME
        );

    },
    500
    );

}


/* =================================================
   KALİBRASİYA BİTDİ
================================================= */

function finishCalibration(){

    calibrating =
        false;


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    calibration.style.display =
        "none";


    /*
       İndi gaze istifadəyə hazırdır.
    */

    gazeReady =
        true;


    showChoices();

}


/* =================================================
   SEÇİMLƏRİ GÖSTƏR
================================================= */

function showChoices(){

    choices.style.display =
        "flex";


    progress.style.display =
        "block";


    reset.style.display =
        "block";


    currentButton =
        null;


    candidateButton =
        null;


    candidateSince =
        0;


    lookStart =
        0;


    smoothY =
        null;


    buttons.forEach(
        b =>
        b.classList.remove(
            "active"
        )
    );


    bar.style.width =
        "0%";


    statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GÖZ KOORDİNATI
================================================= */

function processGaze(
    x,
    y
){

    /*
       Yalnız Y lazımdır,
       çünki HƏ və YOX
       şaquli yerləşir.
    */

    if(
        smoothY === null
    ){

        smoothY =
            y;

    }
    else{

        smoothY +=
            (
                y -
                smoothY
            ) *
            0.20;

    }


    selectByY(
        smoothY
    );

}


/* =================================================
   HƏ / YOX
================================================= */

function selectByY(y){

    if(locked){
        return;
    }


    const yes =
        buttons[0];


    const no =
        buttons[1];


    const yesRect =
        yes.getBoundingClientRect();


    const noRect =
        no.getBoundingClientRect();


    const yesCenter =
        yesRect.top +
        yesRect.height/2;


    const noCenter =
        noRect.top +
        noRect.height/2;


    /*
       HƏ zonası
    */

    const yesLimit =
        yesCenter +
        yesRect.height *
        0.28;


    /*
       YOX zonası
    */

    const noLimit =
        noCenter -
        noRect.height *
        0.28;


    let target =
        null;


    /*
       Yuxarı
    */

    if(
        y <
        yesLimit
    ){

        target =
            yes;

    }


    /*
       Aşağı
    */

    else if(
        y >
        noLimit
    ){

        target =
            no;

    }


    /*
       Aradakı böyük boşluq
    */

    else{

        return;

    }


    /*
       Yeni düymə
    */

    if(
        target !==
        candidateButton
    ){

        candidateButton =
            target;


        candidateSince =
            Date.now();


        return;

    }


    /*
       Düymə 250ms sabit olsun
    */

    if(
        Date.now() -
        candidateSince <
        SWITCH_TIME
    ){

        return;

    }


    /*
       Aktivləşdir
    */

    if(
        currentButton !==
        target
    ){

        currentButton =
            target;


        lookStart =
            Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
            "0%";


        return;

    }


    /*
       Baxış müddəti
    */

    const elapsed =
        Date.now() -
        lookStart;


    const percent =
        Math.min(
            100,
            elapsed /
            DWELL_TIME *
            100
        );


    bar.style.width =
        percent + "%";


    /*
       SEÇİM
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =================================================
   SEÇ
================================================= */

function selectButton(button){

    if(locked){
        return;
    }


    locked =
        true;


    const action =
        button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
            "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
            "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
        "100%";


    setTimeout(
    function(){

        locked =
            false;


        currentButton =
            null;


        candidateButton =
            null;


        candidateSince =
            0;


        lookStart =
            0;


        smoothY =
            null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
            "0%";


        statusBox.innerText =
            "Hazırdır — HƏ və ya YOX-a bax";

    },
    1000
    );

}


/* =================================================
   RESET
================================================= */

reset.addEventListener(
    "click",
    function(){

        gazeReady =
            false;


        currentButton =
            null;


        candidateButton =
            null;


        smoothY =
            null;


        /*
           WebGazer modelini təmizlə
        */

        try{

            webgazer.clearData();

        }
        catch(error){

            console.log(error);

        }


        startCalibration();

    }
);


/* =================================================
   START BUTTON
================================================= */

start.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
