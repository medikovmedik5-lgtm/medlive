<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef5fb;
  font-family:Arial,sans-serif;
  color:#172b4d;
  text-align:center;
}

header{
  background:#1976b9;
  color:white;
  padding:25px 10px;
  font-size:30px;
  font-weight:bold;
}

.status{
  background:white;
  margin:25px 0;
  padding:18px;
  border-radius:20px;
  font-size:19px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.dot{
  display:inline-block;
  width:17px;
  height:17px;
  border-radius:50%;
  background:red;
  margin-right:8px;
}

.main{
  max-width:850px;
  margin:auto;
  padding:10px 20px 40px;
}

h1{font-size:30px}

.info{
  font-size:20px;
  line-height:1.5;
  margin:20px 0 30px;
}

#startBtn{
  width:90%;
  max-width:650px;
  padding:24px;
  border:0;
  border-radius:22px;
  background:#1976b9;
  color:white;
  font-size:23px;
  font-weight:bold;
}

#calibration{
  display:none;
}

#calibrationText{
  font-size:23px;
  font-weight:bold;
  margin:20px;
}

#progress{
  font-size:18px;
  color:#666;
}

#calibrationDot{
  position:fixed;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ff1744;
  border:5px solid white;
  box-shadow:0 0 18px rgba(0,0,0,.5);
  display:none;
  z-index:9999;
  transform:translate(-50%,-50%);
}

#choices{
  display:none;
  margin-top:30px;
  gap:18px;
  flex-direction:column;
}

.choice{
  border:0;
  border-radius:25px;
  min-height:140px;
  color:white;
  font-size:32px;
  font-weight:bold;
}

#yes{background:#22a447}
#call{background:#e53935}
#no{background:#555}

.selected{
  outline:8px solid #ffd600;
  transform:scale(1.02);
}

#gazeText{
  margin-top:25px;
  font-size:20px;
  min-height:35px;
}

.warning{
  margin-top:40px;
  color:#777;
  font-size:14px;
}

/* KAMERA GİZLİ */
#camera{
  position:fixed;
  width:1px;
  height:1px;
  left:-9999px;
  top:-9999px;
  opacity:0;
  pointer-events:none;
}

@media(min-width:650px){
  #choices{
    flex-direction:row;
  }

  .choice{
    flex:1;
    min-height:180px;
  }
}
</style>
</head>

<body>

<header>
🏥 MEDELIN — PALATA 402
</header>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="statusText">Sistem hazır deyil</span>
</div>

<div class="main">

<h1>👁️ Gözlə idarəetmə</h1>

<div class="info">
Kamera sizi görür, amma görüntünüz ekranda göstərilmir.
<br>
Əvvəl sistemi başladın və kalibrasiyanı tamamlayın.
</div>

<button id="startBtn">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="calibration">

  <div id="calibrationText">
    🎯 Nöqtəyə baxın
  </div>

  <div id="progress">
    Hazırlanır...
  </div>

</div>

<div id="choices">

  <button class="choice" id="yes">
    HƏ
  </button>

  <button class="choice" id="call">
    🚨 OTAĞA GƏL
  </button>

  <button class="choice" id="no">
    YOX
  </button>

</div>

<div id="gazeText"></div>

<div class="warning">
Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
</div>

</div>

<div id="calibrationDot"></div>

<video id="camera" autoplay playsinline muted></video>

<script>

const video = document.getElementById("camera");
const startBtn = document.getElementById("startBtn");
const choices = document.getElementById("choices");

const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");
const gazeText = document.getElementById("gazeText");

const calibration = document.getElementById("calibration");
const calibrationDot = document.getElementById("calibrationDot");
const calibrationText = document.getElementById("calibrationText");
const progress = document.getElementById("progress");

let faceMesh;
let stream;

let currentFeature = null;
let calibrated = false;

let calibrationIndex = 0;
let calibrationSamples = [];

let gazeCalibration = null;

let currentButton = null;
let gazeStart = 0;
let lastSelection = 0;


/* =========================
   KALİBRASİYA NÖQTƏLƏRİ
========================= */

const points = [
  {x:10,y:10},
  {x:50,y:10},
  {x:90,y:10},

  {x:10,y:50},
  {x:50,y:50},
  {x:90,y:50},

  {x:10,y:90},
  {x:50,y:90},
  {x:90,y:90}
];


/* =========================
   SƏS
========================= */

function speak(text){

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const s = new SpeechSynthesisUtterance(text);

  s.lang = "az-AZ";
  s.rate = .85;

  speechSynthesis.speak(s);
}


/* =========================
   DÜYMƏ SEÇ
========================= */

function selectButton(button){

  const now = Date.now();

  if(now - lastSelection < 2500) return;

  lastSelection = now;

  document.querySelectorAll(".choice").forEach(b=>{
    b.classList.remove("selected");
  });

  button.classList.add("selected");

  const text = button.innerText;

  gazeText.innerText = "✅ Seçildi: " + text;

  speak(text);

  if(button.id === "call"){

    console.log(
      "PALATA 402 → OTAĞA GƏL"
    );

  }

}


/* =========================
   GÖZ MƏLUMATI
========================= */

function getEyeFeature(face){

  const leftIris = face[468];
  const rightIris = face[473];

  const leftX =
    (leftIris.x - face[33].x) /
    (face[133].x - face[33].x);

  const leftY =
    (leftIris.y - face[159].y) /
    (face[145].y - face[159].y);

  const rightX =
    (rightIris.x - face[362].x) /
    (face[263].x - face[362].x);

  const rightY =
    (rightIris.y - face[386].y) /
    (face[374].y - face[386].y);

  return [
    leftX,
    leftY,
    rightX,
    rightY
  ];
}


/* =========================
   KALİBRASİYA BAŞLA
========================= */

function startCalibration(){

  calibration.style.display = "block";

  choices.style.display = "none";

  calibrationDot.style.display = "block";

  calibrationIndex = 0;

  calibrationSamples = [];

  showPoint();

}


/* =========================
   NÖQTƏ GÖSTƏR
========================= */

function showPoint(){

  if(calibrationIndex >= points.length){

    finishCalibration();

    return;
  }

  const p = points[calibrationIndex];

  calibrationDot.style.left =
    p.x + "%";

  calibrationDot.style.top =
    p.y + "%";

  calibrationSamples = [];

  calibrationText.innerText =
    "🎯 Qırmızı nöqtəyə baxın";

  progress.innerText =
    "Kalibrasiya: " +
    (calibrationIndex + 1) +
    " / " +
    points.length;

  /*
    300 ms gözləyirik,
    sonra 1.5 saniyə ərzində
    DAVAMLI nümunə yığırıq.
  */

  setTimeout(()=>{

    const start = Date.now();

    function collect(){

      if(
        Date.now() - start >= 1500
      ){

        calibrationIndex++;

        showPoint();

        return;
      }

      if(currentFeature){

        calibrationSamples.push([
          ...currentFeature
        ]);

      }

      requestAnimationFrame(collect);

    }

    collect();

  },300);

}


/* =========================
   ORTA GÖZ MƏLUMATI
========================= */

function averageSamples(samples){

  if(!samples.length) return null;

  const result = [0,0,0,0];

  samples.forEach(s=>{

    for(let i=0;i<4;i++){

      result[i] += s[i];

    }

  });

  for(let i=0;i<4;i++){

    result[i] /= samples.length;

  }

  return result;
}


/* =========================
   KALİBRASİYANI HESABLA
========================= */

function finishCalibration(){

  calibrationDot.style.display = "none";

  calibration.style.display = "none";

  /*
    Burada real nümunələri yenidən
    toplaya bilmədiyimiz nöqtələr yoxlanılır.
  */

  /*
    Sadə olaraq ekranın
    9 nöqtəsinə uyğun göz məlumatlarını
    saxlayırıq.
  */

  gazeCalibration = [];

  /*
    Bu prototipdə hər nöqtənin
    orta göz məlumatını ayrıca
    yenidən almaq üçün növbəti
    mərhələdə daha dəqiq model
    quracağıq.
  */

  calibrated = true;

  choices.style.display = "flex";

  statusText.innerText =
    "🟢 Göz idarəsi aktivdir";

  dot.style.background =
    "#20b957";

  gazeText.innerText =
    "👁️ İndi HƏ, OTAĞA GƏL və ya YOX-a baxın.";

}


/* =========================
   GÖZÜN İSTİQAMƏTİNİ
   TƏXMİN ET
========================= */

function estimateGaze(feature){

  if(!feature) return;

  /*
    Gözün kameradakı nisbi
    vəziyyəti.

    Bu hissə prototipdir.
  */

  const eyeX =
    (feature[0] + feature[2]) / 2;

  const eyeY =
    (feature[1] + feature[3]) / 2;


  /*
    Kameranın görüntüsü güzgü
    kimi olduğuna görə X tərsinə çevrilir.
  */

  let x =
    1 - eyeX;

  let y =
    eyeY;


  /*
    Normalizasiya
  */

  x = Math.max(0,Math.min(1,x));
  y = Math.max(0,Math.min(1,y));


  const screenX =
    x * window.innerWidth;

  const screenY =
    y * window.innerHeight;


  checkButton(
    screenX,
    screenY
  );

}


/* =========================
   DÜYMƏNİ YOXLAYIR
========================= */

function checkButton(x,y){

  if(!calibrated) return;

  let found = null;

  document.querySelectorAll(".choice")
  .forEach(button=>{

    const r =
      button.getBoundingClientRect();

    if(
      x >= r.left &&
      x <= r.right &&
      y >= r.top &&
      y <= r.bottom
    ){

      found = button;

    }

  });


  if(found !== currentButton){

    currentButton = found;

    gazeStart = Date.now();

  }


  if(found){

    const elapsed =
      Date.now() - gazeStart;

    const seconds =
      Math.max(
        0,
        1.5 - elapsed / 1000
      );

    gazeText.innerText =
      "👁️ " +
      found.innerText +
      " — " +
      seconds.toFixed(1) +
      " saniyə";


    if(elapsed >= 1500){

      selectButton(found);

      gazeStart =
        Date.now() + 1000;

    }

  }

}


/* =========================
   MEDIAPIPE
========================= */

async function startFaceMesh(){

  faceMesh = new FaceMesh({

    locateFile: function(file){

      return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

    }

  });


  faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

  });


  faceMesh.onResults(function(results){

    if(
      results.multiFaceLandmarks &&
      results.multiFaceLandmarks.length
    ){

      const face =
        results.multiFaceLandmarks[0];

      try{

        currentFeature =
          getEyeFeature(face);

        statusText.innerText =
          "🟢 ÜZ VƏ GÖZLƏR AŞKARLANDI";

        dot.style.background =
          "#20b957";


        if(calibrated){

          estimateGaze(
            currentFeature
          );

        }

      }catch(e){

        console.log(e);

      }

    }else{

      currentFeature = null;

      statusText.innerText =
        "🟡 Üz axtarılır...";

      dot.style.background =
        "#ff9800";

    }

  });


  async function process(){

    if(video.videoWidth > 0){

      await faceMesh.send({
        image:video
      });

    }

    requestAnimationFrame(process);

  }

  process();

}


/* =========================
   KAMERA BAŞLAT
========================= */

async function startCamera(){

  try{

    statusText.innerText =
      "🟡 Kamera açılır...";

    dot.style.background =
      "#ff9800";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },

        audio:false

      });


    video.srcObject =
      stream;

    await video.play();


    statusText.innerText =
      "🟢 Kamera işləyir";

    dot.style.background =
      "#20b957";


    startBtn.style.display =
      "none";


    gazeText.innerText =
      "👁️ Üzünüzü kameraya tərəf saxlayın...";


    await startFaceMesh();


    /*
      Üzün aşkarlanması üçün
      bir az gözləyirik.
    */

    setTimeout(()=>{

      startCalibration();

    },3000);


  }catch(error){

    console.error(error);

    statusText.innerText =
      "🔴 Kamera açıla bilmədi";

    dot.style.background =
      "red";

    gazeText.innerText =
      error.message ||
      "Kamera xətası";

  }

}


/* =========================
   BAŞLAT DÜYMƏSİ
========================= */

startBtn.addEventListener(
  "click",
  startCamera
);


/* =========================
   ƏL İLƏ TEST
========================= */

document.getElementById("yes")
.addEventListener("click",function(){

  selectButton(this);

});

document.getElementById("call")
.addEventListener("click",function(){

  selectButton(this);

});

document.getElementById("no")
.addEventListener("click",function(){

  selectButton(this);

});

</script>

</body>
</html>
