<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172b3a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:68px;
    background:#102a43;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;
}

.logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:.8px;
}

.room{
    font-size:15px;
    font-weight:600;
    color:#c8d5e2;
}

/* STATUS */

#status{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:18px;
    font-weight:600;

    color:#526579;
}

/* START */

#startPanel{
    width:min(680px,90vw);

    margin:35px auto;

    background:#fff;

    border:1px solid #e3e9ef;

    border-radius:28px;

    padding:42px 30px;

    text-align:center;

    box-shadow:
        0 18px 50px
        rgba(16,42,67,.08);
}

.startTitle{
    font-size:30px;
    font-weight:800;

    color:#102a43;

    margin-bottom:14px;
}

.startText{
    color:#718096;

    font-size:16px;

    line-height:1.6;

    margin-bottom:28px;
}

#start{
    border:0;

    background:#102a43;

    color:#fff;

    padding:20px 35px;

    border-radius:16px;

    font-size:18px;

    font-weight:700;
}

/* CAMERA */

#video{
    display:none;
}

/* =========================
   KALİBRASİYA
========================= */

#calibration{
    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:#f5f7fa;
}

.calTitle{
    position:absolute;

    top:28px;

    left:20px;
    right:20px;

    text-align:center;

    font-size:23px;
    font-weight:800;

    color:#102a43;
}

.calText{
    position:absolute;

    top:68px;

    left:20px;
    right:20px;

    text-align:center;

    font-size:15px;

    color:#718096;
}

/* YALNIZ AKTİV NÖQTƏ */

.point{
    display:none;

    position:absolute;

    width:28px;
    height:28px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#c62828;

    border:5px solid white;

    box-shadow:
        0 0 0 7px
        rgba(198,40,40,.14);
}

.point.active{
    display:block;
}

/* =========================
   HƏ / YOX
   MƏCBURİ ŞAQULİ
========================= */

#choices{
    display:none;

    position:fixed;

    top:68px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(100vh - 68px);

    padding:35px 20px 75px;

    flex-direction:column !important;
    flex-wrap:nowrap !important;

    align-items:center !important;
    justify-content:center !important;

    gap:100px !important;
}

/* DÜYMƏ */

.choice{
    display:flex;

    flex:none !important;

    width:min(680px,82vw);

    height:230px;

    margin:0 !important;

    border:0;

    border-radius:32px;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:60px;

    font-weight:800;

    box-shadow:
        0 18px 45px
        rgba(16,42,67,.12);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.yes{
    background:#147d64;
}

.no{
    background:#344054;
}

.choice.active{
    transform:scale(1.045);

    box-shadow:
        0 0 0 8px
        rgba(16,42,67,.12),

        0 22px 50px
        rgba(16,42,67,.18);
}

/* =========================
   PROGRESS
========================= */

#progress{
    display:none;

    position:fixed;

    left:18%;
    right:18%;

    bottom:25px;

    height:8px;

    background:#dce3ea;

    border-radius:20px;

    overflow:hidden;

    z-index:150;
}

#bar{
    width:0%;

    height:100%;

    background:#102a43;
}

/* RESET */

#reset{
    display:none;

    position:fixed;

    top:78px;
    right:15px;

    z-index:200;

    border:0;

    background:transparent;

    color:#718096;

    font-size:12px;
}

/* =========================
   TELEFON
========================= */

@media(max-width:700px){

    header{
        height:60px;

        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{
        font-size:13px;
    }

    #status{
        height:60px;

        font-size:15px;
    }

    #startPanel{
        margin-top:25px;

        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    .startText{
        font-size:15px;
    }

    /*
       ƏN VACİB:
       mobil telefonda da
       mütləq sütun
    */

    #choices{
        top:60px;

        height:calc(100vh - 60px);

        padding:
            25px 18px
            70px;

        flex-direction:column !important;
        flex-wrap:nowrap !important;

        align-items:center !important;
        justify-content:center !important;

        gap:90px !important;
    }

    .choice{
        width:82vw;

        height:205px;

        flex:none !important;

        font-size:43px;
    }
}

/* ÇOX BALACA TELEFON */

@media(max-width:400px){

    #choices{
        gap:75px !important;
    }

    .choice{
        width:84vw;
        height:185px;
        font-size:38px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        MEDELIN
    </div>

    <div class="room">
        PALATA 402
    </div>

</header>


<div id="status">
    Sistem hazır deyil
</div>


<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>


<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə sakit şəkildə baxın
    </div>


    <!-- MƏRKƏZ -->

    <div
        class="point"
        data-key="center"
        style="left:50%;top:50%;">
    </div>


    <!-- SOL -->

    <div
        class="point"
        data-key="left"
        style="left:15%;top:50%;">
    </div>


    <!-- SAĞ -->

    <div
        class="point"
        data-key="right"
        style="left:85%;top:50%;">
    </div>


    <!-- YUXARI -->

    <div
        class="point"
        data-key="up"
        style="left:50%;top:22%;">
    </div>


    <!-- AŞAĞI -->

    <div
        class="point"
        data-key="down"
        style="left:50%;top:78%;">
    </div>

</div>


<!-- =========================
     HƏ YUXARIDA
     YOX AŞAĞIDA
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>


    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">
    <div id="bar"></div>
</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const video =
document.getElementById("video");

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    ...document.querySelectorAll(".point")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =================================================
   PARAMETRLƏR
================================================= */

const STORAGE_KEY =
"MEDELIN_402_VERTICAL_FINAL";

const POINT_TIME =
1600;

const DWELL_TIME =
1800;

const SMOOTH =
0.10;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let running = false;

let collecting = false;

let calibrationData = null;

let lastEyeX = 0.5;

let lastEyeY = 0.5;

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStarted = 0;

let locked = false;


/* =================================================
   MEDIAPIPE
================================================= */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.55,

    minTrackingConfidence:0.55

});


/* =================================================
   ORTAQ NÖQTƏ
================================================= */

function average(
    landmarks,
    indexes
){

    let x = 0;
    let y = 0;
    let count = 0;


    for(
        const index of indexes
    ){

        if(!landmarks[index]){
            continue;
        }

        x +=
        landmarks[index].x;

        y +=
        landmarks[index].y;

        count++;

    }


    if(!count){
        return null;
    }


    return {

        x:x/count,

        y:y/count

    };

}


/* =================================================
   GÖZ FEATURE
================================================= */

function getEye(
    landmarks
){

    const leftIris =
    average(
        landmarks,
        [468,469,470,471,472]
    );


    const rightIris =
    average(
        landmarks,
        [473,474,475,476,477]
    );


    if(
        !leftIris ||
        !rightIris
    ){

        return null;

    }


    const lo =
    landmarks[33];

    const li =
    landmarks[133];

    const lt =
    landmarks[159];

    const lb =
    landmarks[145];


    const ri =
    landmarks[362];

    const ro =
    landmarks[263];

    const rt =
    landmarks[386];

    const rb =
    landmarks[374];


    if(
        !lo || !li ||
        !lt || !lb ||
        !ri || !ro ||
        !rt || !rb
    ){

        return null;

    }


    const leftWidth =
    Math.max(
        Math.abs(
            li.x-lo.x
        ),
        0.0001
    );


    const rightWidth =
    Math.max(
        Math.abs(
            ro.x-ri.x
        ),
        0.0001
    );


    const leftHeight =
    Math.max(
        Math.abs(
            lb.y-lt.y
        ),
        0.0001
    );


    const rightHeight =
    Math.max(
        Math.abs(
            rb.y-rt.y
        ),
        0.0001
    );


    const lx =
    (leftIris.x-lo.x) /
    leftWidth;


    const rx =
    (rightIris.x-ri.x) /
    rightWidth;


    const ly =
    (leftIris.y-lt.y) /
    leftHeight;


    const ry =
    (rightIris.y-rt.y) /
    rightHeight;


    return {

        x:(lx+rx)/2,

        y:(ly+ry)/2

    };

}


/* =================================================
   FACE RESULTS
================================================= */

faceMesh.onResults(
function(results){

    if(!running){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    const eye =
    getEye(
        results.multiFaceLandmarks[0]
    );


    if(!eye){
        return;
    }


    lastEyeX =
    eye.x;

    lastEyeY =
    eye.y;


    /*
       Kalibrasiya
    */

    if(collecting){
        return;
    }


    /*
       Normal göz izləmə
    */

    if(
        calibrationData &&
        calibrationData.center &&
        calibrationData.left &&
        calibrationData.right &&
        calibrationData.up &&
        calibrationData.down
    ){

        const position =
        predictGaze(
            eye.x,
            eye.y
        );


        updateGaze(
            position.x,
            position.y
        );

    }

});


/* =================================================
   SİSTEMİ BAŞLAT
================================================= */

async function startSystem(){

    start.disabled =
    true;


    statusBox.innerText =
    "Kamera hazırlanır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                }
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running =
        true;


        startPanel.style.display =
        "none";


        statusBox.innerText =
        "Göz sistemi hazırlanır...";


        const camera =
        new Camera(
            video,
            {

                onFrame:
                async function(){

                    try{

                        await faceMesh.send({
                            image:video
                        });

                    }
                    catch(error){

                        console.log(
                            error
                        );

                    }

                },

                width:640,

                height:480

            }
        );


        camera.start();


        setTimeout(
            begin,
            1500
        );

    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "Kamera açıla bilmədi";


        start.disabled =
        false;

    }

}


/* =================================================
   BAŞLA
================================================= */

function begin(){

    const saved =
    localStorage.getItem(
        STORAGE_KEY
    );


    if(saved){

        try{

            const data =
            JSON.parse(saved);


            if(
                data.center &&
                data.left &&
                data.right &&
                data.up &&
                data.down
            ){

                calibrationData =
                data;


                showChoices();


                return;

            }

        }
        catch(error){

            localStorage.removeItem(
                STORAGE_KEY
            );

        }

    }


    startCalibration();

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrationData = {

        center:null,
        left:null,
        right:null,
        up:null,
        down:null

    };


    calibration.style.display =
    "block";


    choices.style.display =
    "none";


    progress.style.display =
    "none";


    reset.style.display =
    "none";


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    let index = 0;


    function nextPoint(){

        points.forEach(
            p =>
            p.classList.remove(
                "active"
            )
        );


        /*
           BİTDİ
        */

        if(
            index >=
            points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        const key =
        point.dataset.key;


        point.classList.add(
            "active"
        );


        statusBox.innerText =
        "Nöqtəyə baxın  " +
        (index+1) +
        " / 5";


        collecting =
        true;


        setTimeout(
        function(){

            collecting =
            false;


            const rect =
            point.getBoundingClientRect();


            /*
               Son göz mövqeyi
            */

            calibrationData[key] = {

                eyeX:
                lastEyeX,

                eyeY:
                lastEyeY,

                screenX:
                rect.left +
                rect.width/2,

                screenY:
                rect.top +
                rect.height/2

            };


            index++;


            setTimeout(
                nextPoint,
                300
            );

        },
        POINT_TIME
        );

    }


    nextPoint();

}


/* =================================================
   KALİBRASİYA BİTİR
================================================= */

function finishCalibration(){

    collecting =
    false;


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            calibrationData
        )
    );


    calibration.style.display =
    "none";


    showChoices();

}


/* =================================================
   HƏ / YOX EKRANI
================================================= */

function showChoices(){

    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    reset.style.display =
    "block";


    gazeX =
    null;

    gazeY =
    null;

    currentButton =
    null;

    lookStarted =
    0;


    statusBox.innerText =
    "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GÖZÜ EKRANA XƏRİTƏLƏ
================================================= */

function predictGaze(
    x,
    y
){

    const up =
    calibrationData.up;

    const down =
    calibrationData.down;


    /*
       YUXARI / AŞAĞI
       əsas idarəetmədir.
    */

    let ny =
    (
        y -
        up.eyeY
    ) /
    Math.max(
        down.eyeY -
        up.eyeY,
        0.0001
    );


    ny =
    Math.max(
        0,
        Math.min(
            1,
            ny
        )
    );


    /*
       EKRANDA:

       0   = yuxarı
       1   = aşağı
    */

    const screenX =
    window.innerWidth /
    2;


    const screenY =
    window.innerHeight *
    (
        0.20 +
        ny * 0.60
    );


    return {

        x:screenX,

        y:screenY

    };

}


/* =================================================
   YUMŞALTMA
================================================= */

function updateGaze(
    x,
    y
){

    if(
        gazeX === null
    ){

        gazeX =
        x;

        gazeY =
        y;

    }
    else{

        gazeX +=
        (
            x -
            gazeX
        ) *
        SMOOTH;


        gazeY +=
        (
            y -
            gazeY
        ) *
        SMOOTH;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =================================================
   HƏ / YOX SEÇ
================================================= */

function checkButton(
    x,
    y
){

    if(locked){
        return;
    }


    let target =
    null;


    /*
       ORTA ZONA

       Burada heç nə seçilmir.
       Bu böyük boşluqdur.
    */

    const middle =
    window.innerHeight /
    2;


    /*
       YUXARI = HƏ
    */

    if(
        y <
        middle - 65
    ){

        target =
        buttons[0];

    }


    /*
       AŞAĞI = YOX
    */

    else if(
        y >
        middle + 65
    ){

        target =
        buttons[1];

    }


    /*
       Ortada qalırsa
       hazırkı seçim saxlanır.
    */

    else{

        return;

    }


    /*
       Yeni seçim
    */

    if(
        target !==
        currentButton
    ){

        currentButton =
        target;


        lookStarted =
        Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       Sabit baxış
    */

    const elapsed =
    Date.now() -
    lookStarted;


    const percent =
    Math.min(
        100,
        elapsed /
        DWELL_TIME *
        100
    );


    bar.style.width =
    percent +
    "%";


    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =================================================
   SEÇİM
================================================= */

function selectButton(
    button
){

    if(locked){
        return;
    }


    locked =
    true;


    const action =
    button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
        "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
        "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked =
        false;


        currentButton =
        null;


        lookStarted =
        0;


        gazeX =
        null;


        gazeY =
        null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
        "0%";


        statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

    },
    1200
    );

}


/* =================================================
   YENİDƏN KALİBRASİYA
================================================= */

reset.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            STORAGE_KEY
        );


        calibrationData =
        null;


        gazeX =
        null;

        gazeY =
        null;


        startCalibration();

    }
);


/* =================================================
   START
================================================= */

start.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
