<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef5fb;
  font-family:Arial,sans-serif;
  color:#172b4d;
  text-align:center;
}

header{
  background:#1976b9;
  color:white;
  padding:25px 10px;
  font-size:30px;
  font-weight:bold;
}

.status{
  background:white;
  margin:25px 0;
  padding:18px;
  border-radius:20px;
  font-size:19px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.dot{
  display:inline-block;
  width:17px;
  height:17px;
  border-radius:50%;
  background:red;
  margin-right:8px;
}

.main{
  max-width:850px;
  margin:auto;
  padding:10px 20px 40px;
}

h1{
  font-size:30px;
}

.info{
  font-size:20px;
  line-height:1.5;
  margin:20px 0 30px;
}

#startBtn{
  width:90%;
  max-width:650px;
  padding:24px;
  border:0;
  border-radius:22px;
  background:#1976b9;
  color:white;
  font-size:23px;
  font-weight:bold;
}

#calibration{
  display:none;
}

#calibrationText{
  font-size:23px;
  font-weight:bold;
  margin:20px;
}

#progress{
  font-size:18px;
  color:#666;
}

#calibrationDot{
  position:fixed;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ff1744;
  border:5px solid white;
  box-shadow:0 0 18px rgba(0,0,0,.5);
  display:none;
  z-index:9999;
  transform:translate(-50%,-50%);
}

#choices{
  display:none;
  margin-top:30px;
  gap:18px;
  flex-direction:column;
}

.choice{
  border:0;
  border-radius:25px;
  min-height:140px;
  color:white;
  font-size:32px;
  font-weight:bold;
}

#yes{
  background:#22a447;
}

#call{
  background:#e53935;
}

#no{
  background:#555;
}

.selected{
  outline:8px solid #ffd600;
  transform:scale(1.02);
}

#gazeText{
  margin-top:25px;
  font-size:20px;
  min-height:35px;
}

.warning{
  margin-top:40px;
  color:#777;
  font-size:14px;
}

/* Kamera istifadə olunur, amma görünmür */
#camera{
  position:fixed;
  width:1px;
  height:1px;
  left:-9999px;
  top:-9999px;
  opacity:0;
  pointer-events:none;
}

@media(min-width:650px){
  #choices{
    flex-direction:row;
  }

  .choice{
    flex:1;
    min-height:180px;
  }
}
</style>
</head>

<body>

<header>
🏥 MEDELIN — PALATA 402
</header>

<div class="status">
<span class="dot" id="dot"></span>
<span id="statusText">Sistem hazır deyil</span>
</div>

<div class="main">

<h1>👁️ Gözlə idarəetmə</h1>

<div class="info">
Kamera sizi görür, amma görüntünüz ekranda göstərilmir.
<br>
Əvvəl sistemi başladın və kalibrasiyanı tamamlayın.
</div>

<button id="startBtn">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="calibration">

<div id="calibrationText">
🎯 Qırmızı nöqtəyə baxın
</div>

<div id="progress">
Hazırlanır...
</div>

</div>

<div id="choices">

<button class="choice" id="yes">
HƏ
</button>

<button class="choice" id="call">
🚨 OTAĞA GƏL
</button>

<button class="choice" id="no">
YOX
</button>

</div>

<div id="gazeText"></div>

<div class="warning">
Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
</div>

</div>

<div id="calibrationDot"></div>

<video id="camera" autoplay playsinline muted></video>

<script>

const video = document.getElementById("camera");
const startBtn = document.getElementById("startBtn");
const choices = document.getElementById("choices");

const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");

const calibration = document.getElementById("calibration");
const calibrationDot = document.getElementById("calibrationDot");
const calibrationText = document.getElementById("calibrationText");
const progress = document.getElementById("progress");

const gazeText = document.getElementById("gazeText");

let faceMesh;
let stream;

let currentFeature = null;

let calibrated = false;

let calibrationIndex = 0;

/*
  ƏSAS DÜZƏLİŞ:
  Hər nöqtənin məlumatını ayrıca saxlayırıq.
*/
let calibrationSamples = [];

let calibrationModel = [];

let currentButton = null;
let gazeStart = 0;
let lastSelection = 0;


/* =========================
   9 KALİBRASİYA NÖQTƏSİ
========================= */

const points = [

  {x:10,y:10},
  {x:50,y:10},
  {x:90,y:10},

  {x:10,y:50},
  {x:50,y:50},
  {x:90,y:50},

  {x:10,y:90},
  {x:50,y:90},
  {x:90,y:90}

];


/* =========================
   SƏS
========================= */

function speak(text){

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const s =
    new SpeechSynthesisUtterance(text);

  s.lang = "az-AZ";
  s.rate = .85;

  speechSynthesis.speak(s);
}


/* =========================
   GÖZ FEATURE
========================= */

function getEyeFeature(face){

  const leftIris = face[468];
  const rightIris = face[473];

  const leftWidth =
    face[133].x - face[33].x;

  const rightWidth =
    face[263].x - face[362].x;

  const leftHeight =
    face[145].y - face[159].y;

  const rightHeight =
    face[374].y - face[386].y;

  if(
    Math.abs(leftWidth) < 0.001 ||
    Math.abs(rightWidth) < 0.001 ||
    Math.abs(leftHeight) < 0.001 ||
    Math.abs(rightHeight) < 0.001
  ){
    return null;
  }

  const leftX =
    (leftIris.x - face[33].x) /
    leftWidth;

  const leftY =
    (leftIris.y - face[159].y) /
    leftHeight;

  const rightX =
    (rightIris.x - face[362].x) /
    rightWidth;

  const rightY =
    (rightIris.y - face[386].y) /
    rightHeight;

  return [
    leftX,
    leftY,
    rightX,
    rightY
  ];
}


/* =========================
   ORTA MƏLUMAT
========================= */

function average(samples){

  if(!samples.length) return null;

  const result=[0,0,0,0];

  samples.forEach(s=>{

    for(let i=0;i<4;i++){
      result[i]+=s[i];
    }

  });

  for(let i=0;i<4;i++){
    result[i]/=samples.length;
  }

  return result;
}


/* =========================
   KALİBRASİYA BAŞLA
========================= */

function startCalibration(){

  calibrated=false;

  calibrationIndex=0;

  calibrationSamples=[];

  calibrationModel=[];

  calibration.style.display="block";

  choices.style.display="none";

  calibrationDot.style.display="block";

  showPoint();
}


/* =========================
   NÖQTƏ
========================= */

function showPoint(){

  if(calibrationIndex >= points.length){

    finishCalibration();

    return;
  }

  const p=points[calibrationIndex];

  calibrationDot.style.left=
    p.x+"%";

  calibrationDot.style.top=
    p.y+"%";

  calibrationSamples=[];

  calibrationText.innerText=
    "🎯 Qırmızı nöqtəyə baxın";

  progress.innerText=
    "Kalibrasiya: "+
    (calibrationIndex+1)+
    " / "+
    points.length;

  /*
    500 ms gözləyirik.
    Sonra 2 saniyə ərzində
    çoxlu göz nümunəsi yığırıq.
  */

  setTimeout(()=>{

    const start=Date.now();

    function collect(){

      const elapsed=
        Date.now()-start;

      if(elapsed>=2000){

        const avg=
          average(calibrationSamples);

        if(avg){

          calibrationModel.push({

            feature:avg,

            x:window.innerWidth*p.x/100,

            y:window.innerHeight*p.y/100

          });

        }

        calibrationIndex++;

        showPoint();

        return;
      }

      if(currentFeature){

        calibrationSamples.push(
          [...currentFeature]
        );

      }

      requestAnimationFrame(collect);

    }

    collect();

  },500);
}


/* =========================
   KALİBRASİYA BİTİR
========================= */

function finishCalibration(){

  calibrationDot.style.display="none";

  calibration.style.display="none";

  /*
    ƏN AZI 6 NÖQTƏ lazımdır.
  */

  if(calibrationModel.length < 6){

    calibrated=false;

    statusText.innerText=
      "🔴 Kalibrasiya alınmadı";

    dot.style.background="red";

    gazeText.innerText=
      calibrationModel.length+
      " nöqtə qeydə alındı. Yenidən başladın.";

    startBtn.style.display="block";

    return;
  }

  calibrated=true;

  choices.style.display="flex";

  statusText.innerText=
    "🟢 Göz idarəsi hazırdır";

  dot.style.background="#20b957";

  gazeText.innerText=
    "👁️ İndi HƏ, OTAĞA GƏL və ya YOX-a baxın.";
}


/* =========================
   İKİ GÖZ ARASINDA MƏSAFƏ
========================= */

function distance(a,b){

  let total=0;

  for(let i=0;i<4;i++){

    const d=a[i]-b[i];

    total+=d*d;

  }

  return Math.sqrt(total);
}


/* =========================
   BAXIŞI TAP
========================= */

function estimateGaze(feature){

  if(!calibrated) return;

  if(!calibrationModel.length) return;

  let nearest=null;

  let best=Infinity;

  calibrationModel.forEach(point=>{

    const d=
      distance(
        feature,
        point.feature
      );

    if(d<best){

      best=d;

      nearest=point;

    }

  });

  if(!nearest) return;

  checkButton(
    nearest.x,
    nearest.y
  );
}


/* =========================
   DÜYMƏNİ YOXLAYIR
========================= */

function checkButton(x,y){

  let found=null;

  document.querySelectorAll(".choice")
  .forEach(button=>{

    const r=
      button.getBoundingClientRect();

    if(
      x>=r.left &&
      x<=r.right &&
      y>=r.top &&
      y<=r.bottom
    ){

      found=button;

    }

  });


  if(found!==currentButton){

    currentButton=found;

    gazeStart=Date.now();

    document.querySelectorAll(".choice")
    .forEach(b=>{
      b.classList.remove("selected");
    });

  }


  if(found){

    const elapsed=
      Date.now()-gazeStart;

    const remaining=
      Math.max(
        0,
        1.5-elapsed/1000
      );

    gazeText.innerText=
      "👁️ "+
      found.innerText+
      " — "+
      remaining.toFixed(1)+
      " saniyə";


    if(elapsed>=1500){

      selectButton(found);

      gazeStart=
        Date.now()+1000;

    }

  }

}


/* =========================
   SEÇİM
========================= */

function selectButton(button){

  const now=Date.now();

  if(now-lastSelection<2500)
    return;

  lastSelection=now;

  document.querySelectorAll(".choice")
  .forEach(b=>{
    b.classList.remove("selected");
  });

  button.classList.add("selected");

  const text=
    button.innerText;

  gazeText.innerText=
    "✅ Seçildi: "+text;

  speak(text);

  if(button.id==="call"){

    console.log(
      "PALATA 402 → OTAĞA GƏL"
    );

  }

}


/* =========================
   MEDIAPIPE
========================= */

async function startFaceMesh(){

  faceMesh=new FaceMesh({

    locateFile:function(file){
      return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+file;
    }

  });


  faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

  });


  faceMesh.onResults(function(results){

    if(
      results.multiFaceLandmarks &&
      results.multiFaceLandmarks.length>0
    ){

      const face=
        results.multiFaceLandmarks[0];

      currentFeature=
        getEyeFeature(face);

      if(currentFeature){

        statusText.innerText=
          calibrated
          ? "🟢 Göz izlənilir"
          : "🟢 ÜZ VƏ GÖZLƏR AŞKARLANDI";

        dot.style.background="#20b957";

        if(calibrated){

          estimateGaze(
            currentFeature
          );

        }

      }

    }else{

      currentFeature=null;

      statusText.innerText=
        "🟡 Üz axtarılır...";

      dot.style.background="#ff9800";

    }

  });


  async function process(){

    if(video.videoWidth>0){

      await faceMesh.send({
        image:video
      });

    }

    requestAnimationFrame(process);

  }

  process();

}


/* =========================
   KAMERA
========================= */

async function startCamera(){

  try{

    statusText.innerText=
      "🟡 Kamera açılır...";

    dot.style.background="#ff9800";


    stream=
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },

        audio:false

      });


    video.srcObject=stream;

    await video.play();


    statusText.innerText=
      "🟢 Kamera işləyir";

    dot.style.background="#20b957";

    startBtn.style.display="none";

    gazeText.innerText=
      "👁️ Üzünüzü kameraya tərəf saxlayın...";


    await startFaceMesh();


    setTimeout(()=>{

      startCalibration();

    },3000);


  }catch(error){

    console.error(error);

    statusText.innerText=
      "🔴 Kamera açıla bilmədi";

    dot.style.background="red";

    gazeText.innerText=
      error.message ||
      "Kamera xətası";

  }

}


/* =========================
   BAŞLAT
========================= */

startBtn.addEventListener(
  "click",
  startCamera
);


/* =========================
   ƏL İLƏ TEST
========================= */

document.getElementById("yes")
.addEventListener("click",function(){
  selectButton(this);
});

document.getElementById("call")
.addEventListener("click",function(){
  selectButton(this);
});

document.getElementById("no")
.addEventListener("click",function(){
  selectButton(this);
});

</script>

</body>
</html>
