<script>

/* =====================================================
   ELEMENTLƏR
===================================================== */

const video =
document.getElementById("video");

const startButton =
document.getElementById("start");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const buttons =
[...document.querySelectorAll(".choice")];


/* =====================================================
   FACE MESH
===================================================== */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return
        "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
        + file;

    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.55,

    minTrackingConfidence:0.55

});


/* =====================================================
   SİSTEM DƏYİŞƏNLƏRİ
===================================================== */

let camera = null;

let running = false;

let calibrationCollecting = false;

let calibrationData = [];

let currentSamples = [];

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStart = 0;

let locked = false;

let processing = false;


/*
   Daha yumşaq göz hərəkəti.
*/

const SMOOTHING = 0.16;


/*
   Düyməyə baxış müddəti.
*/

const DWELL_TIME = 1800;


/*
   Düymə dəyişməsi üçün
   əlavə sabitlik.
*/

const SWITCH_DELAY = 250;


/*
   Hazırkı düymənin
   yaddaşda saxlanması.
*/

let possibleButton = null;

let possibleButtonTime = 0;


/* =====================================================
   GÖZ FEATURE-LƏRİ
===================================================== */

function getEyeFeatures(landmarks){

    try{

        /*
           SOL İRİS
        */

        const leftIris = [
            468,
            469,
            470,
            471,
            472
        ];

        let leftIX = 0;
        let leftIY = 0;


        for(
            const index
            of leftIris
        ){

            leftIX +=
            landmarks[index].x;

            leftIY +=
            landmarks[index].y;

        }


        leftIX /=
        leftIris.length;

        leftIY /=
        leftIris.length;


        /*
           SOL GÖZ KƏNARLARI
        */

        const leftOuter =
        landmarks[33];

        const leftInner =
        landmarks[133];

        const leftTop =
        landmarks[159];

        const leftBottom =
        landmarks[145];


        /*
           SAĞ İRİS
        */

        const rightIris = [
            473,
            474,
            475,
            476,
            477
        ];

        let rightIX = 0;
        let rightIY = 0;


        for(
            const index
            of rightIris
        ){

            rightIX +=
            landmarks[index].x;

            rightIY +=
            landmarks[index].y;

        }


        rightIX /=
        rightIris.length;

        rightIY /=
        rightIris.length;


        /*
           SAĞ GÖZ
        */

        const rightOuter =
        landmarks[362];

        const rightInner =
        landmarks[263];

        const rightTop =
        landmarks[386];

        const rightBottom =
        landmarks[374];


        /*
           ÖLÇÜLƏR
        */

        const leftWidth =
        Math.max(

            Math.abs(
                leftInner.x -
                leftOuter.x
            ),

            0.0001

        );


        const rightWidth =
        Math.max(

            Math.abs(
                rightInner.x -
                rightOuter.x
            ),

            0.0001

        );


        const leftHeight =
        Math.max(

            Math.abs(
                leftBottom.y -
                leftTop.y
            ),

            0.0001

        );


        const rightHeight =
        Math.max(

            Math.abs(
                rightBottom.y -
                rightTop.y
            ),

            0.0001

        );


        /*
           İRİSİN GÖZ İÇİNDƏKİ
           NİSBİ MÖVQEYİ
        */

        const leftX =
        (leftIX - leftOuter.x)
        / leftWidth;


        const rightX =
        (rightIX - rightOuter.x)
        / rightWidth;


        const leftY =
        (leftIY - leftTop.y)
        / leftHeight;


        const rightY =
        (rightIY - rightTop.y)
        / rightHeight;


        /*
           ORTA GÖSTƏRİCİLƏR
        */

        return {

            lx:leftX,

            ly:leftY,

            rx:rightX,

            ry:rightY,

            x:
            (leftX + rightX) / 2,

            y:
            (leftY + rightY) / 2

        };

    }catch(error){

        return null;

    }

}


/* =====================================================
   FACE MESH
===================================================== */

faceMesh.onResults(
function(results){

    if(!running){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        return;

    }


    const landmarks =
    results.multiFaceLandmarks[0];


    const eye =
    getEyeFeatures(landmarks);


    if(!eye){
        return;
    }


    /*
       KALİBRASİYA
    */

    if(calibrationCollecting){

        currentSamples.push({

            x:eye.x,
            y:eye.y,

            lx:eye.lx,
            ly:eye.ly,

            rx:eye.rx,
            ry:eye.ry

        });

        return;

    }


    /*
       GÖZ İZLƏMƏ
    */

    if(
        calibrationData.length >= 7
    ){

        const position =
        predictGaze(eye);


        if(position){

            updateGaze(

                position.x,

                position.y

            );

        }

    }

});


/* =====================================================
   KAMERA BAŞLAT
===================================================== */

async function startSystem(){

    startButton.style.display =
    "none";


    statusBox.innerText =
    "Kamera açılır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30,
                    max:30
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running = true;


        statusBox.innerText =
        "Kamera hazırdır";


        camera =
        new Camera(

            video,

            {

                onFrame:
                async function(){

                    if(processing){
                        return;
                    }


                    processing = true;


                    try{

                        await faceMesh.send({

                            image:video

                        });

                    }catch(error){

                        console.error(error);

                    }


                    processing = false;

                },

                width:1280,

                height:720

            }

        );


        camera.start();


        setTimeout(

            startCalibration,

            1800

        );


    }catch(error){

        console.error(
            "KAMERA:",
            error
        );


        statusBox.innerText =
        "Kameraya icazə verilmədi";


        startButton.style.display =
        "block";

    }

}


/* =====================================================
   KALİBRASİYA
===================================================== */

function startCalibration(){

    calibrationData = [];

    calibrationCollecting =
    false;


    calibration.style.display =
    "block";


    const points =
    [
        ...document.querySelectorAll(".point")
    ];


    let index = 0;


    function nextPoint(){

        if(
            index >= points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        const rect =
        point.getBoundingClientRect();


        const targetX =
        rect.left +
        rect.width / 2;


        const targetY =
        rect.top +
        rect.height / 2;


        currentSamples = [];


        calibrationCollecting =
        false;


        statusBox.innerText =
        "Nöqtəyə bax  " +
        (index + 1) +
        " / " +
        points.length;


        /*
           Xəstəyə nöqtəyə
           fokuslanmaq üçün vaxt.
        */

        setTimeout(
        function(){

            currentSamples = [];

            calibrationCollecting =
            true;


            /*
               2200 ms nümunə yığırıq.
            */

            setTimeout(
            function(){

                calibrationCollecting =
                false;


                if(
                    currentSamples.length >= 12
                ){

                    const average =
                    getAverageSample(
                        currentSamples
                    );


                    calibrationData.push({

                        features:average,

                        screenX:targetX,

                        screenY:targetY

                    });

                }


                index++;


                setTimeout(

                    nextPoint,

                    350

                );


            },2200);


        },600);

    }


    nextPoint();

}


/* =====================================================
   ORTA NÜMUNƏ
===================================================== */

function getAverageSample(samples){

    /*
       İlk və son hissələrdə
       baş hərəkəti ola bildiyi üçün
       orta hissədən istifadə edirik.
    */

    let start =
    Math.floor(
        samples.length * 0.15
    );


    let end =
    Math.floor(
        samples.length * 0.85
    );


    if(end <= start){
        start = 0;
        end = samples.length;
    }


    let sx = 0;
    let sy = 0;

    let slx = 0;
    let sly = 0;

    let srx = 0;
    let sry = 0;


    let count = 0;


    for(
        let i=start;
        i<end;
        i++
    ){

        const sample =
        samples[i];


        sx += sample.x;
        sy += sample.y;

        slx += sample.lx;
        sly += sample.ly;

        srx += sample.rx;
        sry += sample.ry;


        count++;

    }


    return {

        x:sx/count,
        y:sy/count,

        lx:slx/count,
        ly:sly/count,

        rx:srx/count,
        ry:sry/count

    };

}


/* =====================================================
   XƏTTİ REGRESSİYA
===================================================== */

function getFeatureVector(f){

    /*
       5 əsas göstərici:

       1
       sol X
       sol Y
       sağ X
       sağ Y

       Bu 9 kalibrasiya nöqtəsindən
       ekran koordinatı öyrənilir.
    */

    return [

        1,

        f.lx,

        f.ly,

        f.rx,

        f.ry

    ];

}


/* =====================================================
   MATRİS HESABLAMA
===================================================== */

function transpose(matrix){

    return matrix[0].map(
        function(_,column){

            return matrix.map(
                function(row){

                    return row[column];

                }
            );

        }
    );

}


function multiply(A,B){

    const result = [];

    for(
        let i=0;
        i<A.length;
        i++
    ){

        result[i] = [];

        for(
            let j=0;
            j<B[0].length;
            j++
        ){

            let sum = 0;

            for(
                let k=0;
                k<B.length;
                k++
            ){

                sum +=
                A[i][k] *
                B[k][j];

            }

            result[i][j] =
            sum;

        }

    }

    return result;

}


/*
   Kiçik matrisin tərsini
   Gauss-Jordan ilə tapırıq.
*/

function inverse(matrix){

    const n =
    matrix.length;


    const a =
    matrix.map(
        function(row,i){

            return row.slice().concat(

                Array.from(
                    {length:n},
                    function(_,j){

                        return i === j
                        ? 1
                        : 0;

                    }
                )

            );

        }
    );


    for(
        let i=0;
        i<n;
        i++
    ){

        let maxRow = i;


        for(
            let r=i+1;
            r<n;
            r++
        ){

            if(
                Math.abs(a[r][i]) >
                Math.abs(a[maxRow][i])
            ){

                maxRow = r;

            }

        }


        if(
            Math.abs(a[maxRow][i]) <
            0.0000001
        ){

            return null;

        }


        const temp =
        a[i];

        a[i] =
        a[maxRow];

        a[maxRow] =
        temp;


        const pivot =
        a[i][i];


        for(
            let j=0;
            j<2*n;
            j++
        ){

            a[i][j] /=
            pivot;

        }


        for(
            let r=0;
            r<n;
            r++
        ){

            if(r === i){
                continue;
            }


            const factor =
            a[r][i];


            for(
                let j=0;
                j<2*n;
                j++
            ){

                a[r][j] -=
                factor *
                a[i][j];

            }

        }

    }


    return a.map(
        function(row){

            return row.slice(n);

        }
    );

}


/* =====================================================
   REGRESSİYA MODELİ
===================================================== */

let modelX = null;
let modelY = null;


function trainModel(){

    if(
        calibrationData.length < 7
    ){

        return false;

    }


    const X =
    calibrationData.map(
        function(point){

            return getFeatureVector(
                point.features
            );

        }
    );


    const Yx =
    calibrationData.map(
        function(point){

            return [
                point.screenX
            ];

        }
    );


    const Yy =
    calibrationData.map(
        function(point){

            return [
                point.screenY
            ];

        }
    );


    const XT =
    transpose(X);


    const XTX =
    multiply(
        XT,
        X
    );


    /*
       Kiçik regularizasiya.
       Bu modelin 9 nöqtədə
       daha stabil olmasına kömək edir.
    */

    for(
        let i=1;
        i<XTX.length;
        i++
    ){

        XTX[i][i] +=
        0.001;

    }


    const inv =
    inverse(XTX);


    if(!inv){

        return false;

    }


    modelX =
    multiply(
        multiply(
            inv,
            XT
        ),
        Yx
    ).map(
        function(row){

            return row[0];

        }
    );


    modelY =
    multiply(
        multiply(
            inv,
            XT
        ),
        Yy
    ).map(
        function(row){

            return row[0];

        }
    );


    return true;

}


/* =====================================================
   GÖZÜ EKRANA XƏRİTƏLƏ
===================================================== */

function predictGaze(eye){

    if(
        !modelX ||
        !modelY
    ){

        return null;

    }


    const features =
    getFeatureVector(eye);


    let x = 0;
    let y = 0;


    for(
        let i=0;
        i<features.length;
        i++
    ){

        x +=
        features[i] *
        modelX[i];


        y +=
        features[i] *
        modelY[i];

    }


    /*
       Ekranın kənarına çıxmasın.
    */

    x =
    Math.max(
        0,
        Math.min(
            window.innerWidth,
            x
        )
    );


    y =
    Math.max(
        0,
        Math.min(
            window.innerHeight,
            y
        )
    );


    return {

        x:x,

        y:y

    };

}


/* =====================================================
   KALİBRASİYA BİTDİ
===================================================== */

function finishCalibration(){

    calibrationCollecting =
    false;


    /*
       Modeli burada öyrədirik.
    */

    const success =
    trainModel();


    calibration.style.display =
    "none";


    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    gazeX = null;
    gazeY = null;

    currentButton = null;

    possibleButton = null;


    if(success){

        statusBox.innerText =
        "Hazırdır — düyməyə bax";

    }else{

        statusBox.innerText =
        "Kalibrasiya alınmadı";

    }

}


/* =====================================================
   GÖZ HƏRƏKƏTİNİ YUMŞALT
===================================================== */

function updateGaze(x,y){

    if(
        gazeX === null ||
        gazeY === null
    ){

        gazeX = x;
        gazeY = y;

    }else{

        gazeX +=
        (x-gazeX) *
        SMOOTHING;


        gazeY +=
        (y-gazeY) *
        SMOOTHING;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =====================================================
   DÜYMƏNİ TAP
===================================================== */

function checkButton(x,y){

    if(locked){
        return;
    }


    let target = null;

    let bestDistance =
    Infinity;


    for(
        const button
        of buttons
    ){

        const rect =
        button.getBoundingClientRect();


        /*
           Böyük qəbul zonası.

           Düymənin özündən
           55 px kənara qədər.
        */

        const tolerance =
        55;


        const left =
        rect.left -
        tolerance;


        const right =
        rect.right +
        tolerance;


        const top =
        rect.top -
        tolerance;


        const bottom =
        rect.bottom +
        tolerance;


        const inside =
        x >= left &&
        x <= right &&
        y >= top &&
        y <= bottom;


        if(!inside){
            continue;
        }


        const cx =
        rect.left +
        rect.width / 2;


        const cy =
        rect.top +
        rect.height / 2;


        const dx =
        x-cx;


        const dy =
        y-cy;


        const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


        if(
            distance <
            bestDistance
        ){

            bestDistance =
            distance;

            target =
            button;

        }

    }


    /*
       Heç bir düymə yoxdursa.
    */

    if(!target){

        possibleButton =
        null;


        possibleButtonTime =
        0;


        currentButton =
        null;


        lookStart =
        0;


        buttons.forEach(
            function(button){

                button.classList.remove(
                    "active"
                );

            }
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       Yeni düymə ehtimalı.
    */

    if(
        target !==
        currentButton
    ){

        if(
            possibleButton !==
            target
        ){

            possibleButton =
            target;

            possibleButtonTime =
            Date.now();

            return;

        }


        /*
           250 ms eyni düymədə qalmalıdır.
        */

        if(
            Date.now() -
            possibleButtonTime <
            SWITCH_DELAY
        ){

            return;

        }


        currentButton =
        target;


        lookStart =
        Date.now();


        possibleButton =
        null;


        buttons.forEach(
            function(button){

                button.classList.remove(
                    "active"
                );

            }
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       Eyni düyməyə baxır.
    */

    const elapsed =
    Date.now() -
    lookStart;


    const percent =
    Math.min(

        100,

        (
            elapsed /
            DWELL_TIME
        ) * 100

    );


    bar.style.width =
    percent + "%";


    /*
       1.8 saniyə tamamlandı.
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =====================================================
   SEÇİM
===================================================== */

function selectButton(button){

    if(locked){
        return;
    }


    locked = true;


    const action =
    button.dataset.action;


    if(
        action === "YES"
    ){

        statusBox.innerText =
        "✅ HƏ";

    }


    if(
        action === "CALL"
    ){

        statusBox.innerText =
        "🚨 PALATA 402 — OTAĞA GƏL";

    }


    if(
        action === "NO"
    ){

        statusBox.innerText =
        "❌ YOX";

    }


    console.log(
        "PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked = false;


        currentButton =
        null;


        possibleButton =
        null;


        possibleButtonTime =
        0;


        lookStart =
        0;


        gazeX =
        null;


        gazeY =
        null;


        button.classList.remove(
            "active"
        );


        bar.style.width =
        "0%";


        statusBox.innerText =
        "Hazırdır — düyməyə bax";


    },1200);

}


/* =====================================================
   BAŞLAT
===================================================== */

startButton.addEventListener(
    "click",
    startSystem
);

</script>
