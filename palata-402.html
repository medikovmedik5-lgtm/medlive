<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172b3a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:68px;
    background:#102a43;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;
}

.logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:.8px;
}

.room{
    font-size:15px;
    font-weight:600;
    color:#c8d5e2;
}

/* STATUS */

#status{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:18px;
    font-weight:600;

    color:#526579;
}

/* START */

#startPanel{
    width:min(680px,90vw);

    margin:35px auto;

    background:white;

    border:1px solid #e3e9ef;

    border-radius:28px;

    padding:42px 30px;

    text-align:center;

    box-shadow:
        0 18px 50px
        rgba(16,42,67,.08);
}

.startTitle{
    font-size:30px;
    font-weight:800;

    color:#102a43;

    margin-bottom:14px;
}

.startText{
    color:#718096;

    font-size:16px;

    line-height:1.6;

    margin-bottom:28px;
}

#start{
    border:0;

    background:#102a43;

    color:white;

    padding:20px 35px;

    border-radius:16px;

    font-size:18px;

    font-weight:700;
}

/* CAMERA */

#video{
    display:none;
}

/* CALIBRATION */

#calibration{
    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:#f5f7fa;
}

.calTitle{
    position:absolute;

    top:28px;

    left:20px;

    right:20px;

    text-align:center;

    font-size:23px;

    font-weight:800;

    color:#102a43;
}

.calText{
    position:absolute;

    top:68px;

    left:20px;

    right:20px;

    text-align:center;

    font-size:15px;

    color:#718096;
}

/* yalnız AKTİV nöqtə görünəcək */

.point{
    display:none;

    position:absolute;

    width:28px;

    height:28px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#c62828;

    border:5px solid white;

    box-shadow:
        0 0 0 7px
        rgba(198,40,40,.14);
}

.point.active{
    display:block;
}

/* CHOICES */

#choices{
    display:none;

    width:100%;

    height:calc(100vh - 138px);

    padding:
        30px 9vw
        70px;

    align-items:center;

    justify-content:space-between;

    gap:13vw;
}

.choice{
    width:35vw;

    max-width:500px;

    height:280px;

    border:0;

    border-radius:32px;

    color:white;

    font-size:58px;

    font-weight:800;

    box-shadow:
        0 18px 45px
        rgba(16,42,67,.12);

    transition:
        transform .18s,
        box-shadow .18s;
}

.yes{
    background:#147d64;
}

.no{
    background:#344054;
}

.choice.active{
    transform:scale(1.045);

    box-shadow:
        0 0 0 8px
        rgba(16,42,67,.12),
        0 22px 50px
        rgba(16,42,67,.17);
}

/* PROGRESS */

#progress{
    display:none;

    position:fixed;

    left:20%;

    right:20%;

    bottom:27px;

    height:8px;

    background:#dce3ea;

    border-radius:20px;

    overflow:hidden;
}

#bar{
    width:0%;

    height:100%;

    background:#102a43;
}

/* RESET */

#reset{
    display:none;

    position:fixed;

    right:15px;

    top:78px;

    z-index:200;

    border:0;

    background:transparent;

    color:#718096;

    font-size:12px;
}


/* MOBILE */

@media(max-width:650px){

    header{
        height:60px;

        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{
        font-size:13px;
    }

    #status{
        height:60px;

        font-size:15px;
    }

    #startPanel{
        margin-top:25px;

        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    .startText{
        font-size:15px;
    }

    #choices{
        height:calc(100vh - 120px);

        padding:
            25px 15px
            60px;

        gap:25px;
    }

    .choice{
        width:42vw;

        height:210px;

        font-size:40px;

        border-radius:25px;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        MEDELIN
    </div>

    <div class="room">
        PALATA 402
    </div>

</header>


<div id="status">
    Sistem hazır deyil
</div>


<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>


<video
id="video"
autoplay
playsinline>
</video>


<!-- CALIBRATION -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə baxın
    </div>


    <div
    class="point"
    style="left:50%;top:50%;">
    </div>


    <div
    class="point"
    style="left:15%;top:50%;">
    </div>


    <div
    class="point"
    style="left:85%;top:50%;">
    </div>


    <div
    class="point"
    style="left:50%;top:25%;">
    </div>


    <div
    class="point"
    style="left:50%;top:75%;">
    </div>

</div>


<!-- HƏ / YOX -->

<div id="choices">

    <button
    class="choice yes"
    data-action="YES">

        HƏ

    </button>


    <button
    class="choice no"
    data-action="NO">

        YOX

    </button>

</div>


<div id="progress">

    <div id="bar"></div>

</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const video =
document.getElementById("video");

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    ...document.querySelectorAll(".point")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =================================================
   PARAMETRLƏR
================================================= */

const STORAGE_KEY =
"MEDELIN_402_CALIBRATION_V2";

const POINT_TIME =
1500;

const DWELL_TIME =
1800;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let running = false;

let faceReady = false;

let camera = null;

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStarted = 0;

let locked = false;

let calibrationData = null;


/* =================================================
   FACE MESH
================================================= */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

});


/* =================================================
   AVERAGE
================================================= */

function average(landmarks,indexes){

    let x = 0;

    let y = 0;

    let count = 0;


    for(
        const index of indexes
    ){

        if(!landmarks[index]){
            continue;
        }


        x +=
        landmarks[index].x;


        y +=
        landmarks[index].y;


        count++;

    }


    if(!count){
        return null;
    }


    return {

        x:x/count,

        y:y/count

    };

}


/* =================================================
   GÖZ FEATURE
================================================= */

function getEye(landmarks){

    const leftIris =
    average(
        landmarks,
        [
            468,
            469,
            470,
            471,
            472
        ]
    );


    const rightIris =
    average(
        landmarks,
        [
            473,
            474,
            475,
            476,
            477
        ]
    );


    if(
        !leftIris ||
        !rightIris
    ){

        return null;

    }


    const lo =
    landmarks[33];

    const li =
    landmarks[133];

    const lt =
    landmarks[159];

    const lb =
    landmarks[145];


    const ri =
    landmarks[362];

    const ro =
    landmarks[263];

    const rt =
    landmarks[386];

    const rb =
    landmarks[374];


    if(
        !lo || !li ||
        !lt || !lb ||
        !ri || !ro ||
        !rt || !rb
    ){

        return null;

    }


    const lw =
    Math.max(
        Math.abs(
            li.x-lo.x
        ),
        .0001
    );


    const rw =
    Math.max(
        Math.abs(
            ro.x-ri.x
        ),
        .0001
    );


    const lh =
    Math.max(
        Math.abs(
            lb.y-lt.y
        ),
        .0001
    );


    const rh =
    Math.max(
        Math.abs(
            rb.y-rt.y
        ),
        .0001
    );


    const lx =
    (leftIris.x-lo.x) /
    lw;


    const rx =
    (rightIris.x-ri.x) /
    rw;


    const ly =
    (leftIris.y-lt.y) /
    lh;


    const ry =
    (rightIris.y-rt.y) /
    rh;


    return {

        x:(lx+rx)/2,

        y:(ly+ry)/2

    };

}


/* =================================================
   FACE RESULTS
================================================= */

faceMesh.onResults(
function(results){

    if(
        !running
    ){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    const eye =
    getEye(
        results.multiFaceLandmarks[0]
    );


    if(!eye){
        return;
    }


    faceReady = true;


    /*
       Kalibrasiya zamanı
       son görülən göz mövqeyini
       yadda saxla.
    */

    if(
        calibrationData &&
        calibrationData.collecting
    ){

        calibrationData.lastX =
        eye.x;

        calibrationData.lastY =
        eye.y;

    }


    /*
       Normal rejim
    */

    if(
        calibrationData &&
        !calibrationData.collecting
    ){

        const position =
        predictGaze(
            eye.x,
            eye.y
        );


        updateGaze(
            position.x,
            position.y
        );

    }

});


/* =================================================
   SİSTEMİ BAŞLAT
================================================= */

async function startSystem(){

    start.disabled =
    true;


    statusBox.innerText =
    "Kamera hazırlanır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                }
            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running =
        true;


        startPanel.style.display =
        "none";


        statusBox.innerText =
        "Göz sistemi hazırlanır...";


        camera =
        new Camera(
            video,
            {

                onFrame:
                async function(){

                    try{

                        await faceMesh.send({
                            image:video
                        });

                    }
                    catch(error){

                        console.log(
                            "FaceMesh:",
                            error
                        );

                    }

                },

                width:640,

                height:480

            }
        );


        camera.start();


        /*
           FaceMesh üçün
           qısa vaxt
        */

        setTimeout(
            startCalibrationOrUseSaved,
            1800
        );

    }
    catch(error){

        console.error(error);


        statusBox.innerText =
        "Kamera açıla bilmədi";


        start.disabled =
        false;

    }

}


/* =================================================
   SAVED / CALIBRATION
================================================= */

function startCalibrationOrUseSaved(){

    const saved =
    localStorage.getItem(
        STORAGE_KEY
    );


    if(saved){

        try{

            const data =
            JSON.parse(saved);


            if(
                data &&
                data.center &&
                data.left &&
                data.right &&
                data.up &&
                data.down
            ){

                calibrationData =
                data;

                calibrationData.collecting =
                false;

                showChoices();

                return;

            }

        }
        catch(error){

            localStorage.removeItem(
                STORAGE_KEY
            );

        }

    }


    startCalibration();

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrationData = {

        center:null,

        left:null,

        right:null,

        up:null,

        down:null,

        collecting:false,

        lastX:.5,

        lastY:.5

    };


    calibration.style.display =
    "block";


    choices.style.display =
    "none";


    progress.style.display =
    "none";


    reset.style.display =
    "none";


    points.forEach(
        p =>
        p.classList.remove("active")
    );


    let index = 0;


    function nextPoint(){

        /*
           bütün nöqtələri gizlət
        */

        points.forEach(
            p =>
            p.classList.remove("active")
        );


        /*
           5 nöqtə bitdi
        */

        if(
            index >= points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        point.classList.add(
            "active"
        );


        const key =
        [
            "center",
            "left",
            "right",
            "up",
            "down"
        ][index];


        statusBox.innerText =
        "Nöqtəyə baxın   " +
        (index+1) +
        " / 5";


        calibrationData.collecting =
        true;


        /*
           1.5 saniyə gözləyirik.
           FaceMesh nümunə yığsa istifadə olunur.
        */

        setTimeout(
        function(){

            calibrationData.collecting =
            false;


            const rect =
            point.getBoundingClientRect();


            /*
               FaceMesh göz mövqeyi yoxdursa
               da sistem dayanmayacaq.
            */

            const eyeX =
            Number.isFinite(
                calibrationData.lastX
            )
            ?
                calibrationData.lastX
            :
                .5;


            const eyeY =
            Number.isFinite(
                calibrationData.lastY
            )
            ?
                calibrationData.lastY
            :
                .5;


            calibrationData[key] = {

                eyeX:eyeX,

                eyeY:eyeY,

                screenX:
                rect.left +
                rect.width/2,

                screenY:
                rect.top +
                rect.height/2

            };


            index++;


            setTimeout(
                nextPoint,
                250
            );

        },
        POINT_TIME
        );

    }


    nextPoint();

}


/* =================================================
   FINISH
================================================= */

function finishCalibration(){

    calibrationData.collecting =
    false;


    /*
       Əgər somehow məlumat
       əskikdirsə, yenə default
       koordinatlar yaradılır.
    */

    const defaults = {

        center:[
            .5,
            .5
        ],

        left:[
            .25,
            .5
        ],

        right:[
            .75,
            .5
        ],

        up:[
            .5,
            .35
        ],

        down:[
            .5,
            .65
        ]

    };


    const keys =
    [
        "center",
        "left",
        "right",
        "up",
        "down"
    ];


    for(
        const key of keys
    ){

        if(
            !calibrationData[key]
        ){

            calibrationData[key] = {

                eyeX:
                defaults[key][0],

                eyeY:
                defaults[key][1],

                screenX:
                window.innerWidth *
                defaults[key][0],

                screenY:
                window.innerHeight *
                defaults[key][1]

            };

        }

    }


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            calibrationData
        )
    );


    points.forEach(
        p =>
        p.classList.remove("active")
    );


    calibration.style.display =
    "none";


    showChoices();

}


/* =================================================
   CHOICES GÖSTƏR
================================================= */

function showChoices(){

    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    reset.style.display =
    "block";


    statusBox.innerText =
    "Hazırdır — HƏ və ya YOX-a bax";


    gazeX = null;

    gazeY = null;

    currentButton = null;

    lookStarted = 0;

}


/* =================================================
   GAZE PREDICTION
================================================= */

function predictGaze(x,y){

    const c =
    calibrationData.center;

    const l =
    calibrationData.left;

    const r =
    calibrationData.right;

    /*
       Əsasən X istiqamətinə
       baxırıq.
    */

    const minX =
    Math.min(
        l.eyeX,
        r.eyeX
    );


    const maxX =
    Math.max(
        l.eyeX,
        r.eyeX
    );


    let nx =
    (x-minX) /
    Math.max(
        maxX-minX,
        .0001
    );


    nx =
    Math.max(
        0,
        Math.min(
            1,
            nx
        )
    );


    /*
       Y artıq seçimə
       güclü təsir etmir.
    */

    const leftX =
    window.innerWidth *
    .22;


    const rightX =
    window.innerWidth *
    .78;


    const screenX =
    leftX +
    (
        rightX-leftX
    ) *
    nx;


    const screenY =
    window.innerHeight *
    .50;


    return {

        x:screenX,

        y:screenY

    };

}


/* =================================================
   SMOOTH
================================================= */

function updateGaze(x,y){

    if(
        gazeX === null
    ){

        gazeX =
        x;

        gazeY =
        y;

    }
    else{

        gazeX +=
        (x-gazeX) *
        .12;


        gazeY +=
        (y-gazeY) *
        .12;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =================================================
   BUTTON
================================================= */

function checkButton(x,y){

    if(
        locked
    ){
        return;
    }


    let target =
    null;


    for(
        const button of buttons
    ){

        const rect =
        button.getBoundingClientRect();


        /*
           Düymənin mərkəz
           hissəsini zona kimi
           istifadə et.
        */

        const cx =
        rect.left +
        rect.width/2;


        const cy =
        rect.top +
        rect.height/2;


        const radius =
        Math.min(
            rect.width*.58,
            rect.height*.58
        );


        const distance =
        Math.sqrt(
            Math.pow(
                x-cx,
                2
            ) +
            Math.pow(
                y-cy,
                2
            )
        );


        if(
            distance <=
            radius
        ){

            target =
            button;

            break;

        }

    }


    /*
       heç bir düyməyə
       baxmır
    */

    if(!target){

        return;

    }


    /*
       başqa düymə
    */

    if(
        target !==
        currentButton
    ){

        currentButton =
        target;


        lookStarted =
        Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       eyni düyməyə baxır
    */

    const elapsed =
    Date.now() -
    lookStarted;


    const percent =
    Math.min(
        100,
        elapsed /
        DWELL_TIME *
        100
    );


    bar.style.width =
    percent+"%";


    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =================================================
   SELECT
================================================= */

function selectButton(button){

    if(
        locked
    ){
        return;
    }


    locked =
    true;


    const action =
    button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
        "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
        "YOX";

    }


    console.log(
        "MEDELIN PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked =
        false;


        currentButton =
        null;


        lookStarted =
        0;


        gazeX =
        null;


        gazeY =
        null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
        "0%";


        statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

    },
    1200
    );

}


/* =================================================
   RESET
================================================= */

reset.addEventListener(
"click",
function(){

    localStorage.removeItem(
        STORAGE_KEY
    );


    gazeX =
    null;

    gazeY =
    null;

    currentButton =
    null;


    startCalibration();

});


/* =================================================
   START
================================================= */

start.addEventListener(
"click",
startSystem
);

</script>

</body>
</html>
