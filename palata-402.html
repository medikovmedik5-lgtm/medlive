<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172033;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:68px;
    background:#102a43;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
}

/* STATUS */

#status{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:18px;
    font-weight:600;
    color:#52606d;
}

/* START */

#start{
    display:block;

    margin:35px auto;

    padding:21px 32px;

    border:0;
    border-radius:16px;

    background:#102a43;
    color:white;

    font-size:20px;
    font-weight:700;

    box-shadow:0 8px 25px rgba(16,42,67,.18);
}

/* CAMERA */

#video{
    display:none;
}

/* CALIBRATION */

#calibration{
    display:none;

    position:fixed;
    inset:0;

    z-index:50;

    background:#f5f7fa;
}

#calibrationTitle{
    position:absolute;
    top:30px;
    left:20px;
    right:20px;

    text-align:center;

    font-size:20px;
    font-weight:700;

    color:#102a43;
}

#calibrationText{
    position:absolute;
    top:65px;
    left:20px;
    right:20px;

    text-align:center;

    font-size:15px;
    color:#627d98;
}

.point{
    position:absolute;

    width:24px;
    height:24px;

    background:#d92d20;

    border:4px solid white;

    border-radius:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 0 5px rgba(217,45,32,.14);

    opacity:.35;

    transition:
        transform .2s,
        opacity .2s;
}

.point.active{
    opacity:1;
    transform:
        translate(-50%,-50%)
        scale(1.25);

    box-shadow:
        0 0 0 8px rgba(217,45,32,.15);
}

/* CHOICES */

#choices{
    display:none;

    height:calc(100vh - 138px);

    padding:35px 8vw;

    gap:70px;

    align-items:center;
    justify-content:center;

    flex-direction:row;
}

.choice{
    flex:1;

    max-width:430px;

    height:260px;

    border:0;

    border-radius:28px;

    color:white;

    font-size:52px;

    font-weight:800;

    transition:
        transform .2s,
        box-shadow .2s;

    box-shadow:
        0 12px 35px rgba(16,42,67,.12);
}

.choice.active{
    transform:scale(1.045);

    box-shadow:
        0 0 0 8px rgba(16,42,67,.14),
        0 18px 40px rgba(16,42,67,.18);
}

.yes{
    background:#087f5b;
}

.no{
    background:#364152;
}

/* PROGRESS */

#progress{
    display:none;

    position:fixed;

    left:15%;
    bottom:18px;

    width:70%;

    height:10px;

    background:#d9e2ec;

    border-radius:20px;

    overflow:hidden;

    z-index:100;
}

#bar{
    width:0%;
    height:100%;

    background:#102a43;

    transition:width .05s linear;
}

/* MOBILE */

@media(max-width:700px){

    header{
        height:60px;
        font-size:17px;
    }

    #status{
        height:60px;
        font-size:16px;
    }

    #choices{
        height:calc(100vh - 120px);

        padding:25px 22px;

        gap:35px;
    }

    .choice{
        height:210px;
        font-size:42px;
        border-radius:24px;
    }
}

@media(max-width:500px){

    #choices{
        flex-direction:row;
        padding:25px 15px;
        gap:25px;
    }

    .choice{
        width:42vw;
        height:190px;
        font-size:34px;
    }
}
</style>
</head>

<body>

<header>
    MEDELIN — PALATA 402
</header>

<div id="status">
    Sistem hazır deyil
</div>

<button id="start">
    GÖZ İZLƏMƏNİ BAŞLAT
</button>

<video id="video" autoplay playsinline></video>

<!-- KALİBRASİYA -->

<div id="calibration">

    <div id="calibrationTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div id="calibrationText">
        Qırmızı nöqtəyə sakit şəkildə bax
    </div>

    <!-- 5 NÖQTƏ -->

    <div class="point"
         data-name="center"
         style="left:50%;top:50%;">
    </div>

    <div class="point"
         data-name="left"
         style="left:15%;top:50%;">
    </div>

    <div class="point"
         data-name="right"
         style="left:85%;top:50%;">
    </div>

    <div class="point"
         data-name="up"
         style="left:50%;top:25%;">
    </div>

    <div class="point"
         data-name="down"
         style="left:50%;top:75%;">
    </div>

</div>

<!-- SEÇİMLƏR -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">
        HƏ
    </button>

    <button
        class="choice no"
        data-action="NO">
        YOX
    </button>

</div>

<div id="progress">
    <div id="bar"></div>
</div>

<script>

/* =========================
   ELEMENTLƏR
========================= */

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("start");

const statusBox =
    document.getElementById("status");

const calibration =
    document.getElementById("calibration");

const choices =
    document.getElementById("choices");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const buttons =
    [...document.querySelectorAll(".choice")];

const points =
    [...document.querySelectorAll(".point")];


/* =========================
   FACE MESH
========================= */

const faceMesh =
    new FaceMesh({

        locateFile:function(file){

            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

        }

    });

faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.6,

    minTrackingConfidence:0.6

});


/* =========================
   DƏYİŞƏNLƏR
========================= */

let camera = null;

let running = false;

let collecting = false;

let currentSamples = [];

let calibrationData = [];

let gazeX = null;

let gazeY = null;

let candidateButton = null;

let candidateStart = 0;

let locked = false;

let lastFaceTime = 0;


/*
    Seçim üçün 1.8 saniyə
*/

const DWELL_TIME = 1800;


/*
    Kiçik göz hərəkətlərində
    seçim dəyişməsin
*/

const ACQUIRE_MARGIN = 28;

const RELEASE_MARGIN = 65;


/* =========================
   GÖZ FEATURE-LƏRİ
========================= */

function getEyeFeatures(landmarks){

    /*
       Sol göz:
       33  = xarici künc
       133 = daxili künc
       159/145 = yuxarı/aşağı

       Sağ göz:
       362 = daxili künc
       263 = xarici künc
       386/374 = yuxarı/aşağı
    */

    const irisLeft = averagePoints(
        landmarks,
        [468,469,470,471,472]
    );

    const irisRight = averagePoints(
        landmarks,
        [473,474,475,476,477]
    );

    if(!irisLeft || !irisRight){
        return null;
    }


    const leftOuter =
        landmarks[33];

    const leftInner =
        landmarks[133];

    const leftTop =
        landmarks[159];

    const leftBottom =
        landmarks[145];


    const rightInner =
        landmarks[362];

    const rightOuter =
        landmarks[263];

    const rightTop =
        landmarks[386];

    const rightBottom =
        landmarks[374];


    if(
        !leftOuter ||
        !leftInner ||
        !leftTop ||
        !leftBottom ||
        !rightInner ||
        !rightOuter ||
        !rightTop ||
        !rightBottom
    ){
        return null;
    }


    const leftWidth =
        Math.max(
            Math.abs(leftInner.x-leftOuter.x),
            0.0001
        );

    const rightWidth =
        Math.max(
            Math.abs(rightOuter.x-rightInner.x),
            0.0001
        );


    const leftHeight =
        Math.max(
            Math.abs(leftBottom.y-leftTop.y),
            0.0001
        );

    const rightHeight =
        Math.max(
            Math.abs(rightBottom.y-rightTop.y),
            0.0001
        );


    /*
       Göz içində iris mövqeyi
    */

    const leftX =
        (irisLeft.x-leftOuter.x) /
        leftWidth;

    const rightX =
        (irisRight.x-rightInner.x) /
        rightWidth;


    const leftY =
        (irisLeft.y-leftTop.y) /
        leftHeight;

    const rightY =
        (irisRight.y-rightTop.y) /
        rightHeight;


    return {

        x:(leftX+rightX)/2,

        y:(leftY+rightY)/2

    };
}


function averagePoints(landmarks, indexes){

    let x = 0;
    let y = 0;
    let count = 0;

    for(
        const index of indexes
    ){

        if(!landmarks[index]){
            continue;
        }

        x += landmarks[index].x;
        y += landmarks[index].y;

        count++;
    }

    if(count === 0){
        return null;
    }

    return {
        x:x/count,
        y:y/count
    };
}


/* =========================
   FACE NƏTİCƏLƏRİ
========================= */

faceMesh.onResults(
    function(results){

        if(!running){
            return;
        }


        if(
            !results.multiFaceLandmarks ||
            results.multiFaceLandmarks.length === 0
        ){

            return;

        }


        const landmarks =
            results.multiFaceLandmarks[0];


        const eye =
            getEyeFeatures(landmarks);


        if(!eye){
            return;
        }


        lastFaceTime =
            Date.now();


        /*
           KALİBRASİYA
        */

        if(collecting){

            currentSamples.push({

                x:eye.x,

                y:eye.y

            });

            return;
        }


        /*
           NORMAL İZLƏMƏ
        */

        if(
            calibrationData.length >= 5
        ){

            const position =
                predictGaze(
                    eye.x,
                    eye.y
                );


            updateGaze(
                position.x,
                position.y
            );

        }

    }
);


/* =========================
   KAMERA
========================= */

async function startSystem(){

    startButton.style.display =
        "none";


    statusBox.innerText =
        "Kamera hazırlanır...";


    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        running = true;


        statusBox.innerText =
            "Göz sistemi hazırlanır...";


        camera =
            new Camera(
                video,
                {

                    onFrame:
                    async function(){

                        await faceMesh.send({
                            image:video
                        });

                    },

                    width:640,

                    height:480

                }
            );


        camera.start();


        /*
           Kamera və FaceMesh üçün
           qısa gözləmə
        */

        setTimeout(
            beginCalibration,
            1500
        );


    }catch(error){

        console.error(error);

        statusBox.innerText =
            "Kamera açıla bilmədi";

        startButton.style.display =
            "block";

    }

}


/* =========================
   KALİBRASİYA BAŞLANIR
========================= */

function beginCalibration(){

    /*
       Əvvəl yadda saxlanmış
       kalibrasiya varsa istifadə et
    */

    const saved =
        localStorage.getItem(
            "medelin402Calibration"
        );


    if(saved){

        try{

            const data =
                JSON.parse(saved);


            if(
                Array.isArray(data) &&
                data.length >= 5
            ){

                calibrationData =
                    data;


                calibration.style.display =
                    "none";

                choices.style.display =
                    "flex";

                progress.style.display =
                    "block";

                statusBox.innerText =
                    "Hazırdır — HƏ və ya YOX-a bax";

                return;

            }

        }catch(error){

            console.log(
                "Yaddaş oxunmadı"
            );

        }

    }


    startCalibration();

}


/* =========================
   KALİBRASİYA
========================= */

function startCalibration(){

    calibrationData = [];

    calibration.style.display =
        "block";


    let index = 0;


    function nextPoint(){

        points.forEach(
            p =>
            p.classList.remove("active")
        );


        if(index >= points.length){

            finishCalibration();

            return;

        }


        const point =
            points[index];


        point.classList.add("active");


        const rect =
            point.getBoundingClientRect();


        const targetX =
            rect.left +
            rect.width/2;


        const targetY =
            rect.top +
            rect.height/2;


        currentSamples = [];


        collecting = true;


        statusBox.innerText =
            "Nöqtəyə bax  " +
            (index+1) +
            " / " +
            points.length;


        /*
           Xəstəyə baxmaq üçün
           2 saniyə
        */

        setTimeout(
            function(){

                collecting = false;


                if(
                    currentSamples.length >= 8
                ){

                    /*
                       Sonrakı hesablamalarda
                       kənar səhvləri azaltmaq
                    */

                    const cleanSamples =
                        removeOutliers(
                            currentSamples
                        );


                    let sx = 0;
                    let sy = 0;


                    for(
                        const sample
                        of cleanSamples
                    ){

                        sx += sample.x;
                        sy += sample.y;

                    }


                    sx /=
                        cleanSamples.length;

                    sy /=
                        cleanSamples.length;


                    calibrationData.push({

                        eyeX:sx,

                        eyeY:sy,

                        screenX:targetX,

                        screenY:targetY

                    });

                }


                index++;


                setTimeout(
                    nextPoint,
                    400
                );

            },
            2000
        );

    }


    nextPoint();

}


/* =========================
   OUTLIER TƏMİZLƏMƏ
========================= */

function removeOutliers(samples){

    if(samples.length < 10){
        return samples;
    }


    let avgX = 0;
    let avgY = 0;


    for(
        const sample of samples
    ){

        avgX += sample.x;
        avgY += sample.y;

    }


    avgX /=
        samples.length;

    avgY /=
        samples.length;


    const distances =
        samples.map(
            s =>
            Math.sqrt(
                Math.pow(
                    s.x-avgX,
                    2
                ) +
                Math.pow(
                    s.y-avgY,
                    2
                )
            )
        );


    const sorted =
        [...distances].sort(
            (a,b)=>a-b
        );


    const limit =
        sorted[
            Math.floor(
                sorted.length*.75
            )
        ];


    return samples.filter(
        (s,i)=>
        distances[i] <=
        limit*1.5
    );

}


/* =========================
   GÖZÜ EKRANA XƏRİTƏLƏ
========================= */

function predictGaze(x,y){

    /*
       Ən yaxın 3 kalibrasiya
       nöqtəsindən hesablayırıq.
    */

    const distances =
        calibrationData.map(
            p => {

                const dx =
                    x-p.eyeX;

                const dy =
                    y-p.eyeY;


                return {

                    p:p,

                    d:Math.sqrt(
                        dx*dx+
                        dy*dy
                    )

                };

            }
        );


    distances.sort(
        (a,b)=>a.d-b.d
    );


    /*
       Tam üstündədirsə
       birbaşa həmin nöqtə
    */

    if(
        distances[0] &&
        distances[0].d <
        0.0008
    ){

        return {

            x:distances[0].p.screenX,

            y:distances[0].p.screenY

        };

    }


    const nearest =
        distances.slice(0,3);


    let weightTotal = 0;

    let sx = 0;

    let sy = 0;


    for(
        const item of nearest
    ){

        const weight =
            1 /
            Math.max(
                item.d,
                0.0001
            );


        sx +=
            item.p.screenX *
            weight;


        sy +=
            item.p.screenY *
            weight;


        weightTotal +=
            weight;

    }


    return {

        x:sx/weightTotal,

        y:sy/weightTotal

    };

}


/* =========================
   GÖZÜ YUMŞALT
========================= */

function updateGaze(x,y){

    if(gazeX === null){

        gazeX = x;
        gazeY = y;

    }else{

        /*
           Daha yumşaq hərəkət
        */

        gazeX +=
            (x-gazeX)*0.08;


        gazeY +=
            (y-gazeY)*0.08;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =========================
   DÜYMƏNİ TAP
========================= */

function checkButton(x,y){

    if(locked){
        return;
    }


    /*
       Üz görünmürsə seçim
       sıfırlanmır.
    */

    if(
        Date.now()-lastFaceTime >
        1200
    ){

        return;

    }


    let target = null;


    /*
       Əvvəl hazırkı düyməyə
       bir az daha geniş zona veririk.
       Bu, HƏ/YOX arasında
       əsassız dəyişmənin qarşısını alır.
    */

    if(candidateButton){

        const rect =
            candidateButton
            .getBoundingClientRect();


        if(
            x >= rect.left-RELEASE_MARGIN &&
            x <= rect.right+RELEASE_MARGIN &&
            y >= rect.top-RELEASE_MARGIN &&
            y <= rect.bottom+RELEASE_MARGIN
        ){

            target =
                candidateButton;

        }

    }


    /*
       Hazırkı düymə deyilsə,
       normal seçim zonası
    */

    if(!target){

        for(
            const button of buttons
        ){

            const rect =
                button.getBoundingClientRect();


            const inside =
                x >= rect.left-ACQUIRE_MARGIN &&
                x <= rect.right+ACQUIRE_MARGIN &&
                y >= rect.top-ACQUIRE_MARGIN &&
                y <= rect.bottom+ACQUIRE_MARGIN;


            if(inside){

                target =
                    button;

                break;

            }

        }

    }


    /*
       Heç bir düyməyə baxmır
    */

    if(!target){

        candidateButton =
            null;

        candidateStart =
            0;


        buttons.forEach(
            b =>
            b.classList.remove("active")
        );


        bar.style.width =
            "0%";


        return;

    }


    /*
       Yeni düyməyə keçid
    */

    if(
        target !== candidateButton
    ){

        candidateButton =
            target;

        candidateStart =
            Date.now();


        buttons.forEach(
            b =>
            b.classList.remove("active")
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
            "0%";


        return;

    }


    /*
       Sabit baxış müddəti
    */

    const elapsed =
        Date.now() -
        candidateStart;


    const percent =
        Math.min(
            100,
            elapsed /
            DWELL_TIME *
            100
        );


    bar.style.width =
        percent+"%";


    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =========================
   SEÇİM
========================= */

function selectButton(button){

    if(locked){
        return;
    }


    locked = true;


    const action =
        button.dataset.action;


    if(action === "YES"){

        statusBox.innerText =
            "HƏ";

    }


    if(action === "NO"){

        statusBox.innerText =
            "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
        "100%";


    /*
       Seçimdən sonra
       sistem yenidən gözləmə
       vəziyyətinə qayıdır.
    */

    setTimeout(
        function(){

            locked = false;

            candidateButton =
                null;

            candidateStart =
                0;

            gazeX =
                null;

            gazeY =
                null;


            buttons.forEach(
                b =>
                b.classList.remove(
                    "active"
                )
            );


            bar.style.width =
                "0%";


            statusBox.innerText =
                "Hazırdır — HƏ və ya YOX-a bax";

        },
        1200
    );

}


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
