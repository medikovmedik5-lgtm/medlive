<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172b3a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:64px;
    background:#102a43;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;
}

.logo{
    font-size:19px;
    font-weight:800;
    letter-spacing:.8px;
}

.room{
    font-size:14px;
    font-weight:600;
    color:#c8d5e2;
}

#status{
    height:64px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#526579;

    font-size:17px;
    font-weight:600;
}

#startPanel{
    width:min(680px,90vw);

    margin:35px auto;

    background:#fff;

    border:1px solid #e3e9ef;

    border-radius:26px;

    padding:40px 28px;

    text-align:center;

    box-shadow:0 18px 50px rgba(16,42,67,.08);
}

.startTitle{
    font-size:29px;
    font-weight:800;
    color:#102a43;
    margin-bottom:14px;
}

.startText{
    color:#718096;
    font-size:16px;
    line-height:1.6;
    margin-bottom:28px;
}

#start{
    border:0;
    background:#102a43;
    color:white;
    padding:19px 34px;
    border-radius:15px;
    font-size:18px;
    font-weight:700;
}

/* =========================
   CALIBRASIYA
========================= */

#calibration{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#f5f7fa;
}

.calTitle{
    position:absolute;
    top:28px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:23px;
    font-weight:800;
    color:#102a43;
}

.calText{
    position:absolute;
    top:68px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:15px;
    color:#718096;
}

.point{
    display:none;

    position:absolute;

    width:28px;
    height:28px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#c62828;

    border:5px solid white;

    box-shadow:0 0 0 7px rgba(198,40,40,.14);
}

.point.active{
    display:block;
}

/* =========================
   HƏ / YOX
========================= */

#choices{
    display:none;

    position:fixed;

    top:64px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(100vh - 64px);

    padding:25px 18px 70px;

    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;

    gap:90px !important;
}

.choice{
    width:min(680px,82vw);
    height:225px;

    flex:none !important;

    border:0;
    border-radius:30px;

    color:#fff;

    font-size:58px;
    font-weight:800;

    box-shadow:0 18px 45px rgba(16,42,67,.12);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.yes{
    background:#147d64;
}

.no{
    background:#344054;
}

.choice.active{
    transform:scale(1.035);

    box-shadow:
        0 0 0 8px rgba(16,42,67,.11),
        0 22px 50px rgba(16,42,67,.18);
}

/* =========================
   PROGRESS
========================= */

#progress{
    display:none;

    position:fixed;

    left:16%;
    right:16%;
    bottom:23px;

    height:8px;

    background:#dce3ea;

    border-radius:20px;

    overflow:hidden;

    z-index:150;
}

#bar{
    width:0%;
    height:100%;
    background:#102a43;
}

/* RESET */

#reset{
    display:none;

    position:fixed;

    top:73px;
    right:14px;

    z-index:200;

    border:0;

    background:transparent;

    color:#718096;

    font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

    header{
        height:60px;
        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{
        font-size:13px;
    }

    #status{
        height:60px;
        font-size:15px;
    }

    #startPanel{
        margin-top:25px;
        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    .startText{
        font-size:15px;
    }

    #choices{
        top:60px;
        height:calc(100vh - 60px);

        gap:82px !important;
        padding:20px 18px 65px;
    }

    .choice{
        width:82vw;
        height:205px;
        font-size:42px;
    }
}

@media(max-width:400px){

    #choices{
        gap:68px !important;
    }

    .choice{
        width:84vw;
        height:185px;
        font-size:38px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MEDELIN</div>
    <div class="room">PALATA 402</div>
</header>

<div id="status">
    Sistem hazır deyil
</div>

<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edin.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə kalibrasiyası
    </div>

    <div class="calText">
        Qırmızı nöqtəyə sakit şəkildə baxın
    </div>

    <div
        class="point"
        id="p1"
        style="left:50%;top:20%;">
    </div>

    <div
        class="point"
        id="p2"
        style="left:20%;top:50%;">
    </div>

    <div
        class="point"
        id="p3"
        style="left:80%;top:50%;">
    </div>

    <div
        class="point"
        id="p4"
        style="left:50%;top:50%;">
    </div>

    <div
        class="point"
        id="p5"
        style="left:50%;top:80%;">
    </div>

</div>


<!-- =========================
     HƏ / YOX
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">
        HƏ
    </button>

    <button
        class="choice no"
        data-action="NO">
        YOX
    </button>

</div>


<div id="progress">
    <div id="bar"></div>
</div>


<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const start =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const buttons =
[
    ...document.querySelectorAll(".choice")
];

const points =
[
    document.getElementById("p1"),
    document.getElementById("p2"),
    document.getElementById("p3"),
    document.getElementById("p4"),
    document.getElementById("p5")
];


/* =================================================
   PARAMETRLƏR
================================================= */

const CAL_TIME = 2200;

const DWELL_TIME = 1300;

const SWITCH_TIME = 300;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let webgazerStarted = false;

let calibrating = false;

let calibrationIndex = 0;

let calibrationTimer = null;

let currentGaze = null;

let smoothY = null;

let candidate = null;

let candidateSince = 0;

let activeButton = null;

let activeSince = 0;

let locked = false;


/*
   WebGazer-in xam ekran
   koordinatlarını öz
   kalibrasiyamız üçün
   saxlayırıq.
*/

let calSamples = [];


/* =================================================
   WEBGAZER
================================================= */

function setupWebGazer(){

    webgazer
        .setRegression("ridge")
        .setTracker("TFFacemesh")
        .setGazeListener(function(data){

            if(!data){
                return;
            }

            if(
                typeof data.x !== "number" ||
                typeof data.y !== "number"
            ){
                return;
            }


            currentGaze = {
                x:data.x,
                y:data.y
            };


            /*
               Kalibrasiya
            */

            if(calibrating){

                calSamples.push({
                    x:data.x,
                    y:data.y
                });

                return;
            }


            /*
               Normal rejim
            */

            if(webgazerStarted){

                processGaze(
                    data.x,
                    data.y
                );

            }

        })
        .showVideoPreview(false)
        .showPredictionPoints(false)
        .showFaceOverlay(false)
        .showFaceFeedbackBox(false);

}


/* =================================================
   START WEBGAZER
================================================= */

async function startSystem(){

    start.disabled = true;

    statusBox.innerText =
        "Göz sistemi hazırlanır...";


    try{

        setupWebGazer();


        await webgazer.begin();


        webgazerStarted = true;


        startPanel.style.display =
            "none";


        statusBox.innerText =
            "Kalibrasiya hazırlanır...";


        setTimeout(
            startCalibration,
            1800
        );


    }
    catch(error){

        console.error(error);

        statusBox.innerText =
            "Göz sistemi açıla bilmədi";

        start.disabled =
            false;

    }

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrating = false;

    calibrationIndex = 0;

    calSamples = [];


    calibration.style.display =
        "block";


    choices.style.display =
        "none";


    progress.style.display =
        "none";


    reset.style.display =
        "none";


    points.forEach(
        p =>
        p.classList.remove("active")
    );


    nextCalibrationPoint();

}


/* =================================================
   NÖVBƏTİ NÖQTƏ
================================================= */

function nextCalibrationPoint(){

    points.forEach(
        p =>
        p.classList.remove("active")
    );


    if(
        calibrationIndex >=
        points.length
    ){

        finishCalibration();

        return;

    }


    const point =
        points[calibrationIndex];


    point.classList.add("active");


    statusBox.innerText =
        "Nöqtəyə baxın  " +
        (
            calibrationIndex + 1
        ) +
        " / 5";


    /*
       Əvvəl 500ms göz
       nöqtəyə yerləşsin
    */

    calSamples = [];

    calibrating = false;


    setTimeout(
        function(){

            calSamples = [];

            calibrating = true;


            clearTimeout(
                calibrationTimer
            );


            calibrationTimer =
                setTimeout(
                    finishCurrentPoint,
                    CAL_TIME
                );

        },
        500
    );

}


/* =================================================
   NÖQTƏNİ BİTİR
================================================= */

function finishCurrentPoint(){

    calibrating = false;


    const point =
        points[calibrationIndex];


    const rect =
        point.getBoundingClientRect();


    /*
       WebGazer-dən gələn
       nümunələrin medianı
    */

    const xs =
        calSamples.map(
            s => s.x
        );

    const ys =
        calSamples.map(
            s => s.y
        );


    const gx =
        median(xs);


    const gy =
        median(ys);


    /*
       WebGazer özü heç nümunə
       verməsə belə nöqtə
       sistemdə ilişməyəcək.
    */

    calibrationIndex++;


    setTimeout(
        nextCalibrationPoint,
        250
    );

}


/* =================================================
   MEDIAN
================================================= */

function median(values){

    if(
        !values ||
        !values.length
    ){

        return null;

    }


    const sorted =
        [...values].sort(
            (a,b) =>
            a-b
        );


    const middle =
        Math.floor(
            sorted.length/2
        );


    if(
        sorted.length % 2
    ){

        return sorted[middle];

    }


    return (
        sorted[middle-1] +
        sorted[middle]
    ) / 2;

}


/* =================================================
   KALİBRASİYA BİTİR
================================================= */

function finishCalibration(){

    calibrating = false;


    points.forEach(
        p =>
        p.classList.remove("active")
    );


    calibration.style.display =
        "none";


    showChoices();

}


/* =================================================
   SEÇİMLƏR
================================================= */

function showChoices(){

    choices.style.display =
        "flex";


    progress.style.display =
        "block";


    reset.style.display =
        "block";


    candidate = null;

    activeButton = null;

    candidateSince = 0;

    activeSince = 0;

    smoothY = null;


    buttons.forEach(
        b =>
        b.classList.remove("active")
    );


    bar.style.width =
        "0%";


    statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GÖZÜ HAMARLA
================================================= */

function processGaze(
    x,
    y
){

    /*
       Telefonun ekran
       ölçüsündən kənar
       WebGazer koordinatlarını
       sərhədlə
    */

    x =
        Math.max(
            0,
            Math.min(
                window.innerWidth,
                x
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                window.innerHeight,
                y
            )
        );


    /*
       Y oxu üçün
       yumşaltma
    */

    if(
        smoothY === null
    ){

        smoothY =
            y;

    }
    else{

        smoothY +=
            (
                y -
                smoothY
            ) *
            0.18;

    }


    selectFromY(
        smoothY
    );

}


/* =================================================
   YOX / HƏ
================================================= */

function selectFromY(y){

    if(locked){
        return;
    }


    /*
       Düymələrin real
       mərkəzləri
    */

    const yesRect =
        buttons[0]
        .getBoundingClientRect();


    const noRect =
        buttons[1]
        .getBoundingClientRect();


    const yesCenter =
        yesRect.top +
        yesRect.height/2;


    const noCenter =
        noRect.top +
        noRect.height/2;


    /*
       Ortadakı böyük
       boş zona
    */

    const deadTop =
        yesCenter +
        yesRect.height * 0.42;


    const deadBottom =
        noCenter -
        noRect.height * 0.42;


    /*
       HƏ
    */

    if(
        y <
        deadTop
    ){

        startCandidate(
            buttons[0]
        );

        return;

    }


    /*
       YOX
    */

    if(
        y >
        deadBottom
    ){

        startCandidate(
            buttons[1]
        );

        return;

    }


    /*
       Ortada.
       Aktiv seçimi saxlayırıq,
       amma yeni seçim başlamır.
    */

}


/* =================================================
   NAMİZƏD
================================================= */

function startCandidate(button){

    if(
        candidate !== button
    ){

        candidate =
            button;

        candidateSince =
            Date.now();


        return;

    }


    /*
       300ms sabit qalsın
    */

    if(
        Date.now() -
        candidateSince <
        SWITCH_TIME
    ){

        return;

    }


    /*
       Active deyilsə başlat
    */

    if(
        activeButton !== button
    ){

        activeButton =
            button;

        activeSince =
            Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        button.classList.add(
            "active"
        );


        bar.style.width =
            "0%";

    }


    /*
       Sabit baxış
    */

    const elapsed =
        Date.now() -
        activeSince;


    const percentage =
        Math.min(
            100,
            (
                elapsed /
                DWELL_TIME
            ) * 100
        );


    bar.style.width =
        percentage +
        "%";


    /*
       SEÇ
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            button
        );

    }

}


/* =================================================
   SEÇİM
================================================= */

function selectButton(button){

    if(locked){
        return;
    }


    locked = true;


    const action =
        button.dataset.action;


    if(
        action === "YES"
    ){

        statusBox.innerText =
            "HƏ";

    }


    if(
        action === "NO"
    ){

        statusBox.innerText =
            "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
        "100%";


    setTimeout(
    function(){

        locked = false;

        candidate = null;

        activeButton = null;

        candidateSince = 0;

        activeSince = 0;

        smoothY = null;


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        bar.style.width =
            "0%";


        statusBox.innerText =
            "Hazırdır — HƏ və ya YOX-a bax";

    },
    1000
    );

}


/* =================================================
   RESET
================================================= */

reset.addEventListener(
    "click",
    function(){

        try{
            webgazer.clearData();
        }
        catch(e){
            console.log(e);
        }


        localStorage.removeItem(
            "MEDELIN_402_WEBGAZER"
        );


        smoothY = null;

        candidate = null;

        activeButton = null;


        startCalibration();

    }
);


/* =================================================
   START
================================================= */

start.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
