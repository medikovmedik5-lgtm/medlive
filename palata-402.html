<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const video =
document.getElementById("video");

const startButton =
document.getElementById("start");

const startPanel =
document.getElementById("startPanel");

const statusBox =
document.getElementById("status");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const reset =
document.getElementById("reset");

const points =
[
    ...document.querySelectorAll(".point")
];

const buttons =
[
    ...document.querySelectorAll(".choice")
];


/* =================================================
   PARAMETRLƏR
================================================= */

/*
   Yeni açar:
   köhnə kalibrasiya ilə qarışmayacaq.
*/

const STORAGE_KEY =
"MEDELIN_402_EYE_PRECISION_V12";


/*
   Kalibrasiya
*/

const SETTLE_TIME =
500;

const SAMPLE_TIME =
2000;


/*
   Seçim
*/

const DWELL_TIME =
1250;


/*
   Düymə dəyişmə sabitliyi
*/

const SWITCH_TIME =
220;


/*
   Göz yumşaltma
*/

const SMOOTH =
0.24;


/*
   Göz hərəkətini
   bir az gücləndiririk.
*/

const GAZE_GAIN =
1.75;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let running =
false;

let collecting =
false;

let camera =
null;

let calibrationData =
null;

let samples =
[];

let recentY =
[];

let filteredY =
null;

let currentButton =
null;

let candidateButton =
null;

let candidateSince =
0;

let lookStarted =
0;

let locked =
false;

let lastGoodFrame =
0;


/* =================================================
   MEDIAPIPE
================================================= */

const faceMesh =
new FaceMesh({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.62,

    minTrackingConfidence:0.62

});


/* =================================================
   ORTAQ NÖQTƏ
================================================= */

function average(
    landmarks,
    indexes
){

    let x = 0;
    let y = 0;
    let count = 0;


    for(
        const index of indexes
    ){

        if(
            !landmarks[index]
        ){

            continue;

        }


        x +=
        landmarks[index].x;


        y +=
        landmarks[index].y;


        count++;

    }


    if(
        count === 0
    ){

        return null;

    }


    return {

        x:x/count,

        y:y/count

    };

}


/* =================================================
   MEDIAN
================================================= */

function median(values){

    if(
        !values.length
    ){

        return 0;

    }


    const sorted =
    [...values].sort(
        (a,b)=>
        a-b
    );


    const middle =
    Math.floor(
        sorted.length/2
    );


    if(
        sorted.length % 2
    ){

        return sorted[middle];

    }


    return (
        sorted[middle-1] +
        sorted[middle]
    ) / 2;

}


/* =================================================
   GÖZ FEATURE
================================================= */

function getEyeFeature(
    landmarks
){

    const leftIris =
    average(
        landmarks,
        [
            468,
            469,
            470,
            471,
            472
        ]
    );


    const rightIris =
    average(
        landmarks,
        [
            473,
            474,
            475,
            476,
            477
        ]
    );


    if(
        !leftIris ||
        !rightIris
    ){

        return null;

    }


    /*
       Sol göz nöqtələri
    */

    const lOuter =
    landmarks[33];

    const lInner =
    landmarks[133];

    const lTop =
    landmarks[159];

    const lBottom =
    landmarks[145];


    /*
       Sağ göz nöqtələri
    */

    const rInner =
    landmarks[362];

    const rOuter =
    landmarks[263];

    const rTop =
    landmarks[386];

    const rBottom =
    landmarks[374];


    if(
        !lOuter ||
        !lInner ||
        !lTop ||
        !lBottom ||
        !rInner ||
        !rOuter ||
        !rTop ||
        !rBottom
    ){

        return null;

    }


    /*
       Göz eni
    */

    const leftWidth =
    Math.max(
        Math.abs(
            lInner.x -
            lOuter.x
        ),
        0.0001
    );


    const rightWidth =
    Math.max(
        Math.abs(
            rOuter.x -
            rInner.x
        ),
        0.0001
    );


    /*
       Göz hündürlüyü
    */

    const leftHeight =
    Math.max(
        Math.abs(
            lBottom.y -
            lTop.y
        ),
        0.0001
    );


    const rightHeight =
    Math.max(
        Math.abs(
            rBottom.y -
            rTop.y
        ),
        0.0001
    );


    /*
       Gözün açıq olub-olmadığını yoxlayırıq.

       Blink zamanı bu dəyər çox azalır.
    */

    const leftOpen =
    leftHeight /
    leftWidth;


    const rightOpen =
    rightHeight /
    rightWidth;


    const eyeOpen =
    (
        leftOpen +
        rightOpen
    ) / 2;


    /*
       Qapalı göz nümunəsini
       qəbul etmirik.
    */

    if(
        eyeOpen < 0.12
    ){

        return null;

    }


    /*
       Hər gözün şaquli mərkəzi
    */

    const leftMiddleY =
    (
        lTop.y +
        lBottom.y
    ) / 2;


    const rightMiddleY =
    (
        rTop.y +
        rBottom.y
    ) / 2;


    /*
       İrisi gözün mərkəzinə
       nisbətən hesablayırıq.
    */

    const leftVertical =
    (
        leftIris.y -
        leftMiddleY
    ) /
    leftHeight;


    const rightVertical =
    (
        rightIris.y -
        rightMiddleY
    ) /
    rightHeight;


    /*
       İki gözün ortası
    */

    return {

        vertical:
        (
            leftVertical +
            rightVertical
        ) / 2

    };

}


/* =================================================
   FACE RESULTS
================================================= */

faceMesh.onResults(
function(results){

    if(
        !running
    ){

        return;

    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){

        return;

    }


    const feature =
    getEyeFeature(
        results.multiFaceLandmarks[0]
    );


    /*
       Blink / zəif görüntü
    */

    if(
        !feature
    ){

        return;

    }


    lastGoodFrame =
    Date.now();


    /*
       KALİBRASİYA
    */

    if(
        collecting
    ){

        samples.push(
            feature.vertical
        );

        return;

    }


    /*
       NORMAL GÖZ İZLƏMƏ
    */

    if(
        calibrationData
    ){

        recentY.push(
            feature.vertical
        );


        /*
           Son 5 ölçünün
           medianı
        */

        if(
            recentY.length > 5
        ){

            recentY.shift();

        }


        const stableY =
        median(
            recentY
        );


        const normalized =
        mapGaze(
            stableY
        );


        /*
           Filtr
        */

        if(
            filteredY === null
        ){

            filteredY =
            normalized;

        }
        else{

            filteredY +=
            (
                normalized -
                filteredY
            ) *
            SMOOTH;

        }


        updateSelection(
            filteredY
        );

    }

});


/* =================================================
   KAMERA
================================================= */

async function startSystem(){

    startButton.disabled =
    true;


    statusBox.innerText =
    "Kamera hazırlanır...";


    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                },

                frameRate:{
                    ideal:30
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        running =
        true;


        startPanel.style.display =
        "none";


        statusBox.innerText =
        "Göz sistemi hazırlanır...";


        camera =
        new Camera(
            video,
            {

                onFrame:
                async function(){

                    try{

                        await faceMesh.send({
                            image:video
                        });

                    }
                    catch(error){

                        console.log(
                            error
                        );

                    }

                },

                width:640,

                height:480

            }
        );


        camera.start();


        setTimeout(
            beginSystem,
            1800
        );


    }
    catch(error){

        console.error(
            error
        );


        statusBox.innerText =
        "Kamera açıla bilmədi";


        startButton.disabled =
        false;

    }

}


/* =================================================
   BAŞLA
================================================= */

function beginSystem(){

    const saved =
    localStorage.getItem(
        STORAGE_KEY
    );


    if(
        saved
    ){

        try{

            const data =
            JSON.parse(saved);


            if(
                data.up &&
                data.center &&
                data.down
            ){

                calibrationData =
                data;

                showChoices();

                return;

            }

        }
        catch(error){

            console.log(
                error
            );

        }

    }


    startCalibration();

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrationData = {

        up:null,

        center:null,

        down:null

    };


    samples =
    [];

    recentY =
    [];

    filteredY =
    null;


    calibration.style.display =
    "block";


    choices.style.display =
    "none";


    progress.style.display =
    "none";


    reset.style.display =
    "none";


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    const keys =
    [
        "up",
        "center",
        "down"
    ];


    let index =
    0;


    function nextPoint(){

        points.forEach(
            p =>
            p.classList.remove(
                "active"
            )
        );


        /*
           BİTDİ
        */

        if(
            index >=
            points.length
        ){

            finishCalibration();

            return;

        }


        const point =
        points[index];


        const key =
        keys[index];


        point.classList.add(
            "active"
        );


        /*
           Yeni nümunələr
        */

        samples =
        [];


        collecting =
        false;


        statusBox.innerText =
        "Nöqtəyə baxın  " +
        (index+1) +
        " / 3";


        /*
           Əvvəl gözün
           yerləşməsinə vaxt
        */

        setTimeout(
        function(){

            samples =
            [];

            collecting =
            true;

        },
        SETTLE_TIME
        );


        /*
           Nümunə toplama
        */

        setTimeout(
        function(){

            collecting =
            false;


            /*
               Çox nümunə varsa
               kənarları atırıq
            */

            const sorted =
            [...samples].sort(
                (a,b)=>
                a-b
            );


            let clean =
            sorted;


            if(
                sorted.length >= 20
            ){

                const startCut =
                Math.floor(
                    sorted.length*.15
                );

                const endCut =
                Math.ceil(
                    sorted.length*.85
                );


                clean =
                sorted.slice(
                    startCut,
                    endCut
                );

            }


            /*
               Median
            */

            let value;


            if(
                clean.length >= 5
            ){

                value =
                median(
                    clean
                );

            }
            else{

                /*
                   Nümunə azdırsa
                   sonuncu görülən dəyəri
                   götür.
                */

                value =
                clean.length
                ?
                median(clean)
                :
                0;

            }


            const rect =
            point.getBoundingClientRect();


            calibrationData[key] = {

                eyeY:
                value,

                screenX:
                rect.left +
                rect.width/2,

                screenY:
                rect.top +
                rect.height/2

            };


            index++;


            setTimeout(
                nextPoint,
                350
            );

        },
        SETTLE_TIME +
        SAMPLE_TIME
        );

    }


    nextPoint();

}


/* =================================================
   KALİBRASİYA BİTİR
================================================= */

function finishCalibration(){

    collecting =
    false;


    /*
       Kalibrasiyanın həqiqətən
       üç ayrı nöqtə verdiyini yoxla.
    */

    if(
        !calibrationData.up ||
        !calibrationData.center ||
        !calibrationData.down
    ){

        statusBox.innerText =
        "Kalibrasiya yenidən edilir...";


        setTimeout(
            startCalibration,
            800
        );


        return;

    }


    /*
       Yuxarı və aşağı fərqi
       çox azdırsa yenə
       kalibrasiyanı təkrarlamaq
       daha doğrudur.
    */

    const verticalRange =
    Math.abs(
        calibrationData.down.eyeY -
        calibrationData.up.eyeY
    );


    if(
        verticalRange <
        0.025
    ){

        statusBox.innerText =
        "Göz hərəkəti zəif görüldü — yenidən kalibrasiya";


        setTimeout(
            startCalibration,
            900
        );


        return;

    }


    /*
       Yadda saxla
    */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            calibrationData
        )
    );


    points.forEach(
        p =>
        p.classList.remove(
            "active"
        )
    );


    calibration.style.display =
    "none";


    showChoices();

}


/* =================================================
   GÖRÜNÜŞ
================================================= */

function showChoices(){

    choices.style.display =
    "flex";


    progress.style.display =
    "block";


    reset.style.display =
    "block";


    recentY =
    [];

    filteredY =
    null;


    currentButton =
    null;

    candidateButton =
    null;

    candidateSince =
    0;

    lookStarted =
    0;


    bar.style.width =
    "0%";


    buttons.forEach(
        b =>
        b.classList.remove(
            "active"
        )
    );


    statusBox.innerText =
    "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GÖZÜ EKRANA XƏRİTƏLƏ
================================================= */

function mapGaze(
    eyeY
){

    const up =
    calibrationData.up.eyeY;


    const center =
    calibrationData.center.eyeY;


    const down =
    calibrationData.down.eyeY;


    /*
       Çox kiçik range olmaması
    */

    const totalRange =
    Math.max(
        Math.abs(
            down-up
        ),
        0.0001
    );


    /*
       Əsas xəritə:

       up    = 0
       center= 0.5
       down  = 1
    */

    let t =
    (
        eyeY -
        up
    ) /
    (
        down -
        up
    );


    /*
       Göz kamerasında istiqamət
       tərs çıxsa avtomatik düzəlt.
    */

    if(
        down < up
    ){

        t =
        1 - t;

    }


    /*
       Mərkəzi əsas götürüb
       göz hərəkətini böyüdürük.

       Bu çox vacibdir:
       kiçik göz hərəkəti
       ekranda daha böyük görünür.
    */

    t =
    0.5 +
    (
        t -
        0.5
    ) *
    GAZE_GAIN;


    /*
       Sərhəd
    */

    t =
    Math.max(
        0,
        Math.min(
            1,
            t
        )
    );


    return t;

}


/* =================================================
   SEÇİM
================================================= */

function updateSelection(
    t
){

    if(
        locked
    ){

        return;

    }


    /*
       Üz/göz məlumatı
       kəsilibsə seçim davam etməsin.
    */

    if(
        Date.now() -
        lastGoodFrame >
        500
    ){

        clearCandidate();

        return;

    }


    /*
       Mərkəzdə böyük boş zona.

       0.42-dən aşağı = HƏ
       0.58-dən yuxarı = YOX

       Arası = heç nə.
    */

    let target =
    null;


    if(
        t <
        0.42
    ){

        target =
        buttons[0];

    }


    else if(
        t >
        0.58
    ){

        target =
        buttons[1];

    }


    else{

        /*
           ortada
        */

        clearCandidate();

        return;

    }


    /*
       Yeni target
    */

    if(
        target !==
        candidateButton
    ){

        candidateButton =
        target;

        candidateSince =
        Date.now();


        /*
           hələ active etmə
        */

        return;

    }


    /*
       Target 220ms sabit qalsın
    */

    if(
        Date.now() -
        candidateSince <
        SWITCH_TIME
    ){

        return;

    }


    /*
       İlk dəfə active
    */

    if(
        currentButton !==
        target
    ){

        currentButton =
        target;

        lookStarted =
        Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
        "0%";


        return;

    }


    /*
       Sabit baxış
    */

    const elapsed =
    Date.now() -
    lookStarted;


    const percent =
    Math.min(
        100,
        (
            elapsed /
            DWELL_TIME
        ) *
        100
    );


    bar.style.width =
    percent +
    "%";


    /*
       SEÇİM
    */

    if(
        elapsed >=
        DWELL_TIME
    ){

        selectButton(
            target
        );

    }

}


/* =================================================
   NAMİZƏDİ SİL
================================================= */

function clearCandidate(){

    candidateButton =
    null;

    candidateSince =
    0;

    currentButton =
    null;

    lookStarted =
    0;


    buttons.forEach(
        b =>
        b.classList.remove(
            "active"
        )
    );


    bar.style.width =
    "0%";

}


/* =================================================
   SEÇ
================================================= */

function selectButton(
    button
){

    if(
        locked
    ){

        return;

    }


    locked =
    true;


    const action =
    button.dataset.action;


    if(
        action ===
        "YES"
    ){

        statusBox.innerText =
        "HƏ";

    }


    if(
        action ===
        "NO"
    ){

        statusBox.innerText =
        "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
    "100%";


    setTimeout(
    function(){

        locked =
        false;


        clearCandidate();


        gazeXReset();


        statusBox.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

    },
    1000
    );

}


/* =================================================
   GAZE RESET
================================================= */

function gazeXReset(){

    recentY =
    [];

    filteredY =
    null;

}


/* =================================================
   RESET CALIBRATION
================================================= */

reset.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            STORAGE_KEY
        );


        calibrationData =
        null;


        gazeXReset();


        clearCandidate();


        startCalibration();

    }
);


/* =================================================
   START
================================================= */

startButton.addEventListener(
    "click",
    startSystem
);

</script>
