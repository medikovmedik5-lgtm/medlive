<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f7fa;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:65px;
    background:#0b7285;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

#status{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#222;
}

#start{
    display:block;
    margin:20px auto;
    padding:20px 28px;
    border:0;
    border-radius:18px;
    background:#0b7285;
    color:white;
    font-size:20px;
    font-weight:bold;
}

#calibration{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
}

.point{
    position:absolute;
    width:30px;
    height:30px;
    background:red;
    border:4px solid white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 5px rgba(255,0,0,.2);
}

#choices{
    display:none;
    height:calc(100vh - 120px);
    padding:25px 20px;
    gap:22px;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.choice{
    width:88vw;
    max-width:520px;
    height:125px;

    border:0;
    border-radius:25px;

    color:white;
    font-size:38px;
    font-weight:bold;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.choice.active{
    transform:scale(1.035);

    box-shadow:
        0 0 0 7px rgba(0,0,0,.20);
}

.yes{
    background:#198754;
}

.call{
    background:#dc3545;
}

.no{
    background:#6c757d;
}

#progress{
    display:none;

    position:fixed;
    left:10%;
    bottom:18px;

    width:80%;
    height:12px;

    background:#ddd;
    border-radius:20px;

    overflow:hidden;
    z-index:200;
}

#bar{
    width:0%;
    height:100%;
    background:#0b7285;
}

/*
   WEBGAZER KAMERA GÖRÜNTÜSÜ
   EKRANDA GÖRÜNMƏSİN
*/

#webgazerVideoContainer,
#webgazerVideoFeed,
#webgazerFaceOverlay,
#webgazerFaceFeedbackBox,
#webgazerGazeDot{
    display:none !important;
}

</style>
</head>


<body>

<header>
    MEDELIN — PALATA 402
</header>

<div id="status">
    Sistem hazır deyil
</div>

<button id="start">
    👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="point"
         style="left:10%;top:15%">
    </div>

    <div class="point"
         style="left:50%;top:15%">
    </div>

    <div class="point"
         style="left:90%;top:15%">
    </div>


    <div class="point"
         style="left:10%;top:50%">
    </div>

    <div class="point"
         style="left:50%;top:50%">
    </div>

    <div class="point"
         style="left:90%;top:50%">
    </div>


    <div class="point"
         style="left:10%;top:85%">
    </div>

    <div class="point"
         style="left:50%;top:85%">
    </div>

    <div class="point"
         style="left:90%;top:85%">
    </div>

</div>


<!-- =========================
     DÜYMƏLƏR
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>


    <button
        class="choice call"
        data-action="CALL">

        🚨 OTAĞA GƏL

    </button>


    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">
    <div id="bar"></div>
</div>


<script>

/* =========================
   ELEMENTLƏR
========================= */

const statusBox =
    document.getElementById("status");

const startButton =
    document.getElementById("start");

const calibration =
    document.getElementById("calibration");

const choices =
    document.getElementById("choices");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const buttons =
    [...document.querySelectorAll(".choice")];


/* =========================
   AYARLAR
========================= */

/*
   1.6 saniyə baxış
*/

const DWELL_TIME = 1600;


/*
   Göz hərəkətini yumşaldırıq.

   0.10 = daha stabil
*/

const SMOOTHING = 0.10;


/*
   Düymənin normal qəbul sahəsi.
   Əvvəlki kimi həddindən artıq böyük deyil.
*/

const EXTRA_ZONE = 25;


/*
   Yeni düyməyə keçmək üçün
   kiçik təhlükəsizlik gecikməsi.
*/

const SWITCH_DELAY = 300;


/* =========================
   DƏYİŞƏNLƏR
========================= */

let smoothX = null;
let smoothY = null;

let currentButton = null;

let currentStart = 0;

let locked = false;


/* =========================
   SƏS YOX
========================= */

if(
    "speechSynthesis" in window
){

    speechSynthesis.cancel();

}


/* =========================
   WEBGAZER BAŞLAT
========================= */

async function startEyeTracking(){

    startButton.style.display =
        "none";

    statusBox.innerText =
        "Kamera hazırlanır...";


    try{

        /*
           BURA ƏVVƏLKİ İŞLƏYƏN
           SİSTEMDİR.

           Kameranı ayrıca açmırıq.
        */

        webgazer
            .setRegression("ridge")
            .setTracker("TFFacemesh")
            .saveDataAcrossSessions(false)
            .applyKalmanFilter(true)
            .showVideo(false)
            .showFaceOverlay(false)
            .showFaceFeedbackBox(false)
            .showPredictionPoints(false);


        await webgazer.begin();


        statusBox.innerText =
            "Kalibrasiya başlayır...";


        startCalibration();


    }catch(error){

        console.error(error);


        statusBox.innerText =
            "Kamera açıla bilmədi";


        startButton.style.display =
            "block";
    }

}


/* =========================
   KALİBRASİYA
========================= */

function startCalibration(){

    calibration.style.display =
        "block";


    const points =
        [
            ...document.querySelectorAll(".point")
        ];


    let index = 0;


    function nextPoint(){

        /*
           Bütün nöqtələr bitdi
        */

        if(
            index >= points.length
        ){

            calibration.style.display =
                "none";


            choices.style.display =
                "flex";


            progress.style.display =
                "block";


            statusBox.innerText =
                "Hazırdır — düyməyə bax";


            startGaze();


            return;
        }


        const point =
            points[index];


        statusBox.innerText =
            "Nöqtəyə bax  " +
            (index + 1) +
            " / " +
            points.length;


        const started =
            Date.now();


        /*
           Hər 100 ms nümunə
        */

        const timer =
            setInterval(()=>{

                const rect =
                    point.getBoundingClientRect();


                const x =
                    rect.left +
                    rect.width / 2;


                const y =
                    rect.top +
                    rect.height / 2;


                webgazer.recordScreenPosition(
                    x,
                    y,
                    "click"
                );


                if(
                    Date.now() - started >= 2500
                ){

                    clearInterval(timer);


                    index++;


                    setTimeout(
                        nextPoint,
                        250
                    );

                }

            },100);

    }


    nextPoint();

}


/* =========================
   DÜYMƏNİ TAP
========================= */

function findButton(x,y){

    let closest = null;

    let closestDistance =
        Infinity;


    for(
        const button of buttons
    ){

        const rect =
            button.getBoundingClientRect();


        /*
           Düymənin mərkəzi
        */

        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        /*
           Əvvəl normal zonanı yoxlayırıq
        */

        const inside =
            x >= rect.left - EXTRA_ZONE &&
            x <= rect.right + EXTRA_ZONE &&
            y >= rect.top - EXTRA_ZONE &&
            y <= rect.bottom + EXTRA_ZONE;


        if(!inside){

            continue;

        }


        /*
           Mərkəzə məsafə
        */

        const dx =
            x - centerX;

        const dy =
            y - centerY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           Ən yaxın düyməni seç
        */

        if(
            distance <
            closestDistance
        ){

            closest =
                button;

            closestDistance =
                distance;
        }

    }


    return closest;

}


/* =========================
   GÖZ İZLƏMƏ
========================= */

function startGaze(){

    webgazer.setGazeListener(
        function(data){

            if(
                !data ||
                locked
            ){

                return;

            }


            let x =
                Number(data.x);

            let y =
                Number(data.y);


            if(
                !Number.isFinite(x) ||
                !Number.isFinite(y)
            ){

                return;

            }


            /*
               GÖZ NÖQTƏSİNİ
               YUMŞALDIRIQ
            */

            if(
                smoothX === null
            ){

                smoothX = x;
                smoothY = y;

            }
            else{

                smoothX =
                    smoothX +
                    (x - smoothX) *
                    SMOOTHING;


                smoothY =
                    smoothY +
                    (y - smoothY) *
                    SMOOTHING;

            }


            /*
               Hansı düyməyə baxır?
            */

            const target =
                findButton(
                    smoothX,
                    smoothY
                );


            /*
               Heç bir düymə deyil
            */

            if(!target){

                currentButton =
                    null;

                currentStart =
                    0;


                buttons.forEach(
                    button =>
                        button.classList.remove(
                            "active"
                        )
                );


                bar.style.width =
                    "0%";


                return;

            }


            /*
               YENİ DÜYMƏ
            */

            if(
                target !==
                currentButton
            ){

                currentButton =
                    target;


                currentStart =
                    Date.now();


                buttons.forEach(
                    button =>
                        button.classList.remove(
                            "active"
                        )
                );


                target.classList.add(
                    "active"
                );


                bar.style.width =
                    "0%";


                return;

            }


            /*
               EYNİ DÜYMƏDƏ QALIB
            */

            const elapsed =
                Date.now() -
                currentStart;


            const percent =
                Math.min(
                    100,
                    elapsed /
                    DWELL_TIME *
                    100
                );


            bar.style.width =
                percent + "%";


            /*
               1.6 saniyə tamamlandı
            */

            if(
                elapsed >=
                DWELL_TIME
            ){

                selectButton(
                    target
                );

            }

        }
    );

}


/* =========================
   SEÇİM
========================= */

function selectButton(button){

    if(locked){

        return;

    }


    locked = true;


    const action =
        button.dataset.action;


    button.classList.add(
        "active"
    );


    if(
        action === "CALL"
    ){

        statusBox.innerText =
            "🚨 PALATA 402 — OTAĞA GƏL";

        console.log(
            "PALATA 402 → OTAĞA GƏL"
        );

    }


    if(
        action === "YES"
    ){

        statusBox.innerText =
            "HƏ seçildi";

        console.log(
            "PALATA 402 → HƏ"
        );

    }


    if(
        action === "NO"
    ){

        statusBox.innerText =
            "YOX seçildi";

        console.log(
            "PALATA 402 → YOX"
        );

    }


    bar.style.width =
        "100%";


    /*
       Seçimdən sonra
       yenidən baxış gözləyirik.
    */

    setTimeout(()=>{

        locked = false;

        currentButton =
            null;

        currentStart =
            0;

        smoothX =
            null;

        smoothY =
            null;


        button.classList.remove(
            "active"
        );


        bar.style.width =
            "0%";


        statusBox.innerText =
            "Hazırdır — düyməyə bax";


    },1200);

}


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    startEyeTracking
);


/* =========================
   BARMAQLA DA TEST
========================= */

buttons.forEach(
    button => {

        button.addEventListener(
            "click",
            ()=>{
                selectButton(button);
            }
        );

    }
);

</script>

</body>
</html>
