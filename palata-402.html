<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f4f7fa;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
header{
 height:65px;
 background:#0b7285;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
 font-weight:bold;
}
#status{
 height:60px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 font-weight:bold;
 text-align:center;
}
#start{
 display:block;
 margin:20px auto;
 padding:20px 30px;
 border:0;
 border-radius:18px;
 background:#0b7285;
 color:white;
 font-size:20px;
 font-weight:bold;
}
#calibration{
 display:none;
 position:fixed;
 inset:0;
 z-index:50;
}
.point{
 position:absolute;
 width:30px;
 height:30px;
 background:red;
 border:4px solid white;
 border-radius:50%;
 transform:translate(-50%,-50%);
 box-shadow:0 0 0 6px rgba(255,0,0,.2);
}
#choices{
 display:none;
 height:calc(100vh - 125px);
 padding:20px;
 gap:18px;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}
.choice{
 width:90vw;
 max-width:520px;
 height:135px;
 border:0;
 border-radius:25px;
 color:white;
 font-size:38px;
 font-weight:bold;
 transition:.15s;
}
.choice.active{
 transform:scale(1.05);
 box-shadow:0 0 0 8px rgba(0,0,0,.18);
}
.yes{background:#198754}
.call{background:#dc3545}
.no{background:#6c757d}

#progress{
 display:none;
 position:fixed;
 bottom:15px;
 left:5%;
 width:90%;
 height:13px;
 background:#ddd;
 border-radius:20px;
 overflow:hidden;
 z-index:100;
}
#bar{
 width:0%;
 height:100%;
 background:#0b7285;
}

#webgazerVideoContainer,
#webgazerVideoFeed,
#webgazerFaceOverlay,
#webgazerFaceFeedbackBox,
#webgazerGazeDot{
 display:none!important;
}
</style>
</head>

<body>

<header>MEDELIN — PALATA 402</header>

<div id="status">Sistem hazır deyil</div>

<button id="start">👁️ GÖZ İZLƏMƏNİ BAŞLAT</button>

<div id="calibration">

 <div class="point" style="left:8%;top:12%"></div>
 <div class="point" style="left:50%;top:12%"></div>
 <div class="point" style="left:92%;top:12%"></div>

 <div class="point" style="left:8%;top:50%"></div>
 <div class="point" style="left:50%;top:50%"></div>
 <div class="point" style="left:92%;top:50%"></div>

 <div class="point" style="left:8%;top:88%"></div>
 <div class="point" style="left:50%;top:88%"></div>
 <div class="point" style="left:92%;top:88%"></div>

</div>

<div id="choices">

 <button class="choice yes" data-action="YES">HƏ</button>

 <button class="choice call" data-action="CALL">
 🚨 OTAĞA GƏL
 </button>

 <button class="choice no" data-action="NO">YOX</button>

</div>

<div id="progress">
 <div id="bar"></div>
</div>

<script>

const statusBox=document.getElementById("status");
const start=document.getElementById("start");
const calibration=document.getElementById("calibration");
const choices=document.getElementById("choices");
const progress=document.getElementById("progress");
const bar=document.getElementById("bar");
const buttons=[...document.querySelectorAll(".choice")];

let smoothX=null;
let smoothY=null;
let current=null;
let currentStart=0;
let locked=false;

const DWELL=1500;
const SMOOTH=.12;
const EXTRA=75;


/* SƏSİ TAM LƏĞV ET */
if("speechSynthesis" in window){
 speechSynthesis.cancel();
}


/* KAMERANI ƏVVƏL YOXLAYIRIQ */
async function cameraCheck(){

 statusBox.innerText="Kamera yoxlanılır...";

 try{

  const stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480}
   },
   audio:false
  });

  /* Kamera icazəsi alındı */
  stream.getTracks().forEach(t=>t.stop());

  statusBox.innerText="Kamera hazırdır...";

  setTimeout(startWebGazer,500);

 }catch(e){

  console.error(e);

  statusBox.innerText=
   "Kamera açıla bilmədi. Kamera icazəsini yoxla.";

  start.style.display="block";
 }
}


/* WEBGAZER */
async function startWebGazer(){

 try{

  statusBox.innerText="Göz izləmə hazırlanır...";

  await webgazer
   .setRegression("ridge")
   .setTracker("TFFacemesh")
   .saveDataAcrossSessions(false)
   .applyKalmanFilter(true)
   .showVideo(false)
   .showFaceOverlay(false)
   .showFaceFeedbackBox(false)
   .showPredictionPoints(false)
   .begin();

  statusBox.innerText=
   "Kalibrasiya başlayır...";

  startCalibration();

 }catch(e){

  console.error(e);

  statusBox.innerText=
   "Göz izləmə başlatmaq olmadı.";

  start.style.display="block";
 }
}


/* KALİBRASİYA */
function startCalibration(){

 calibration.style.display="block";

 const points=[...document.querySelectorAll(".point")];

 let i=0;

 function next(){

  if(i>=points.length){

   calibration.style.display="none";
   choices.style.display="flex";
   progress.style.display="block";

   statusBox.innerText=
    "Hazırdır — düyməyə bax";

   beginGaze();

   return;
  }

  const p=points[i];

  statusBox.innerText=
   "Qırmızı nöqtəyə bax  "+(i+1)+"/"+points.length;

  const started=Date.now();

  const timer=setInterval(()=>{

   const r=p.getBoundingClientRect();

   webgazer.recordScreenPosition(
    r.left+r.width/2,
    r.top+r.height/2,
    "click"
   );

   if(Date.now()-started>=2200){

    clearInterval(timer);
    i++;

    setTimeout(next,300);
   }

  },100);
 }

 next();
}


/* DÜYMƏ ZONASI */
function findButton(x,y){

 for(const b of buttons){

  const r=b.getBoundingClientRect();

  if(
   x>=r.left-EXTRA &&
   x<=r.right+EXTRA &&
   y>=r.top-EXTRA &&
   y<=r.bottom+EXTRA
  ){
   return b;
  }
 }

 return null;
}


/* GÖZ İZLƏMƏ */
function beginGaze(){

 webgazer.setGazeListener((data)=>{

  if(!data || locked)return;

  let x=Number(data.x);
  let y=Number(data.y);

  if(!Number.isFinite(x)||!Number.isFinite(y))return;


  /* ÇOX GÜCLÜ YUMŞALTMA */

  if(smoothX===null){

   smoothX=x;
   smoothY=y;

  }else{

   smoothX += (x-smoothX)*SMOOTH;
   smoothY += (y-smoothY)*SMOOTH;
  }


  const target=findButton(smoothX,smoothY);


  /* Düymədən çıxıbsa */

  if(!target){

   current=null;
   currentStart=0;

   buttons.forEach(b=>b.classList.remove("active"));

   bar.style.width="0%";

   return;
  }


  /* Yeni düymə */

  if(target!==current){

   current=target;
   currentStart=Date.now();

   buttons.forEach(b=>b.classList.remove("active"));
   target.classList.add("active");

   bar.style.width="0%";

   return;
  }


  /* Eyni düymədə qalır */

  const elapsed=Date.now()-currentStart;

  const percent=Math.min(
   100,
   elapsed/DWELL*100
  );

  bar.style.width=percent+"%";


  /* 1.5 saniyə tamamlandı */

  if(elapsed>=DWELL){

   choose(target);
  }

 });
}


/* SEÇİM */
function choose(button){

 if(locked)return;

 locked=true;

 const action=button.dataset.action;

 button.classList.add("active");

 if(action==="CALL"){

  statusBox.innerText=
   "🚨 PALATA 402 — OTAĞA GƏL";

  console.log(
   "PALATA 402 → OTAĞA GƏL"
  );

 }

 if(action==="YES"){

  statusBox.innerText=
   "HƏ seçildi";

  console.log(
   "PALATA 402 → HƏ"
  );

 }

 if(action==="NO"){

  statusBox.innerText=
   "YOX seçildi";

  console.log(
   "PALATA 402 → YOX"
  );
 }

 bar.style.width="100%";


 /* 1 saniyə sonra yenidən hazır */

 setTimeout(()=>{

  locked=false;
  current=null;
  currentStart=0;

  button.classList.remove("active");

  bar.style.width="0%";

  statusBox.innerText=
   "Hazırdır — düyməyə bax";

 },1000);
}


/* BAŞLAT */
start.addEventListener("click",()=>{

 start.style.display="none";

 cameraCheck();

});


/* BARMAQLA DA TEST ET */
buttons.forEach(b=>{

 b.addEventListener("click",()=>{
  choose(b);
 });

});

</script>

</body>
</html>
