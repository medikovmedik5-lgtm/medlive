<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MEDELIN — Palata 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f4f7fa;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

header {
    height: 65px;
    background: #0b7285;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
}

#status {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: bold;
    color: #333;
}

#start {
    display: block;
    margin: 15px auto;
    padding: 18px 28px;
    border: none;
    border-radius: 15px;
    background: #0b7285;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

#calibration {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

.cal-point {
    position: absolute;
    width: 28px;
    height: 28px;
    background: red;
    border: 4px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 5px rgba(255,0,0,.25);
}

#choices {
    display: none;
    height: calc(100vh - 115px);
    padding: 25px;
    gap: 20px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.choice {
    width: min(90vw, 500px);
    height: 130px;
    border: none;
    border-radius: 25px;
    font-size: 38px;
    font-weight: bold;
    color: white;
    position: relative;
    transition: transform .15s, box-shadow .15s;
}

.choice.looking {
    transform: scale(1.045);
    box-shadow: 0 0 0 8px rgba(0,0,0,.18);
}

.yes {
    background: #198754;
}

.no {
    background: #6c757d;
}

.call {
    background: #dc3545;
}

#progress {
    position: fixed;
    left: 5%;
    bottom: 18px;
    width: 90%;
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    display: none;
    z-index: 30;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #0b7285;
    transition: width .05s linear;
}

/* WebGazer-in yaratdığı görüntüləri gizlədirik */
#webgazerVideoContainer,
#webgazerFaceOverlay,
#webgazerFaceFeedbackBox,
#webgazerGazeDot,
#webgazerVideoFeed {
    display: none !important;
}
</style>
</head>

<body>

<header>
    MEDELIN — PALATA 402
</header>

<div id="status">
    Sistem hazır deyil
</div>

<button id="start">
    👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="calibration">

    <div class="cal-point" style="left:8%;top:12%"></div>
    <div class="cal-point" style="left:50%;top:12%"></div>
    <div class="cal-point" style="left:92%;top:12%"></div>

    <div class="cal-point" style="left:8%;top:50%"></div>
    <div class="cal-point" style="left:50%;top:50%"></div>
    <div class="cal-point" style="left:92%;top:50%"></div>

    <div class="cal-point" style="left:8%;top:88%"></div>
    <div class="cal-point" style="left:50%;top:88%"></div>
    <div class="cal-point" style="left:92%;top:88%"></div>

</div>

<div id="choices">

    <button class="choice yes" data-action="YES">
        HƏ
    </button>

    <button class="choice call" data-action="CALL">
        🚨 OTAĞA GƏL
    </button>

    <button class="choice no" data-action="NO">
        YOX
    </button>

</div>

<div id="progress">
    <div id="progressBar"></div>
</div>

<script>

const statusBox = document.getElementById("status");
const startButton = document.getElementById("start");
const calibration = document.getElementById("calibration");
const choices = document.getElementById("choices");
const progress = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");

const buttons = [...document.querySelectorAll(".choice")];

let calibrated = false;
let selectedButton = null;
let lookStart = 0;

/*
    STABİLLİK AYARLARI
*/

const DWELL_TIME = 1500;

// Göz nöqtəsinin neçə faiz yumşaldılacağı
const SMOOTHING = 0.18;

// Düymənin ətrafında əlavə qəbul zonası
const EXTRA_ZONE = 55;

// Çox sürətli dəyişmələrin qarşısını alır
const SWITCH_DELAY = 250;

let smoothX = null;
let smoothY = null;

let lastCandidate = null;
let candidateSince = 0;


/*
    SƏSİ TAM SÖNDÜR
*/

if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
}


/*
    WEBGAZER QURULUŞU
*/

async function startEyeTracking() {

    startButton.style.display = "none";

    statusBox.innerText = "Kamera hazırlanır...";

    try {

        await webgazer
            .setRegression("ridge")
            .setTracker("TFFacemesh")
            .saveDataAcrossSessions(false)
            .applyKalmanFilter(true)
            .showVideo(false)
            .showFaceOverlay(false)
            .showFaceFeedbackBox(false)
            .showPredictionPoints(false)
            .begin();

        statusBox.innerText =
            "Kalibrasiya başlayır — qırmızı nöqtələrə bax";

        startCalibration();

    } catch (error) {

        console.error(error);

        statusBox.innerText =
            "Kamera açıla bilmədi";

        startButton.style.display = "block";
    }
}


/*
    KALİBRASİYA
*/

function startCalibration() {

    calibration.style.display = "block";

    const points =
        [...document.querySelectorAll(".cal-point")];

    let index = 0;

    function nextPoint() {

        if (index >= points.length) {

            calibration.style.display = "none";

            calibrated = true;

            statusBox.innerText =
                "Hazırdır — düyməyə bax";

            choices.style.display = "flex";
            progress.style.display = "block";

            startGazeTracking();

            return;
        }

        const point = points[index];

        statusBox.innerText =
            "Nöqtəyə bax: " +
            (index + 1) +
            " / " +
            points.length;

        let startTime = Date.now();

        const interval = setInterval(() => {

            const elapsed = Date.now() - startTime;

            const rect = point.getBoundingClientRect();

            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            /*
                WebGazer-ə eyni nöqtə haqqında
                çoxlu nümunə veririk.
            */

            webgazer.recordScreenPosition(
                x,
                y,
                "click"
            );

            if (elapsed >= 2200) {

                clearInterval(interval);

                index++;

                setTimeout(nextPoint, 250);
            }

        }, 100);

    }

    nextPoint();
}


/*
    DÜYMƏNİN GENİŞ QƏBUL ZONASI
*/

function getButtonAt(x, y) {

    for (const button of buttons) {

        const rect = button.getBoundingClientRect();

        const left =
            rect.left - EXTRA_ZONE;

        const right =
            rect.right + EXTRA_ZONE;

        const top =
            rect.top - EXTRA_ZONE;

        const bottom =
            rect.bottom + EXTRA_ZONE;

        if (
            x >= left &&
            x <= right &&
            y >= top &&
            y <= bottom
        ) {
            return button;
        }
    }

    return null;
}


/*
    GÖZ İZLƏMƏ
*/

function startGazeTracking() {

    webgazer.setGazeListener(function(data) {

        if (!data || !calibrated) {
            return;
        }

        let x = Number(data.x);
        let y = Number(data.y);

        if (
            !Number.isFinite(x) ||
            !Number.isFinite(y)
        ) {
            return;
        }


        /*
            LOW-PASS FILTER

            Göz nöqtəsinin qəfil
            sıçramalarını yumşaldır.
        */

        if (smoothX === null) {

            smoothX = x;
            smoothY = y;

        } else {

            smoothX =
                smoothX +
                (x - smoothX) * SMOOTHING;

            smoothY =
                smoothY +
                (y - smoothY) * SMOOTHING;
        }


        const candidate =
            getButtonAt(smoothX, smoothY);


        /*
            Heç bir düymədə deyilsə
        */

        if (!candidate) {

            clearLooking();

            return;
        }


        /*
            Eyni düymədədirsə
        */

        if (candidate === lastCandidate) {

            const elapsed =
                Date.now() - candidateSince;

            const percent =
                Math.min(
                    100,
                    (elapsed / DWELL_TIME) * 100
                );

            progressBar.style.width =
                percent + "%";

            if (elapsed >= DWELL_TIME) {

                selectButton(candidate);

                candidateSince =
                    Date.now() + 100000;

            }

            return;
        }


        /*
            Yeni düyməyə keçəndə
            dərhal seçim etmirik.
        */

        if (
            Date.now() - candidateSince <
            SWITCH_DELAY
        ) {
            return;
        }

        lastCandidate = candidate;
        candidateSince = Date.now();

        clearButtonStyles();

        candidate.classList.add("looking");

        progressBar.style.width = "0%";
    });
}


/*
    BÜTÜN DÜYMƏLƏRİ TƏMİZLƏ
*/

function clearButtonStyles() {

    buttons.forEach(button => {

        button.classList.remove("looking");

    });
}


/*
    BAXIŞI SIFIRLA
*/

function clearLooking() {

    lastCandidate = null;
    candidateSince = Date.now();

    clearButtonStyles();

    progressBar.style.width = "0%";
}


/*
    SEÇİM
*/

function selectButton(button) {

    if (!button) {
        return;
    }

    const action =
        button.dataset.action;


    /*
        Vizual təsdiq
    */

    button.classList.add("looking");

    setTimeout(() => {

        button.classList.remove("looking");

    }, 300);


    /*
        BURADA SONRA SERVERƏ
        BİLDİRİŞ GÖNDƏRƏCƏYİK.
    */

    if (action === "CALL") {

        statusBox.innerText =
            "🚨 PALATA 402 — TƏCİLİ: OTAĞA GƏL";

        console.log(
            "PALATA 402 → OTAĞA GƏL"
        );

    }

    else if (action === "YES") {

        statusBox.innerText =
            "HƏ seçildi";

        console.log(
            "PALATA 402 → HƏ"
        );

    }

    else if (action === "NO") {

        statusBox.innerText =
            "YOX seçildi";

        console.log(
            "PALATA 402 → YOX"
        );
    }


    /*
        Seçimdən sonra yeni seçim üçün
        yenidən stabil baxış tələb olunur.
    */

    lastCandidate = null;
    candidateSince = Date.now() + 500;

    progressBar.style.width = "0%";
}


/*
    TELEFONDA ƏL İLƏ DƏ TEST ETMƏK ÜÇÜN
*/

buttons.forEach(button => {

    button.addEventListener("click", () => {

        selectButton(button);

    });

});


startButton.addEventListener(
    "click",
    startEyeTracking
);

</script>

</body>
</html>
