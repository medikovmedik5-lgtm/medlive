<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEDELIN — Palata 402</title>

  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5fb;
      color: #172b4d;
      text-align: center;
    }

    header {
      background: #1976b9;
      color: white;
      padding: 22px 10px;
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      margin: 20px auto;
      max-width: 700px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      font-size: 19px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .dot {
      display: inline-block;
      width: 16px;
      height: 16px;
      background: red;
      border-radius: 50%;
      margin-right: 8px;
    }

    .main {
      max-width: 850px;
      margin: auto;
      padding: 10px 20px 40px;
    }

    .eye-title {
      font-size: 28px;
      font-weight: bold;
      margin-top: 30px;
    }

    .info {
      font-size: 19px;
      line-height: 1.5;
      margin: 15px auto 25px;
      max-width: 650px;
    }

    #startBtn {
      background: #1976b9;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 20px 35px;
      font-size: 22px;
      cursor: pointer;
      font-weight: bold;
    }

    #startBtn:active {
      transform: scale(0.97);
    }

    .choices {
      display: none;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .choice {
      min-height: 130px;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }

    #yes {
      background: #22a447;
    }

    #call {
      background: #e53935;
    }

    #no {
      background: #555;
    }

    .selected {
      outline: 8px solid #ffd600;
      transform: scale(1.02);
    }

    #gazeText {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
    }

    .warning {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }

    /*
      KAMERA GİZLİDİR.
      Kamera səni görür və WebGazer istifadə edir,
      amma görüntü istifadəçiyə göstərilmir.
    */
    #webgazerVideoContainer,
    #webgazerVideoFeed,
    #webgazerVideoCanvas,
    #webgazerFaceOverlay,
    #webgazerFaceFeedbackBox {
      display: none !important;
      visibility: hidden !important;
    }

    #webgazerGazeDot {
      display: none !important;
    }

    #cameraStatus {
      color: #555;
      margin-top: 10px;
    }

    @media (min-width: 600px) {
      .choices {
        grid-template-columns: repeat(3, 1fr);
      }

      .choice {
        min-height: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  🏥 MEDELIN — PALATA 402
</header>

<div class="status">
  <span class="dot"></span>
  <span id="cameraStatus">
    Göz izləmə sistemi hazır deyil
  </span>
</div>

<div class="main">

  <div class="eye-title">
    👁️ Gözlə idarəetmə
  </div>

  <div class="info">
    Kamera sizi izləyir, amma kamera görüntüsü ekranda göstərilmir.
    <br>
    Ekrandakı seçimə baxaraq cavab verə bilərsiniz.
  </div>

  <button id="startBtn">
    👁️ GÖZ İZLƏMƏNİ BAŞLAT
  </button>

  <div class="choices" id="choices">

    <button class="choice" id="yes">
      HƏ
    </button>

    <button class="choice" id="call">
      🚨 OTAĞA GƏL
    </button>

    <button class="choice" id="no">
      YOX
    </button>

  </div>

  <div id="gazeText"></div>

  <div class="warning">
    Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
  </div>

</div>

<script>

let started = false;
let currentButton = null;
let gazeStartTime = 0;
let confirmTimer = null;

const startBtn = document.getElementById("startBtn");
const choices = document.getElementById("choices");
const cameraStatus = document.getElementById("cameraStatus");
const gazeText = document.getElementById("gazeText");

const buttons = [
  document.getElementById("yes"),
  document.getElementById("call"),
  document.getElementById("no")
];


// --------------------------------
// SƏS
// --------------------------------

function speak(text) {

  if ("speechSynthesis" in window) {

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "az-AZ";
    speech.rate = 0.9;

    speechSynthesis.speak(speech);
  }
}


// --------------------------------
// SEÇİM
// --------------------------------

function selectButton(button) {

  buttons.forEach(b => {
    b.classList.remove("selected");
  });

  button.classList.add("selected");

  let text = button.innerText;

  gazeText.innerText = "Seçildi: " + text;

  speak(text);

  if (button.id === "call") {

    // Burada gələcəkdə tibb bacısına bildiriş göndəriləcək.
    console.log("PALATA 402: OTAĞA GƏL");

  }
}


// --------------------------------
// GÖZÜN DÜYMƏ ÜZƏRİNDƏ QALMASI
// --------------------------------

function checkGaze(x, y) {

  let found = null;

  buttons.forEach(button => {

    const rect = button.getBoundingClientRect();

    if (
      x >= rect.left &&
      x <= rect.right &&
      y >= rect.top &&
      y <= rect.bottom
    ) {
      found = button;
    }

  });


  if (found !== currentButton) {

    currentButton = found;
    gazeStartTime = Date.now();

    buttons.forEach(b => {
      b.classList.remove("selected");
    });

    if (confirmTimer) {
      clearTimeout(confirmTimer);
      confirmTimer = null;
    }

  }


  if (found) {

    const elapsed = Date.now() - gazeStartTime;

    gazeText.innerText =
      "Seçim üçün baxmağa davam edin... " +
      Math.max(0, 2 - Math.floor(elapsed / 1000)) +
      " saniyə";

    if (elapsed >= 2000 && !confirmTimer) {

      confirmTimer = true;

      selectButton(found);

      setTimeout(() => {
        confirmTimer = null;
      }, 1500);

    }

  } else {

    gazeText.innerText = "Ekrandakı seçimə baxın.";

  }

}


// --------------------------------
// GÖZ İZLƏMƏNİ BAŞLAT
// --------------------------------

startBtn.addEventListener("click", async () => {

  if (started) return;

  started = true;

  cameraStatus.innerText =
    "Kamera aktivdir — göz izlənilir";

  startBtn.style.display = "none";

  choices.style.display = "grid";

  try {

    await webgazer
      .setRegression("ridge")
      .setTracker("TFFacemesh")
      .setGazeListener(function(data) {

        if (!data) return;

        checkGaze(data.x, data.y);

      })
      .begin();


    // KAMERA GÖRÜNTÜSÜ TAM GİZLƏDİLİR
    webgazer.showVideo(false);
    webgazer.showFaceOverlay(false);
    webgazer.showFaceFeedbackBox(false);
    webgazer.showPredictionPoints(false);


    cameraStatus.innerText =
      "🟢 Kamera aktivdir — sizi görür, görüntü göstərilmir.";

  } catch (error) {

    console.error(error);

    cameraStatus.innerText =
      "🔴 Kamera açıla bilmədi.";

    startBtn.style.display = "block";
    choices.style.display = "none";

  }

});

</script>

</body>
</html>
