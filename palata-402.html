<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef5fb;
  font-family: Arial, sans-serif;
  color: #172b4d;
  text-align: center;
}

header {
  background: #1976b9;
  color: white;
  padding: 25px 10px;
  font-size: 30px;
  font-weight: bold;
}

.status {
  background: white;
  margin: 30px 0 20px;
  padding: 20px;
  border-radius: 20px;
  font-size: 19px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.dot {
  display: inline-block;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: red;
  margin-right: 8px;
}

.main {
  max-width: 850px;
  margin: auto;
  padding: 10px 20px 40px;
}

h1 {
  font-size: 30px;
}

.info {
  font-size: 20px;
  line-height: 1.5;
  margin: 20px 0 30px;
}

#startBtn {
  width: 90%;
  max-width: 650px;
  padding: 24px;
  border: 0;
  border-radius: 22px;
  background: #1976b9;
  color: white;
  font-size: 23px;
  font-weight: bold;
}

#choices {
  display: none;
  margin-top: 30px;
  gap: 18px;
  flex-direction: column;
}

.choice {
  border: 0;
  border-radius: 25px;
  min-height: 130px;
  color: white;
  font-size: 32px;
  font-weight: bold;
}

#yes {
  background: #22a447;
}

#call {
  background: #e53935;
}

#no {
  background: #555;
}

.selected {
  outline: 8px solid #ffd600;
  transform: scale(1.02);
}

#gazeText {
  margin-top: 25px;
  font-size: 20px;
  min-height: 35px;
}

.warning {
  margin-top: 40px;
  color: #777;
  font-size: 14px;
}

/* Kamera tamamilə gizlidir */
#camera {
  position: fixed;
  width: 1px;
  height: 1px;
  left: -9999px;
  top: -9999px;
  opacity: 0;
  pointer-events: none;
}

@media (min-width: 650px) {
  #choices {
    flex-direction: row;
  }

  .choice {
    flex: 1;
    min-height: 180px;
  }
}
</style>
</head>

<body>

<header>
🏥 MEDELIN — PALATA 402
</header>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="statusText">
    Sistem hazır deyil
  </span>
</div>

<div class="main">

<h1>👁️ Gözlə idarəetmə</h1>

<div class="info">
  Kamera sizi görür, amma görüntünüz ekranda göstərilmir.
  <br>
  Ekrandakı seçimlərə baxaraq cavab verə bilərsiniz.
</div>

<button id="startBtn">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="choices">

  <button class="choice" id="yes">
    HƏ
  </button>

  <button class="choice" id="call">
    🚨 OTAĞA GƏL
  </button>

  <button class="choice" id="no">
    YOX
  </button>

</div>

<div id="gazeText"></div>

<div class="warning">
  Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
</div>

</div>

<video id="camera" autoplay playsinline muted></video>

<script>

const video = document.getElementById("camera");
const startBtn = document.getElementById("startBtn");
const choices = document.getElementById("choices");

const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");
const gazeText = document.getElementById("gazeText");

let stream = null;
let faceMesh = null;


/* =========================
   SƏS
========================= */

function speak(text) {

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang = "az-AZ";
  voice.rate = 0.85;

  speechSynthesis.speak(voice);
}


/* =========================
   DÜYMƏ
========================= */

function selectButton(button) {

  document.querySelectorAll(".choice").forEach(b => {
    b.classList.remove("selected");
  });

  button.classList.add("selected");

  const text = button.innerText;

  gazeText.innerText = "Seçildi: " + text;

  speak(text);

  if (button.id === "call") {
    console.log("PALATA 402 → OTAĞA GƏL");
  }
}


/* =========================
   KAMERANI AÇ
========================= */

async function startCamera() {

  try {

    statusText.innerText = "🟡 Kamera açılır...";
    dot.style.background = "#ff9800";

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "Bu brauzer kamera API-ni dəstəkləmir."
      );
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    /* BURAYA QƏDƏR KAMERA TAM İŞLƏYİB */

    statusText.innerText =
      "🟢 KAMERA İŞLƏYİR — görüntü gizlidir";

    dot.style.background = "#20b957";

    gazeText.innerText =
      "Kamera hazırdır. Üzünüzü kameraya tərəf saxlayın.";

    choices.style.display = "flex";

    startBtn.style.display = "none";

    startFaceTracking();

  } catch (error) {

    console.error("KAMERA XƏTASI:", error);

    statusText.innerText =
      "🔴 KAMERA XƏTASI";

    dot.style.background = "red";

    gazeText.innerText =
      error.message || "Kamera açıla bilmədi.";

  }

}


/* =========================
   GÖZ / ÜZ İZLƏMƏ
========================= */

async function startFaceTracking() {

  try {

    gazeText.innerText =
      "👁️ Göz izləmə sistemi hazırlanır...";

    faceMesh = new FaceMesh({
      locateFile: function(file) {
        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;
      }
    });

    faceMesh.setOptions({

      maxNumFaces: 1,

      refineLandmarks: true,

      minDetectionConfidence: 0.5,

      minTrackingConfidence: 0.5

    });


    faceMesh.onResults(function(results) {

      if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
      ) {

        const face =
          results.multiFaceLandmarks[0];

        const leftEye = face[468];
        const rightEye = face[473];

        statusText.innerText =
          "🟢 ÜZ VƏ GÖZLƏR AŞKARLANDI";

        dot.style.background = "#20b957";

        gazeText.innerText =
          "👁️ Gözlər izlənilir";

        /*
          Sonrakı mərhələdə burada
          baxış istiqamətini HƏ / YOX /
          OTAĞA GƏL düymələrinə bağlayacağıq.
        */

      } else {

        statusText.innerText =
          "🟡 Kamera işləyir — üz axtarılır";

        dot.style.background = "#ff9800";

        gazeText.innerText =
          "Kameraya tərəf baxın.";

      }

    });


    /*
      Kameradan kadrları FaceMesh-ə göndəririk.
    */

    async function processFrame() {

      if (!video.videoWidth) {

        requestAnimationFrame(processFrame);

        return;
      }

      await faceMesh.send({
        image: video
      });

      requestAnimationFrame(processFrame);
    }

    processFrame();

  } catch (error) {

    console.error("GÖZ İZLƏMƏ XƏTASI:", error);

    statusText.innerText =
      "🟠 Kamera işləyir, amma göz izləmə başladıla bilmədi.";

    dot.style.background = "#ff9800";

    gazeText.innerText =
      "Göz izləmə xətası: " +
      (error.message || "naməlum xəta");

  }

}


/* =========================
   BAŞLAT
========================= */

startBtn.addEventListener("click", function() {

  startCamera();

});


/* =========================
   TEST ÜÇÜN TOXUNMA
========================= */

document.getElementById("yes").addEventListener(
  "click",
  function() {
    selectButton(this);
  }
);

document.getElementById("call").addEventListener(
  "click",
  function() {
    selectButton(this);
  }
);

document.getElementById("no").addEventListener(
  "click",
  function() {
    selectButton(this);
  }
);

</script>

</body>
</html>
