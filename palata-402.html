<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDELIN — PALATA 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef5fb;
  font-family:Arial,sans-serif;
  color:#172b4d;
  text-align:center;
}

header{
  background:#1976b9;
  color:white;
  padding:24px 10px;
  font-size:30px;
  font-weight:bold;
}

.status{
  background:white;
  margin:25px 0;
  padding:18px;
  border-radius:20px;
  font-size:19px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.dot{
  display:inline-block;
  width:17px;
  height:17px;
  border-radius:50%;
  background:red;
  margin-right:8px;
}

.main{
  max-width:900px;
  margin:auto;
  padding:10px 20px 40px;
}

h1{
  font-size:30px;
}

.info{
  font-size:20px;
  line-height:1.5;
  margin:20px auto 30px;
  max-width:700px;
}

#startBtn{
  width:90%;
  max-width:650px;
  padding:24px;
  border:0;
  border-radius:22px;
  background:#1976b9;
  color:white;
  font-size:23px;
  font-weight:bold;
}

#calibration{
  display:none;
}

#calibrationText{
  font-size:23px;
  font-weight:bold;
  margin:20px;
}

#progress{
  font-size:18px;
  color:#666;
}

#calibrationDot{
  position:fixed;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ff1744;
  border:5px solid white;
  box-shadow:0 0 20px rgba(0,0,0,.5);
  display:none;
  z-index:99999;
  transform:translate(-50%,-50%);
}

#choices{
  display:none;
  flex-direction:column;
  gap:18px;
  margin-top:30px;
}

.choice{
  border:0;
  border-radius:25px;
  min-height:145px;
  color:white;
  font-size:34px;
  font-weight:bold;
  box-shadow:0 5px 12px rgba(0,0,0,.12);
  transition:.15s;
}

#yes{
  background:#22a447;
}

#call{
  background:#e53935;
}

#no{
  background:#555;
}

.selected{
  outline:8px solid #ffd600;
  transform:scale(1.02);
}

#gazeText{
  margin-top:25px;
  font-size:20px;
  min-height:35px;
}

.warning{
  margin-top:40px;
  color:#777;
  font-size:14px;
}

@media(min-width:650px){

  #choices{
    flex-direction:row;
  }

  .choice{
    flex:1;
    min-height:190px;
  }
}
</style>
</head>

<body>

<header>
🏥 MEDELIN — PALATA 402
</header>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="statusText">Sistem hazır deyil</span>
</div>

<div class="main">

<h1>👁️ Gözlə idarəetmə</h1>

<div class="info">
Kamera sizi görür, amma kamera görüntüsü ekranda göstərilmir.
<br>
Başladın və ekrandakı nöqtələrə gözünlə bax.
</div>

<button id="startBtn">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="calibration">

  <div id="calibrationText">
    🎯 Qırmızı nöqtəyə bax
  </div>

  <div id="progress">
    Kalibrasiya: 0 / 9
  </div>

</div>

<div id="choices">

  <button class="choice" id="yes">
    HƏ
  </button>

  <button class="choice" id="call">
    🚨 OTAĞA GƏL
  </button>

  <button class="choice" id="no">
    YOX
  </button>

</div>

<div id="gazeText"></div>

<div class="warning">
Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
</div>

</div>

<div id="calibrationDot"></div>


<script>

/* =====================================================
   SƏSİ TAM SÖNDÜR
===================================================== */

if("speechSynthesis" in window){
  speechSynthesis.cancel();
}


/* =====================================================
   ELEMENTLƏR
===================================================== */

const startBtn =
  document.getElementById("startBtn");

const statusText =
  document.getElementById("statusText");

const dot =
  document.getElementById("dot");

const calibration =
  document.getElementById("calibration");

const calibrationDot =
  document.getElementById("calibrationDot");

const calibrationText =
  document.getElementById("calibrationText");

const progress =
  document.getElementById("progress");

const choices =
  document.getElementById("choices");

const gazeText =
  document.getElementById("gazeText");


/* =====================================================
   DƏYİŞƏNLƏR
===================================================== */

let calibrationIndex = 0;

let calibrated = false;

let currentButton = null;

let gazeStart = 0;

let lastSelection = 0;

let calibrationTimer = null;


/* =====================================================
   WEBGAZER PARAMETRLƏRİ
===================================================== */

function configureWebGazer(){

  webgazer
    .setRegression("ridge")
    .setTracker("TFFacemesh")
    .saveDataAcrossSessions(false)
    .applyKalmanFilter(true);


  /*
    Kamera görüntüsünü göstərmə.
  */

  webgazer.showVideo(false);
  webgazer.showFaceOverlay(false);
  webgazer.showFaceFeedbackBox(false);
  webgazer.showPredictionPoints(false);


  /*
    Göz məlumatı gələndə.
  */

  webgazer.setGazeListener(
    function(data){

      if(!data) return;

      /*
        WebGazer-in verdiyi ekran
        koordinatları.
      */

      const x = data.x;
      const y = data.y;

      if(calibrated){

        checkGaze(x,y);

      }

    }
  );

}


/* =====================================================
   BAŞLAT
===================================================== */

async function startSystem(){

  try{

    statusText.innerText =
      "🟡 Kamera açılır...";

    dot.style.background =
      "#ff9800";


    /*
      Əvvəlki kalibrasiyanı təmizlə.
    */

    webgazer.clearData();


    configureWebGazer();


    await webgazer.begin();


    /*
      Kamera hazırdır.
    */

    statusText.innerText =
      "🟢 Kamera işləyir";

    dot.style.background =
      "#20b957";


    startBtn.style.display =
      "none";


    gazeText.innerText =
      "👁️ Üzünü kameraya düz tut";


    /*
      Kamera stabil olsun deyə
      2 saniyə gözləyirik.
    */

    setTimeout(
      startCalibration,
      2000
    );


  }catch(error){

    console.error(error);

    statusText.innerText =
      "🔴 Kamera açıla bilmədi";

    dot.style.background =
      "red";

    gazeText.innerText =
      "Kamera icazəsini yoxla.";

  }

}


/* =====================================================
   9 NÖQTƏLİ KALİBRASİYA
===================================================== */

const points = [

  {x:10,y:12},
  {x:50,y:12},
  {x:90,y:12},

  {x:10,y:50},
  {x:50,y:50},
  {x:90,y:50},

  {x:10,y:88},
  {x:50,y:88},
  {x:90,y:88}

];


/* =====================================================
   KALİBRASİYA BAŞLA
===================================================== */

function startCalibration(){

  calibrated = false;

  calibrationIndex = 0;

  calibration.style.display =
    "block";

  choices.style.display =
    "none";

  calibrationDot.style.display =
    "block";


  showCalibrationPoint();

}


/* =====================================================
   NÖQTƏ GÖSTƏR
===================================================== */

function showCalibrationPoint(){

  if(
    calibrationIndex >=
    points.length
  ){

    finishCalibration();

    return;
  }


  const p =
    points[calibrationIndex];


  calibrationDot.style.left =
    p.x + "%";

  calibrationDot.style.top =
    p.y + "%";


  progress.innerText =
    "Kalibrasiya: " +
    (calibrationIndex + 1) +
    " / 9";


  calibrationText.innerText =
    "🎯 Qırmızı nöqtəyə bax";


  /*
    Nöqtəyə 2 saniyə bax.
    Hər 150 ms WebGazer-ə
    həmin ekran nöqtəsini
    training məlumatı kimi veririk.
  */

  let elapsed = 0;


  clearInterval(
    calibrationTimer
  );


  calibrationTimer =
    setInterval(function(){

      webgazer.recordScreenPosition(
        window.innerWidth * p.x / 100,
        window.innerHeight * p.y / 100,
        "click"
      );


      elapsed += 150;


      if(elapsed >= 2200){

        clearInterval(
          calibrationTimer
        );


        calibrationIndex++;

        showCalibrationPoint();

      }

    },150);

}


/* =====================================================
   KALİBRASİYA BİTDİ
===================================================== */

function finishCalibration(){

  clearInterval(
    calibrationTimer
  );


  calibrationDot.style.display =
    "none";

  calibration.style.display =
    "none";


  calibrated = true;


  choices.style.display =
    "flex";


  statusText.innerText =
    "🟢 GÖZ İDARƏSİ HAZIRDIR";

  dot.style.background =
    "#20b957";


  gazeText.innerText =
    "👁️ Bir düyməyə bax və 1.5 saniyə saxla.";

}


/* =====================================================
   BAXIŞI YOXLAYIR
===================================================== */

function checkGaze(x,y){

  if(!calibrated) return;


  let found = null;


  document
    .querySelectorAll(".choice")
    .forEach(function(button){

      const r =
        button.getBoundingClientRect();


      /*
        Bir az böyük toxunma sahəsi.
      */

      const extra = 25;


      if(
        x >= r.left - extra &&
        x <= r.right + extra &&
        y >= r.top - extra &&
        y <= r.bottom + extra
      ){

        found = button;

      }

    });


  /*
    Başqa düyməyə keçibsə,
    sayğacı sıfırla.
  */

  if(found !== currentButton){

    currentButton = found;

    gazeStart =
      performance.now();


    document
      .querySelectorAll(".choice")
      .forEach(function(button){

        button.classList.remove(
          "selected"
        );

      });

  }


  if(!found){

    gazeText.innerText =
      "👁️ Seçimə bax";

    return;

  }


  found.classList.add(
    "selected"
  );


  const elapsed =
    performance.now() -
    gazeStart;


  const remaining =
    Math.max(
      0,
      1.5 -
      elapsed / 1000
    );


  gazeText.innerText =
    "👁️ " +
    found.innerText +
    " — " +
    remaining.toFixed(1) +
    " saniyə";


  /*
    1.5 saniyə baxış.
  */

  if(
    elapsed >= 1500 &&
    performance.now() -
    lastSelection > 2500
  ){

    selectButton(found);

  }

}


/* =====================================================
   SEÇİM
===================================================== */

function selectButton(button){

  lastSelection =
    performance.now();


  /*
    Heç bir səs çıxarmırıq.
  */

  document
    .querySelectorAll(".choice")
    .forEach(function(b){

      b.classList.remove(
        "selected"
      );

    });


  button.classList.add(
    "selected"
  );


  gazeText.innerText =
    "✅ SEÇİLDİ: " +
    button.innerText;


  if(button.id === "call"){

    console.log(
      "PALATA 402 → OTAĞA GƏL"
    );

  }


  setTimeout(function(){

    button.classList.remove(
      "selected"
    );

  },1200);

}


/* =====================================================
   START BUTTON
===================================================== */

startBtn.addEventListener(
  "click",
  startSystem
);


/* =====================================================
   ƏL İLƏ TEST
===================================================== */

document
  .getElementById("yes")
  .addEventListener(
    "click",
    function(){

      selectButton(this);

    }
  );


document
  .getElementById("call")
  .addEventListener(
    "click",
    function(){

      selectButton(this);

    }
  );


document
  .getElementById("no")
  .addEventListener(
    "click",
    function(){

      selectButton(this);

    }
  );

</script>

</body>
</html>
