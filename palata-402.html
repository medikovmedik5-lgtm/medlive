<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palata 402</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #f4f7f8;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #17343b;
}

#app {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.status {
    font-size: 17px;
    color: #60777d;
    margin-bottom: 30px;
    text-align: center;
}

#cameraBox {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 160px;
    height: 120px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    opacity: 0;
    pointer-events: none;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#choices {
    width: 100%;
    display: none;
    flex-direction: column !important;
    align-items: center;
    justify-content: center;
    gap: 70px;
}

.choice {
    width: 80%;
    max-width: 500px;
    height: 190px;
    border-radius: 30px;
    border: 3px solid #b8c8cc;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    font-weight: bold;
    transition: .15s;
}

.choice.active {
    border-color: #087f8c;
    box-shadow: 0 0 0 8px rgba(8,127,140,.12);
    transform: scale(1.03);
}

#yes {
    color: #087f8c;
}

#no {
    color: #8a4b4b;
}

#start {
    border: none;
    background: #087f8c;
    color: white;
    padding: 18px 45px;
    border-radius: 14px;
    font-size: 20px;
    cursor: pointer;
}

#message {
    margin-top: 25px;
    font-size: 20px;
    min-height: 30px;
    text-align: center;
}

#error {
    color: #b3261e;
    margin-top: 15px;
    text-align: center;
    max-width: 500px;
}

#calibration {
    display: none;
    position: fixed;
    inset: 0;
    background: #f4f7f8;
    z-index: 20;
    align-items: center;
    justify-content: center;
}

#dot {
    width: 28px;
    height: 28px;
    background: red;
    border-radius: 50%;
    position: absolute;
}

#calText {
    position: absolute;
    top: 35px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 20px;
    color: #17343b;
}
</style>
</head>

<body>

<div id="app">

    <h1>Palata 402</h1>

    <div class="status" id="status">
        Göz sistemi hazır deyil
    </div>

    <button id="start">
        Göz sistemini başlat
    </button>

    <div id="error"></div>

    <div id="choices">

        <div class="choice" id="yes">
            HƏ
        </div>

        <div class="choice" id="no">
            YOX
        </div>

    </div>

    <div id="message"></div>

</div>

<div id="cameraBox">
    <video id="video" autoplay playsinline></video>
</div>

<div id="calibration">
    <div id="calText">Gözlərinizi qırmızı nöqtəyə yönəldin</div>
    <div id="dot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

const video = document.getElementById("video");
const startBtn = document.getElementById("start");
const statusText = document.getElementById("status");
const errorText = document.getElementById("error");

const calibration = document.getElementById("calibration");
const dot = document.getElementById("dot");
const calText = document.getElementById("calText");

const choices = document.getElementById("choices");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const message = document.getElementById("message");

let faceMesh;
let cameraStream;

let calibrationData = {
    up: [],
    center: [],
    down: []
};

let currentPosition = "center";
let candidate = null;
let candidateStart = 0;

const DWELL_TIME = 1200;

startBtn.onclick = async function() {

    errorText.innerText = "";
    startBtn.style.display = "none";

    statusText.innerText = "Kamera açılır...";

    try {

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });

        video.srcObject = cameraStream;

        await video.play();

        statusText.innerText = "Kamera açıldı. Göz sistemi hazırlanır...";

        await startFaceMesh();

        startCalibration();

    } catch (error) {

        console.error(error);

        statusText.innerText = "Göz sistemi açıla bilmədi";

        errorText.innerText =
            "Kameraya icazə verilmədi və ya kamera əlçatan deyil. " +
            "Brauzerin kamera icazəsini yoxlayın.";

        startBtn.style.display = "block";
        startBtn.innerText = "Yenidən yoxla";
    }
};


async function startFaceMesh() {

    faceMesh = new FaceMesh({
        locateFile: function(file) {
            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;
        }
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    await faceMesh.send({
        image: video
    });

    await new Promise(resolve => setTimeout(resolve, 300));

    statusText.innerText = "Üz və gözlər axtarılır...";

    processFrame();
}


async function processFrame() {

    if (!video.srcObject) return;

    try {
        await faceMesh.send({
            image: video
        });
    } catch(e) {
        console.log(e);
    }

    requestAnimationFrame(processFrame);
}


function onResults(results) {

    if (!results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0) {

        return;
    }

    const lm = results.multiFaceLandmarks[0];

    const leftEye = getEyeValue(
        lm[159],
        lm[145],
        lm[33],
        lm[133]
    );

    const rightEye = getEyeValue(
        lm[386],
        lm[374],
        lm[362],
        lm[263]
    );

    const vertical =
        (leftEye.vertical + rightEye.vertical) / 2;

    if (calibration.style.display === "flex") {

        collectCalibration(vertical);

    } else if (choices.style.display === "flex") {

        detectChoice(vertical);
    }
}


function getEyeValue(top, bottom, left, right) {

    const eyeHeight =
        Math.abs(top.y - bottom.y);

    const eyeWidth =
        Math.abs(left.x - right.x);

    const vertical =
        ((top.y + bottom.y) / 2);

    return {
        vertical: vertical,
        openness: eyeHeight / eyeWidth
    };
}


let calibrationStep = 0;
let calibrationTimer = null;

function startCalibration() {

    calibration.style.display = "flex";

    calibrationData.up = [];
    calibrationData.center = [];
    calibrationData.down = [];

    calibrationStep = 0;

    runCalibrationPoint();
}


function runCalibrationPoint() {

    const points = [
        {
            name: "up",
            x: window.innerWidth / 2,
            y: window.innerHeight * 0.20
        },
        {
            name: "center",
            x: window.innerWidth / 2,
            y: window.innerHeight * 0.50
        },
        {
            name: "down",
            x: window.innerWidth / 2,
            y: window.innerHeight * 0.80
        }
    ];

    if (calibrationStep >= points.length) {

        finishCalibration();
        return;
    }

    const p = points[calibrationStep];

    dot.style.left =
        (p.x - 14) + "px";

    dot.style.top =
        (p.y - 14) + "px";

    calText.innerText =
        "Gözlərinizi qırmızı nöqtəyə yönəldin";

    calibrationTimer = setTimeout(function() {

        calibrationStep++;

        runCalibrationPoint();

    }, 2200);
}


function collectCalibration(value) {

    const points = ["up", "center", "down"];

    const name = points[calibrationStep];

    if (!name) return;

    calibrationData[name].push(value);
}


function average(arr) {

    if (!arr.length) return 0;

    return arr.reduce((a,b) => a+b, 0) / arr.length;
}


function finishCalibration() {

    calibration.style.display = "none";

    statusText.innerText =
        "Göz sistemi aktivdir";

    choices.style.display = "flex";

    message.innerText =
        "Cavab vermək üçün gözlərinizi HƏ və ya YOX istiqamətinə yönəldin.";

    const up = average(calibrationData.up);
    const center = average(calibrationData.center);
    const down = average(calibrationData.down);

    console.log("Calibration:", {
        up,
        center,
        down
    });
}


function detectChoice(value) {

    const up = average(calibrationData.up);
    const center = average(calibrationData.center);
    const down = average(calibrationData.down);

    if (!up || !center || !down) return;

    /*
       Göz istiqamətinin şaquli hərəkətini hesablayırıq.
       HƏ yuxarı,
       YOX aşağı.
    */

    const rangeUp = Math.abs(center - up);
    const rangeDown = Math.abs(down - center);

    let position = "center";

    if (
        Math.abs(value - center) >
        Math.min(rangeUp, rangeDown) * 0.35
    ) {

        if (
            Math.abs(value - up) <
            Math.abs(value - down)
        ) {
            position = "up";
        } else {
            position = "down";
        }
    }

    if (position === "up") {

        yes.classList.add("active");
        no.classList.remove("active");

        handleDwell("yes");

    } else if (position === "down") {

        no.classList.add("active");
        yes.classList.remove("active");

        handleDwell("no");

    } else {

        yes.classList.remove("active");
        no.classList.remove("active");

        candidate = null;
    }
}


function handleDwell(target) {

    if (candidate !== target) {

        candidate = target;
        candidateStart = Date.now();

        return;
    }

    if (
        Date.now() - candidateStart >= DWELL_TIME
    ) {

        selectAnswer(target);

        candidate = null;
    }
}


function selectAnswer(answer) {

    if (answer === "yes") {

        message.innerText = "HƏ seçildi";
        yes.classList.add("active");

    } else {

        message.innerText = "YOX seçildi";
        no.classList.add("active");
    }

    /*
       Sonradan burada nurse panelinə
       göndərmə sistemi əlavə ediləcək.
    */

    setTimeout(function() {

        yes.classList.remove("active");
        no.classList.remove("active");

        message.innerText =
            "Növbəti cavab üçün gözlərinizi yenidən istiqamətləndirin.";

    }, 2000);
}

</script>

</body>
</html>
