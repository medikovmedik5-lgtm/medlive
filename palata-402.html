<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f7fa;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:65px;
    background:#0b7285;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

#status{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

#start{
    display:block;
    margin:20px auto;
    padding:20px 28px;
    border:0;
    border-radius:18px;
    background:#0b7285;
    color:white;
    font-size:20px;
    font-weight:bold;
}

#video{
    display:none;
}

#calibration{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
}

.point{
    position:absolute;

    width:32px;
    height:32px;

    background:red;

    border:4px solid white;

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 0 5px
        rgba(255,0,0,.20);
}

#choices{
    display:none;

    height:
        calc(100vh - 125px);

    padding:15px 20px;

    gap:18px;

    align-items:center;
    justify-content:center;

    flex-direction:column;
}

.choice{
    width:88vw;
    max-width:520px;

    height:120px;

    border:0;

    border-radius:25px;

    color:white;

    font-size:38px;

    font-weight:bold;

    transition:
        transform .15s,
        box-shadow .15s;
}

.choice.active{
    transform:scale(1.04);

    box-shadow:
        0 0 0 7px
        rgba(0,0,0,.20);
}

.yes{
    background:#198754;
}

.call{
    background:#dc3545;
}

.no{
    background:#6c757d;
}

#progress{
    display:none;

    position:fixed;

    left:10%;
    bottom:15px;

    width:80%;
    height:12px;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;

    z-index:100;
}

#bar{
    width:0%;
    height:100%;
    background:#0b7285;
}

</style>
</head>

<body>

<header>
MEDELIN — PALATA 402
</header>

<div id="status">
Sistem hazır deyil
</div>

<button id="start">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =====================
     KALİBRASİYA
===================== -->

<div id="calibration">

    <div class="point"
         style="left:10%;top:15%">
    </div>

    <div class="point"
         style="left:50%;top:15%">
    </div>

    <div class="point"
         style="left:90%;top:15%">
    </div>

    <div class="point"
         style="left:10%;top:50%">
    </div>

    <div class="point"
         style="left:50%;top:50%">
    </div>

    <div class="point"
         style="left:90%;top:50%">
    </div>

    <div class="point"
         style="left:10%;top:85%">
    </div>

    <div class="point"
         style="left:50%;top:85%">
    </div>

    <div class="point"
         style="left:90%;top:85%">
    </div>

</div>


<!-- =====================
     DÜYMƏLƏR
===================== -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">

        HƏ

    </button>

    <button
        class="choice call"
        data-action="CALL">

        🚨 OTAĞA GƏL

    </button>

    <button
        class="choice no"
        data-action="NO">

        YOX

    </button>

</div>


<div id="progress">
    <div id="bar"></div>
</div>


<script>

/* =========================
   ELEMENTLƏR
========================= */

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("start");

const statusBox =
    document.getElementById("status");

const calibration =
    document.getElementById("calibration");

const choices =
    document.getElementById("choices");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const buttons =
    [...document.querySelectorAll(".choice")];


/* =========================
   FACE MESH
========================= */

const faceMesh =
    new FaceMesh({

        locateFile:
            file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

    });


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});


/* =========================
   DƏYİŞƏNLƏR
========================= */

let camera = null;

let running = false;

let calibrationData = [];

let currentSamples = [];

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStart = 0;

let locked = false;


/* =========================
   GÖZ KOORDİNATI
========================= */

function getEyePosition(landmarks){

    /*
       Sağ göz iris nöqtələri
       468-472

       Sol göz iris nöqtələri
       473-477
    */

    const irisPoints = [
        468,
        469,
        470,
        471,
        472,
        473,
        474,
        475,
        476,
        477
    ];


    let x = 0;
    let y = 0;
    let count = 0;


    for(
        const index of irisPoints
    ){

        if(!landmarks[index]){
            continue;
        }

        x += landmarks[index].x;
        y += landmarks[index].y;

        count++;

    }


    if(count === 0){
        return null;
    }


    return {
        x:x/count,
        y:y/count
    };

}


/* =========================
   ÜZ NƏTİCƏSİ
========================= */

faceMesh.onResults(
    results => {

        if(
            !running ||
            !results.multiFaceLandmarks ||
            results.multiFaceLandmarks.length === 0
        ){

            return;

        }


        const landmarks =
            results.multiFaceLandmarks[0];


        const eye =
            getEyePosition(landmarks);


        if(!eye){
            return;
        }


        /*
           KALİBRASİYA GEDİR
        */

        if(
            calibrationData.collecting
        ){

            currentSamples.push({
                x:eye.x,
                y:eye.y
            });

            return;

        }


        /*
           NORMAL GÖZ İZLƏMƏ
        */

        if(
            calibrationData.length >= 3
        ){

            const position =
                predictGaze(
                    eye.x,
                    eye.y
                );


            updateGaze(
                position.x,
                position.y
            );

        }

    }
);


/* =========================
   START
========================= */

async function startSystem(){

    startButton.style.display =
        "none";

    statusBox.innerText =
        "Kamera açılır...";


    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        statusBox.innerText =
            "Kamera hazırdır";


        running = true;


        camera =
            new Camera(
                video,
                {
                    onFrame:
                    async()=>{
                        await faceMesh.send({
                            image:video
                        });
                    },

                    width:640,

                    height:480

                }
            );


        camera.start();


        setTimeout(
            startCalibration,
            1000
        );


    }catch(error){

        console.error(error);

        statusBox.innerText =
            "Kamera açıla bilmədi";

        startButton.style.display =
            "block";

    }

}


/* =========================
   KALİBRASİYA
========================= */

function startCalibration(){

    calibration.style.display =
        "block";


    const points =
        [
            ...document.querySelectorAll(".point")
        ];


    let index = 0;


    function nextPoint(){

        if(
            index >= points.length
        ){

            calibrationData.collecting =
                false;


            calibration.style.display =
                "none";


            choices.style.display =
                "flex";


            progress.style.display =
                "block";


            statusBox.innerText =
                "Hazırdır — düyməyə bax";


            return;

        }


        const point =
            points[index];


        const rect =
            point.getBoundingClientRect();


        const targetX =
            rect.left +
            rect.width / 2;


        const targetY =
            rect.top +
            rect.height / 2;


        currentSamples = [];


        calibrationData.collecting =
            true;


        statusBox.innerText =
            "Nöqtəyə bax  " +
            (index + 1) +
            " / " +
            points.length;


        setTimeout(()=>{

            calibrationData.collecting =
                false;


            /*
               Nümunələrdən orta
               göz koordinatı
            */

            if(
                currentSamples.length > 5
            ){

                let sx = 0;
                let sy = 0;


                for(
                    const sample
                    of currentSamples
                ){

                    sx += sample.x;
                    sy += sample.y;

                }


                sx /=
                    currentSamples.length;

                sy /=
                    currentSamples.length;


                calibrationData.push({

                    eyeX:sx,
                    eyeY:sy,

                    screenX:targetX,
                    screenY:targetY

                });

            }


            index++;


            setTimeout(
                nextPoint,
                250
            );


        },1800);

    }


    nextPoint();

}


/*
   calibrationData həm massiv,
   həm də collecting property
*/

calibrationData.collecting =
    false;


/* =========================
   GÖZÜ EKRANA XƏRİTƏLƏ
========================= */

function predictGaze(x,y){

    /*
       Ən yaxın 3 kalibrasiya
       nöqtəsini tapırıq.
    */

    const distances =
        calibrationData.map(
            p => {

                const dx =
                    x - p.eyeX;

                const dy =
                    y - p.eyeY;

                return {
                    p:p,

                    d:
                    Math.sqrt(
                        dx*dx +
                        dy*dy
                    )
                };

            }
        );


    distances.sort(
        (a,b)=>a.d-b.d
    );


    const nearest =
        distances.slice(0,3);


    let totalWeight = 0;

    let sx = 0;
    let sy = 0;


    for(
        const item of nearest
    ){

        const weight =
            1 /
            Math.max(
                item.d,
                0.0001
            );


        sx +=
            item.p.screenX *
            weight;

        sy +=
            item.p.screenY *
            weight;


        totalWeight +=
            weight;

    }


    sx /=
        totalWeight;

    sy /=
        totalWeight;


    return {
        x:sx,
        y:sy
    };

}


/* =========================
   GÖZÜ YUMŞALT
========================= */

function updateGaze(x,y){

    if(
        gazeX === null
    ){

        gazeX = x;
        gazeY = y;

    }else{

        /*
           Çox oynamağın qarşısını alır
        */

        gazeX +=
            (x-gazeX) * 0.12;

        gazeY +=
            (y-gazeY) * 0.12;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =========================
   DÜYMƏNİ TAP
========================= */

function checkButton(x,y){

    if(locked){
        return;
    }


    let target = null;

    let bestDistance =
        Infinity;


    for(
        const button of buttons
    ){

        const rect =
            button.getBoundingClientRect();


        /*
           Düymənin mərkəzi
        */

        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;


        /*
           Düymənin içindədirsə
        */

        const inside =
            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom;


        if(!inside){
            continue;
        }


        const dx =
            x-cx;

        const dy =
            y-cy;


        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        if(
            distance <
            bestDistance
        ){

            bestDistance =
                distance;

            target =
                button;

        }

    }


    /*
       Düyməyə baxmır
    */

    if(!target){

        currentButton =
            null;

        lookStart =
            0;

        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );

        bar.style.width =
            "0%";

        return;

    }


    /*
       Yeni düymə
    */

    if(
        target !==
        currentButton
    ){

        currentButton =
            target;

        lookStart =
            Date.now();


        buttons.forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        target.classList.add(
            "active"
        );


        bar.style.width =
            "0%";


        return;

    }


    /*
       Eyni düyməyə baxır
    */

    const elapsed =
        Date.now() -
        lookStart;


    const percent =
        Math.min(
            100,
            elapsed / 1800 * 100
        );


    bar.style.width =
        percent + "%";


    /*
       1.8 saniyə baxış
    */

    if(
        elapsed >= 1800
    ){

        selectButton(
            target
        );

    }

}


/* =========================
   SEÇİM
========================= */

function selectButton(button){

    if(locked){
        return;
    }


    locked = true;


    const action =
        button.dataset.action;


    if(
        action === "YES"
    ){

        statusBox.innerText =
            "✅ HƏ";

    }


    if(
        action === "CALL"
    ){

        statusBox.innerText =
            "🚨 PALATA 402 — OTAĞA GƏL";

    }


    if(
        action === "NO"
    ){

        statusBox.innerText =
            "❌ YOX";

    }


    console.log(
        "PALATA 402 →",
        action
    );


    bar.style.width =
        "100%";


    setTimeout(()=>{

        locked = false;

        currentButton =
            null;

        lookStart =
            0;

        gazeX =
            null;

        gazeY =
            null;


        button.classList.remove(
            "active"
        );


        bar.style.width =
            "0%";


        statusBox.innerText =
            "Hazırdır — düyməyə bax";

    },1200);

}


/* =========================
   BAŞLAT
========================= */

startButton.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
