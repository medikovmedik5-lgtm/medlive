<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef5fb;
  font-family: Arial, sans-serif;
  color: #172b4d;
  text-align: center;
}

header {
  background: #1976b9;
  color: white;
  padding: 24px 10px;
  font-size: 30px;
  font-weight: bold;
}

.status {
  background: white;
  margin: 25px 0;
  padding: 18px;
  border-radius: 20px;
  font-size: 19px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.dot {
  display: inline-block;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: red;
  margin-right: 8px;
}

.main {
  max-width: 900px;
  margin: auto;
  padding: 10px 20px 40px;
}

h1 {
  font-size: 30px;
}

.info {
  font-size: 19px;
  line-height: 1.5;
  margin: 20px auto 30px;
  max-width: 700px;
}

#startBtn {
  width: 90%;
  max-width: 650px;
  padding: 24px;
  border: 0;
  border-radius: 22px;
  background: #1976b9;
  color: white;
  font-size: 23px;
  font-weight: bold;
}

#calibration {
  display: none;
}

#calibrationText {
  font-size: 23px;
  font-weight: bold;
  margin: 20px;
}

#progress {
  font-size: 18px;
  color: #666;
}

#calibrationDot {
  position: fixed;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #ff1744;
  border: 5px solid white;
  box-shadow: 0 0 20px rgba(0,0,0,.5);
  display: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
}

#choices {
  display: none;
  flex-direction: column;
  gap: 18px;
  margin-top: 30px;
}

.choice {
  border: 0;
  border-radius: 25px;
  min-height: 145px;
  color: white;
  font-size: 34px;
  font-weight: bold;
  box-shadow: 0 5px 12px rgba(0,0,0,.12);
  transition: .15s;
}

#yes {
  background: #22a447;
}

#call {
  background: #e53935;
}

#no {
  background: #555;
}

.selected {
  outline: 8px solid #ffd600;
  transform: scale(1.02);
}

#gazeText {
  margin-top: 25px;
  font-size: 20px;
  min-height: 35px;
}

.warning {
  margin-top: 40px;
  color: #777;
  font-size: 14px;
}

/* Kamera işləyir, amma görünmür */
#camera {
  position: fixed;
  width: 1px;
  height: 1px;
  left: -9999px;
  top: -9999px;
  opacity: 0;
  pointer-events: none;
}

@media (min-width: 650px) {

  #choices {
    flex-direction: row;
  }

  .choice {
    flex: 1;
    min-height: 190px;
  }
}
</style>
</head>

<body>

<header>
🏥 MEDELIN — PALATA 402
</header>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="statusText">Sistem hazır deyil</span>
</div>

<div class="main">

<h1>👁️ Gözlə idarəetmə</h1>

<div class="info">
Kamera sizi görür, amma görüntünüz ekranda göstərilmir.
<br>
Əvvəl sistemi başladın və kalibrasiyanı tamamlayın.
</div>

<button id="startBtn">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>

<div id="calibration">

  <div id="calibrationText">
    🎯 Qırmızı nöqtəyə baxın
  </div>

  <div id="progress">
    Kalibrasiya hazırlanır...
  </div>

</div>

<div id="choices">

  <button class="choice" id="yes">
    HƏ
  </button>

  <button class="choice" id="call">
    🚨 OTAĞA GƏL
  </button>

  <button class="choice" id="no">
    YOX
  </button>

</div>

<div id="gazeText"></div>

<div class="warning">
Prototip sistemdir. Tibbi istifadə üçün nəzərdə tutulmayıb.
</div>

</div>

<div id="calibrationDot"></div>

<video id="camera" autoplay playsinline muted></video>

<script>

/* =====================================================
   ELEMENTLƏR
===================================================== */

const video = document.getElementById("camera");

const startBtn =
  document.getElementById("startBtn");

const choices =
  document.getElementById("choices");

const statusText =
  document.getElementById("statusText");

const dot =
  document.getElementById("dot");

const calibration =
  document.getElementById("calibration");

const calibrationDot =
  document.getElementById("calibrationDot");

const calibrationText =
  document.getElementById("calibrationText");

const progress =
  document.getElementById("progress");

const gazeText =
  document.getElementById("gazeText");


/* =====================================================
   DƏYİŞƏNLƏR
===================================================== */

let faceMesh = null;

let stream = null;

let currentFeature = null;

let calibrated = false;

let calibrationIndex = 0;

let collecting = false;

let calibrationModel = [];

let currentButton = null;

let gazeStartTime = 0;

let lastSelectionTime = 0;


/* =====================================================
   KALİBRASİYA NÖQTƏLƏRİ
===================================================== */

const calibrationPoints = [

  { x: 10, y: 12 },
  { x: 50, y: 12 },
  { x: 90, y: 12 },

  { x: 10, y: 50 },
  { x: 50, y: 50 },
  { x: 90, y: 50 },

  { x: 10, y: 88 },
  { x: 50, y: 88 },
  { x: 90, y: 88 }

];


/* =====================================================
   GÖZ FEATURE
===================================================== */

function getEyeFeature(face) {

  const leftIris = face[468];
  const rightIris = face[473];

  const leftOuter = face[33];
  const leftInner = face[133];

  const leftTop = face[159];
  const leftBottom = face[145];

  const rightOuter = face[362];
  const rightInner = face[263];

  const rightTop = face[386];
  const rightBottom = face[374];


  const leftWidth =
    leftInner.x - leftOuter.x;

  const rightWidth =
    rightInner.x - rightOuter.x;

  const leftHeight =
    leftBottom.y - leftTop.y;

  const rightHeight =
    rightBottom.y - rightTop.y;


  if (
    Math.abs(leftWidth) < 0.002 ||
    Math.abs(rightWidth) < 0.002 ||
    Math.abs(leftHeight) < 0.002 ||
    Math.abs(rightHeight) < 0.002
  ) {
    return null;
  }


  const leftX =
    (leftIris.x - leftOuter.x) /
    leftWidth;

  const leftY =
    (leftIris.y - leftTop.y) /
    leftHeight;


  const rightX =
    (rightIris.x - rightOuter.x) /
    rightWidth;

  const rightY =
    (rightIris.y - rightTop.y) /
    rightHeight;


  return [
    leftX,
    leftY,
    rightX,
    rightY
  ];
}


/* =====================================================
   ORTA GÖZ MƏLUMATI
===================================================== */

function averageFeatures(samples) {

  if (samples.length === 0) {
    return null;
  }

  const result = [0, 0, 0, 0];

  for (const sample of samples) {

    for (let i = 0; i < 4; i++) {

      result[i] += sample[i];

    }

  }

  for (let i = 0; i < 4; i++) {

    result[i] /= samples.length;

  }

  return result;
}


/* =====================================================
   MƏSAFƏ
===================================================== */

function featureDistance(a, b) {

  let total = 0;

  for (let i = 0; i < 4; i++) {

    const difference =
      a[i] - b[i];

    total +=
      difference * difference;

  }

  return Math.sqrt(total);
}


/* =====================================================
   KALİBRASİYA BAŞLA
===================================================== */

function startCalibration() {

  calibrated = false;

  calibrationIndex = 0;

  calibrationModel = [];

  calibration.style.display = "block";

  choices.style.display = "none";

  calibrationDot.style.display = "block";

  showCalibrationPoint();

}


/* =====================================================
   NÖQTƏ GÖSTƏR
===================================================== */

function showCalibrationPoint() {

  if (
    calibrationIndex >=
    calibrationPoints.length
  ) {

    finishCalibration();

    return;
  }


  const point =
    calibrationPoints[calibrationIndex];


  calibrationDot.style.left =
    point.x + "%";

  calibrationDot.style.top =
    point.y + "%";


  progress.innerText =
    "Kalibrasiya: " +
    (calibrationIndex + 1) +
    " / " +
    calibrationPoints.length;


  calibrationText.innerText =
    "🎯 Qırmızı nöqtəyə baxın";


  collecting = false;


  /*
    Bir az gözləyirik ki,
    göz nöqtəyə yerləşsin.
  */

  setTimeout(() => {

    collectCalibrationSamples(point);

  }, 700);

}


/* =====================================================
   DAVAMLI NÜMUNƏ TOPLA
===================================================== */

function collectCalibrationSamples(point) {

  collecting = true;

  const samples = [];

  const start =
    performance.now();


  function collect() {

    const elapsed =
      performance.now() - start;


    if (elapsed >= 1800) {

      collecting = false;


      const average =
        averageFeatures(samples);


      if (average) {

        calibrationModel.push({

          feature: average,

          x:
            window.innerWidth *
            point.x / 100,

          y:
            window.innerHeight *
            point.y / 100

        });

      }


      calibrationIndex++;

      showCalibrationPoint();

      return;
    }


    if (currentFeature) {

      samples.push(
        [...currentFeature]
      );

    }


    requestAnimationFrame(collect);

  }


  collect();

}


/* =====================================================
   KALİBRASİYA BİTİR
===================================================== */

function finishCalibration() {

  calibrationDot.style.display = "none";

  calibration.style.display = "none";


  if (calibrationModel.length < 7) {

    calibrated = false;

    statusText.innerText =
      "🔴 Kalibrasiya alınmadı";

    dot.style.background = "red";

    gazeText.innerText =
      "Üzünüzü kameraya düz tutun və yenidən başlayın.";

    startBtn.style.display = "block";

    return;
  }


  calibrated = true;

  choices.style.display = "flex";

  statusText.innerText =
    "🟢 Göz idarəsi hazırdır";

  dot.style.background =
    "#20b957";

  gazeText.innerText =
    "👁️ İndi seçimə baxın.";

}


/* =====================================================
   GÖZ BAXIŞINI HESABLA
===================================================== */

function estimateGaze(feature) {

  if (!calibrated) {
    return;
  }

  if (!calibrationModel.length) {
    return;
  }


  /*
    Ən yaxın 3 kalibrasiya nöqtəsini tapırıq.
  */

  const distances =
    calibrationModel.map(point => {

      return {

        point: point,

        distance:
          featureDistance(
            feature,
            point.feature
          )

      };

    });


  distances.sort(
    (a, b) =>
      a.distance - b.distance
  );


  const nearest =
    distances.slice(0, 3);


  let totalWeight = 0;

  let x = 0;

  let y = 0;


  nearest.forEach(item => {

    const weight =
      1 / (item.distance + 0.05);

    totalWeight += weight;

    x +=
      item.point.x *
      weight;

    y +=
      item.point.y *
      weight;

  });


  if (totalWeight === 0) {
    return;
  }


  x /= totalWeight;

  y /= totalWeight;


  /*
    Baxışı yumşaldırırıq.
    Bu, göz nöqtəsinin titrəməsini azaldır.
  */

  if (!window.smoothGaze) {

    window.smoothGaze = {
      x: x,
      y: y
    };

  } else {

    window.smoothGaze.x =
      window.smoothGaze.x * 0.72 +
      x * 0.28;

    window.smoothGaze.y =
      window.smoothGaze.y * 0.72 +
      y * 0.28;

  }


  checkGazeButton(
    window.smoothGaze.x,
    window.smoothGaze.y
  );

}


/* =====================================================
   HANSI DÜYMƏYƏ BAXIR?
===================================================== */

function checkGazeButton(x, y) {

  let found = null;


  document.querySelectorAll(".choice")
  .forEach(button => {

    const rect =
      button.getBoundingClientRect();


    /*
      Düymənin kənarına bir az
      tolerantlıq veririk.
    */

    const padding = 20;


    if (
      x >= rect.left - padding &&
      x <= rect.right + padding &&
      y >= rect.top - padding &&
      y <= rect.bottom + padding
    ) {

      found = button;

    }

  });


  if (found !== currentButton) {

    currentButton = found;

    gazeStartTime =
      performance.now();


    document
      .querySelectorAll(".choice")
      .forEach(button => {

        button.classList.remove(
          "selected"
        );

      });

  }


  if (!found) {

    gazeText.innerText =
      "👁️ Seçimə baxın.";

    return;
  }


  const elapsed =
    performance.now() -
    gazeStartTime;


  const remaining =
    Math.max(
      0,
      1.5 -
      elapsed / 1000
    );


  found.classList.add("selected");


  gazeText.innerText =
    "👁️ " +
    found.innerText +
    " — " +
    remaining.toFixed(1) +
    " saniyə";


  /*
    1.5 saniyə baxışdan sonra seç.
  */

  if (
    elapsed >= 1500 &&
    performance.now() -
    lastSelectionTime > 2500
  ) {

    selectButton(found);

  }

}


/* =====================================================
   SEÇİM
===================================================== */

function selectButton(button) {

  lastSelectionTime =
    performance.now();


  document
    .querySelectorAll(".choice")
    .forEach(b => {

      b.classList.remove(
        "selected"
      );

    });


  button.classList.add("selected");


  const text =
    button.innerText;


  gazeText.innerText =
    "✅ SEÇİLDİ: " + text;


  /*
    SƏS YOXDUR.
    Burada yalnız seçim edilir.
  */


  if (button.id === "call") {

    console.log(
      "PALATA 402 → OTAĞA GƏL"
    );

  }


  setTimeout(() => {

    button.classList.remove(
      "selected"
    );

  }, 1200);

}


/* =====================================================
   MEDIAPIPE
===================================================== */

async function startFaceMesh() {

  try {

    faceMesh =
      new FaceMesh({

        locateFile: function(file) {

          return (
            "https://cdn.jsdelivr.net/npm/" +
            "@mediapipe/face_mesh/" +
            file
          );

        }

      });


    faceMesh.setOptions({

      maxNumFaces: 1,

      refineLandmarks: true,

      minDetectionConfidence: 0.55,

      minTrackingConfidence: 0.55

    });


    faceMesh.onResults(
      function(results) {

        if (
          results.multiFaceLandmarks &&
          results.multiFaceLandmarks.length > 0
        ) {

          const face =
            results.multiFaceLandmarks[0];


          currentFeature =
            getEyeFeature(face);


          if (currentFeature) {

            if (calibrated) {

              statusText.innerText =
                "🟢 Göz izlənilir";

              estimateGaze(
                currentFeature
              );

            } else {

              statusText.innerText =
                "🟢 ÜZ VƏ GÖZLƏR AŞKARLANDI";

            }


            dot.style.background =
              "#20b957";

          }

        } else {

          currentFeature = null;

          statusText.innerText =
            "🟡 Üz axtarılır...";

          dot.style.background =
            "#ff9800";

        }

      }
    );


    async function processFrame() {

      if (video.videoWidth > 0) {

        await faceMesh.send({
          image: video
        });

      }

      requestAnimationFrame(
        processFrame
      );

    }


    processFrame();


  } catch(error) {

    console.error(error);

    statusText.innerText =
      "🟠 Göz izləmə xətası";

    gazeText.innerText =
      error.message ||
      "Naməlum xəta";

  }

}


/* =====================================================
   KAMERA
===================================================== */

async function startCamera() {

  try {

    statusText.innerText =
      "🟡 Kamera açılır...";

    dot.style.background =
      "#ff9800";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Brauzer kamera funksiyasını dəstəkləmir."
      );

    }


    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    statusText.innerText =
      "🟢 Kamera işləyir";

    dot.style.background =
      "#20b957";


    startBtn.style.display =
      "none";


    gazeText.innerText =
      "👁️ Üzünüzü kameraya tərəf saxlayın.";


    await startFaceMesh();


    /*
      Üz aşkarlanması üçün
      3 saniyə gözləyirik.
    */

    setTimeout(() => {

      startCalibration();

    }, 3000);


  } catch(error) {

    console.error(
      "KAMERA XƏTASI:",
      error
    );


    statusText.innerText =
      "🔴 Kamera açıla bilmədi";

    dot.style.background =
      "red";


    gazeText.innerText =
      error.message ||
      "Kamera xətası";

  }

}


/* =====================================================
   BAŞLAT
===================================================== */

startBtn.addEventListener(
  "click",
  startCamera
);


/* =====================================================
   ƏL İLƏ TEST
===================================================== */

document
  .getElementById("yes")
  .addEventListener(
    "click",
    function() {

      selectButton(this);

    }
  );


document
  .getElementById("call")
  .addEventListener(
    "click",
    function() {

      selectButton(this);

    }
  );


document
  .getElementById("no")
  .addEventListener(
    "click",
    function() {

      selectButton(this);

    }
  );

</script>

</body>
</html>
