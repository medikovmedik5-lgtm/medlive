<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f7fa;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:65px;
    background:#0b7285;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

#status{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

#start{
    display:block;
    margin:20px auto;
    padding:20px 28px;
    border:0;
    border-radius:18px;
    background:#0b7285;
    color:white;
    font-size:20px;
    font-weight:bold;
}

#calibration{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
}

.point{
    position:absolute;
    width:30px;
    height:30px;
    background:red;
    border:4px solid white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 5px rgba(255,0,0,.25);
}

#choices{
    display:none;
    height:calc(100vh - 120px);
    padding:20px;
    gap:20px;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.choice{
    width:88vw;
    max-width:520px;
    height:125px;
    border:0;
    border-radius:25px;
    color:white;
    font-size:38px;
    font-weight:bold;
    transition:.15s;
}

.choice.active{
    transform:scale(1.04);
    box-shadow:0 0 0 7px rgba(0,0,0,.2);
}

.yes{
    background:#198754;
}

.call{
    background:#dc3545;
}

.no{
    background:#6c757d;
}

#progress{
    display:none;
    position:fixed;
    left:10%;
    bottom:15px;
    width:80%;
    height:12px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    z-index:200;
}

#bar{
    width:0%;
    height:100%;
    background:#0b7285;
}

/* Kamera görüntüsünü göstərmə */
#webgazerVideoContainer,
#webgazerVideoFeed,
#webgazerFaceOverlay,
#webgazerFaceFeedbackBox,
#webgazerGazeDot{
    display:none!important;
}

</style>
</head>

<body>

<header>
MEDELIN — PALATA 402
</header>

<div id="status">
Sistem hazır deyil
</div>

<button id="start">
👁️ GÖZ İZLƏMƏNİ BAŞLAT
</button>


<div id="calibration">

<div class="point" style="left:10%;top:15%"></div>
<div class="point" style="left:50%;top:15%"></div>
<div class="point" style="left:90%;top:15%"></div>

<div class="point" style="left:10%;top:50%"></div>
<div class="point" style="left:50%;top:50%"></div>
<div class="point" style="left:90%;top:50%"></div>

<div class="point" style="left:10%;top:85%"></div>
<div class="point" style="left:50%;top:85%"></div>
<div class="point" style="left:90%;top:85%"></div>

</div>


<div id="choices">

<button class="choice yes"
data-action="YES">
HƏ
</button>

<button class="choice call"
data-action="CALL">
🚨 OTAĞA GƏL
</button>

<button class="choice no"
data-action="NO">
YOX
</button>

</div>


<div id="progress">
<div id="bar"></div>
</div>


<script>

const statusBox =
document.getElementById("status");

const startButton =
document.getElementById("start");

const calibration =
document.getElementById("calibration");

const choices =
document.getElementById("choices");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const buttons =
[...document.querySelectorAll(".choice")];


/* =========================
   AYARLAR
========================= */

const DWELL = 1700;

/* Göz nöqtəsini sakitləşdirir */
const SMOOTH = 0.15;

/* Normal düymə ətrafı */
const EXTRA = 30;


/* =========================
   DƏYİŞƏNLƏR
========================= */

let gazeX = null;
let gazeY = null;

let currentButton = null;

let startLookTime = 0;

let locked = false;


/* Səs heç yerdə yoxdur */
if("speechSynthesis" in window){
    speechSynthesis.cancel();
}


/* =========================
   BAŞLAT
========================= */

function start(){

    startButton.style.display =
        "none";

    statusBox.innerText =
        "Kamera hazırlanır...";


    /*
       ƏVVƏLKİ İŞLƏYƏN MƏNTİQ:

       await istifadə etmirik.
       begin() kameranı özü açır.
    */

    try{

        webgazer
        .setRegression("ridge")
        .setTracker("TFFacemesh")
        .saveDataAcrossSessions(false)
        .applyKalmanFilter(true)
        .showVideo(false)
        .showFaceOverlay(false)
        .showFaceFeedbackBox(false)
        .showPredictionPoints(false);

        webgazer.begin();

        statusBox.innerText =
            "Kalibrasiya başlayır...";

        setTimeout(
            startCalibration,
            1500
        );

    }catch(error){

        console.log(error);

        statusBox.innerText =
            "Sistem başlatılmadı";

    }

}


/* =========================
   KALİBRASİYA
========================= */

function startCalibration(){

    calibration.style.display =
        "block";


    const points =
        [...document.querySelectorAll(".point")];


    let index = 0;


    function next(){

        if(index >= points.length){

            calibration.style.display =
                "none";

            choices.style.display =
                "flex";

            progress.style.display =
                "block";

            statusBox.innerText =
                "Hazırdır — HƏ, OTAĞA GƏL və ya YOX-a bax";

            startGaze();

            return;
        }


        const point =
            points[index];


        statusBox.innerText =
            "Nöqtəyə bax  " +
            (index + 1) +
            " / " +
            points.length;


        const started =
            Date.now();


        const timer =
            setInterval(()=>{

                const r =
                    point.getBoundingClientRect();


                webgazer.recordScreenPosition(
                    r.left + r.width/2,
                    r.top + r.height/2,
                    "click"
                );


                if(
                    Date.now() - started >=
                    2200
                ){

                    clearInterval(timer);

                    index++;

                    setTimeout(
                        next,
                        250
                    );
                }

            },100);

    }


    next();

}


/* =========================
   DÜYMƏNİ TAP
========================= */

function findButton(x,y){

    let closest = null;

    let distance = Infinity;


    for(
        const button of buttons
    ){

        const r =
            button.getBoundingClientRect();


        const cx =
            r.left + r.width/2;

        const cy =
            r.top + r.height/2;


        /*
           Düymənin öz sahəsi
           + kiçik əlavə sahə
        */

        if(
            x < r.left - EXTRA ||
            x > r.right + EXTRA ||
            y < r.top - EXTRA ||
            y > r.bottom + EXTRA
        ){
            continue;
        }


        const dx =
            x - cx;

        const dy =
            y - cy;


        const d =
            Math.sqrt(
                dx*dx + dy*dy
            );


        if(d < distance){

            distance = d;

            closest = button;

        }

    }


    return closest;

}


/* =========================
   GÖZ İZLƏMƏ
========================= */

function startGaze(){

    webgazer.setGazeListener(
        function(data){

            if(
                !data ||
                locked
            ){
                return;
            }


            let x =
                Number(data.x);

            let y =
                Number(data.y);


            if(
                !Number.isFinite(x) ||
                !Number.isFinite(y)
            ){
                return;
            }


            /*
               GÖZÜ SAKİTLƏŞDİRİRİK
            */

            if(gazeX === null){

                gazeX = x;
                gazeY = y;

            }else{

                gazeX +=
                    (x - gazeX) *
                    SMOOTH;

                gazeY +=
                    (y - gazeY) *
                    SMOOTH;

            }


            const button =
                findButton(
                    gazeX,
                    gazeY
                );


            /*
               Düymədən çıxdı
            */

            if(!button){

                currentButton =
                    null;

                startLookTime =
                    0;

                buttons.forEach(
                    b =>
                    b.classList.remove(
                        "active"
                    )
                );

                bar.style.width =
                    "0%";

                return;
            }


            /*
               Başqa düyməyə keçdi
            */

            if(
                button !==
                currentButton
            ){

                currentButton =
                    button;

                startLookTime =
                    Date.now();


                buttons.forEach(
                    b =>
                    b.classList.remove(
                        "active"
                    )
                );


                button.classList.add(
                    "active"
                );


                bar.style.width =
                    "0%";

                return;
            }


            /*
               Eyni düyməyə baxır
            */

            const elapsed =
                Date.now() -
                startLookTime;


            const percent =
                Math.min(
                    100,
                    elapsed /
                    DWELL *
                    100
                );


            bar.style.width =
                percent + "%";


            /*
               SEÇ
            */

            if(
                elapsed >= DWELL
            ){

                choose(button);

            }

        }
    );

}


/* =========================
   SEÇİM
========================= */

function choose(button){

    if(locked){
        return;
    }


    locked = true;


    const action =
        button.dataset.action;


    if(action === "YES"){

        statusBox.innerText =
            "✅ HƏ seçildi";

    }


    if(action === "CALL"){

        statusBox.innerText =
            "🚨 PALATA 402 — OTAĞA GƏL";

    }


    if(action === "NO"){

        statusBox.innerText =
            "❌ YOX seçildi";

    }


    console.log(
        "PALATA 402:",
        action
    );


    bar.style.width =
        "100%";


    setTimeout(()=>{

        locked = false;

        currentButton =
            null;

        startLookTime =
            0;

        gazeX =
            null;

        gazeY =
            null;

        button.classList.remove(
            "active"
        );

        bar.style.width =
            "0%";

        statusBox.innerText =
            "Hazırdır — düyməyə bax";

    },1200);

}


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    start
);


/* Əllə test */
buttons.forEach(
    button => {

        button.addEventListener(
            "click",
            ()=>{
                choose(button);
            }
        );

    }
);

</script>

</body>
</html>
