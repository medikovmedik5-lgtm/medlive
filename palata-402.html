<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>MEDELIN — PALATA 402</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#f5f7fa;
    color:#172b3a;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

header{
    height:68px;
    background:#102a43;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:.8px;
}

.room{
    color:#c8d5e2;
    font-size:15px;
    font-weight:600;
}

#status{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#526579;
    font-size:18px;
    font-weight:600;
}

#startPanel{
    width:min(680px,90vw);
    margin:35px auto;
    background:white;
    border:1px solid #e3e9ef;
    border-radius:28px;
    padding:42px 30px;
    text-align:center;
    box-shadow:0 18px 50px rgba(16,42,67,.08);
}

.startTitle{
    font-size:30px;
    font-weight:800;
    margin-bottom:15px;
    color:#102a43;
}

.startText{
    color:#718096;
    font-size:16px;
    line-height:1.6;
    margin-bottom:28px;
}

#start{
    border:0;
    background:#102a43;
    color:white;
    padding:20px 34px;
    border-radius:16px;
    font-size:18px;
    font-weight:700;
}

#video{
    display:none;
}

/* =========================
   KALİBRASİYA
========================= */

#calibration{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#f5f7fa;
}

.calTitle{
    position:absolute;
    top:28px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:23px;
    font-weight:800;
    color:#102a43;
}

.calText{
    position:absolute;
    top:67px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:15px;
    color:#718096;
}

.point{
    display:none;
    position:absolute;
    width:27px;
    height:27px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#c62828;
    border:5px solid white;
    box-shadow:0 0 0 7px rgba(198,40,40,.13);
}

.point.active{
    display:block;
    animation:pulse .9s infinite alternate;
}

@keyframes pulse{
    from{
        transform:translate(-50%,-50%) scale(.9);
    }
    to{
        transform:translate(-50%,-50%) scale(1.15);
    }
}

/* =========================
   HƏ / YOX
========================= */

#choices{
    display:none;
    width:100%;
    height:calc(100vh - 138px);
    padding:35px 8vw 70px;
    align-items:center;
    justify-content:space-between;
    gap:12vw;
}

.choice{
    width:35vw;
    max-width:480px;
    height:280px;
    border:0;
    border-radius:32px;
    color:white;
    font-size:58px;
    font-weight:800;
    box-shadow:0 18px 45px rgba(16,42,67,.12);
    transition:.18s;
}

.yes{
    background:#13795b;
}

.no{
    background:#344054;
}

.choice.active{
    transform:scale(1.045);
    box-shadow:
        0 0 0 8px rgba(16,42,67,.12),
        0 22px 50px rgba(16,42,67,.18);
}

#progress{
    display:none;
    position:fixed;
    left:20%;
    right:20%;
    bottom:28px;
    height:8px;
    background:#dce3ea;
    border-radius:20px;
    overflow:hidden;
}

#bar{
    width:0%;
    height:100%;
    background:#102a43;
}

#reset{
    display:none;
    position:fixed;
    top:78px;
    right:18px;
    z-index:200;
    border:0;
    background:transparent;
    color:#718096;
    font-size:12px;
}

@media(max-width:650px){

    header{
        height:60px;
        padding:0 18px;
    }

    .logo{
        font-size:16px;
    }

    .room{
        font-size:13px;
    }

    #status{
        height:60px;
        font-size:15px;
    }

    #startPanel{
        margin-top:25px;
        padding:35px 22px;
    }

    .startTitle{
        font-size:25px;
    }

    #choices{
        height:calc(100vh - 120px);
        padding:25px 15px 65px;
        gap:25px;
    }

    .choice{
        width:42vw;
        height:210px;
        font-size:40px;
        border-radius:25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MEDELIN</div>
    <div class="room">PALATA 402</div>
</header>

<div id="status">
    Sistem hazır deyil
</div>

<div id="startPanel">

    <div class="startTitle">
        Gözlə ünsiyyət
    </div>

    <div class="startText">
        Sistem göz istiqamətini izləyərək
        HƏ və YOX seçimlərini idarə edir.
    </div>

    <button id="start">
        GÖZ İZLƏMƏNİ BAŞLAT
    </button>

</div>

<video id="video" autoplay playsinline></video>


<!-- =========================
     KALİBRASİYA
========================= -->

<div id="calibration">

    <div class="calTitle">
        Göz izləmə hazırlanır
    </div>

    <div class="calText">
        Qırmızı nöqtəyə sakit şəkildə baxın
    </div>

    <div class="point"
         data-key="center"
         style="left:50%;top:50%">
    </div>

    <div class="point"
         data-key="left"
         style="left:15%;top:50%">
    </div>

    <div class="point"
         data-key="right"
         style="left:85%;top:50%">
    </div>

    <div class="point"
         data-key="up"
         style="left:50%;top:25%">
    </div>

    <div class="point"
         data-key="down"
         style="left:50%;top:75%">
    </div>

</div>


<!-- =========================
     SEÇİMLƏR
========================= -->

<div id="choices">

    <button
        class="choice yes"
        data-action="YES">
        HƏ
    </button>

    <button
        class="choice no"
        data-action="NO">
        YOX
    </button>

</div>


<div id="progress">
    <div id="bar"></div>
</div>

<button id="reset">
    Yenidən kalibrasiya
</button>


<script>

/* =================================================
   ELEMENTLƏR
================================================= */

const video =
    document.getElementById("video");

const start =
    document.getElementById("start");

const startPanel =
    document.getElementById("startPanel");

const status =
    document.getElementById("status");

const calibration =
    document.getElementById("calibration");

const choices =
    document.getElementById("choices");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const reset =
    document.getElementById("reset");

const points =
    [...document.querySelectorAll(".point")];

const buttons =
    [...document.querySelectorAll(".choice")];


/* =================================================
   PARAMETRLƏR
================================================= */

const STORAGE =
    "MEDELIN_402_CALIBRATION";

const CAL_TIME =
    1600;

const DWELL =
    1800;

const SMOOTH =
    0.10;


/* =================================================
   DƏYİŞƏNLƏR
================================================= */

let running = false;

let collecting = false;

let samples = [];

let calibrationData = {};

let gazeX = null;

let gazeY = null;

let currentButton = null;

let lookStarted = 0;

let locked = false;

let lastFace = 0;


/* =================================================
   MEDIAPIPE
================================================= */

const faceMesh =
    new FaceMesh({

        locateFile:function(file){
            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;
        }

    });


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


/* =================================================
   ORTAQ NÖQTƏ
================================================= */

function average(landmarks,indexes){

    let x = 0;
    let y = 0;
    let n = 0;

    for(
        const i of indexes
    ){

        if(!landmarks[i]){
            continue;
        }

        x += landmarks[i].x;
        y += landmarks[i].y;
        n++;

    }

    if(!n){
        return null;
    }

    return {
        x:x/n,
        y:y/n
    };

}


/* =================================================
   GÖZ FEATURE
================================================= */

function getEye(landmarks){

    const leftIris =
        average(
            landmarks,
            [468,469,470,471,472]
        );

    const rightIris =
        average(
            landmarks,
            [473,474,475,476,477]
        );

    if(!leftIris || !rightIris){
        return null;
    }


    const lo = landmarks[33];
    const li = landmarks[133];
    const lt = landmarks[159];
    const lb = landmarks[145];

    const ri = landmarks[362];
    const ro = landmarks[263];
    const rt = landmarks[386];
    const rb = landmarks[374];


    if(
        !lo || !li || !lt || !lb ||
        !ri || !ro || !rt || !rb
    ){
        return null;
    }


    const lw =
        Math.max(
            Math.abs(li.x-lo.x),
            .0001
        );

    const rw =
        Math.max(
            Math.abs(ro.x-ri.x),
            .0001
        );

    const lh =
        Math.max(
            Math.abs(lb.y-lt.y),
            .0001
        );

    const rh =
        Math.max(
            Math.abs(rb.y-rt.y),
            .0001
        );


    const lx =
        (leftIris.x-lo.x)/lw;

    const rx =
        (rightIris.x-ri.x)/rw;

    const ly =
        (leftIris.y-lt.y)/lh;

    const ry =
        (rightIris.y-rt.y)/rh;


    return {

        x:(lx+rx)/2,

        y:(ly+ry)/2

    };

}


/* =================================================
   MEDIAPIPE NƏTİCƏ
================================================= */

faceMesh.onResults(
function(results){

    if(!running){
        return;
    }


    if(
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ){
        return;
    }


    const eye =
        getEye(
            results.multiFaceLandmarks[0]
        );


    if(!eye){
        return;
    }


    lastFace =
        Date.now();


    /* KALİBRASİYA */

    if(collecting){

        samples.push({
            x:eye.x,
            y:eye.y
        });

        return;

    }


    /* NORMAL İŞ */

    if(
        calibrationData.center &&
        calibrationData.left &&
        calibrationData.right &&
        calibrationData.up &&
        calibrationData.down
    ){

        const p =
            predict(
                eye.x,
                eye.y
            );


        updateGaze(
            p.x,
            p.y
        );

    }

});


/* =================================================
   SİSTEMİ BAŞLAT
================================================= */

async function startSystem(){

    start.disabled = true;

    status.innerText =
        "Kamera hazırlanır...";


    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        running = true;

        startPanel.style.display =
            "none";


        status.innerText =
            "Göz sistemi hazırlanır...";


        const camera =
            new Camera(
                video,
                {
                    onFrame:
                    async function(){

                        await faceMesh.send({
                            image:video
                        });

                    },

                    width:640,

                    height:480
                }
            );


        camera.start();


        setTimeout(
            begin,
            1500
        );

    }
    catch(error){

        console.error(error);

        status.innerText =
            "Kamera açıla bilmədi";

        start.disabled = false;

    }

}


/* =================================================
   BAŞLA
================================================= */

function begin(){

    const saved =
        localStorage.getItem(
            STORAGE
        );


    if(saved){

        try{

            const data =
                JSON.parse(saved);


            if(valid(data)){

                calibrationData =
                    data;

                showChoices();

                return;

            }

        }
        catch(e){}

    }


    startCalibration();

}


/* =================================================
   VALID
================================================= */

function valid(data){

    return !!(
        data &&
        data.center &&
        data.left &&
        data.right &&
        data.up &&
        data.down
    );

}


/* =================================================
   KALİBRASİYA
================================================= */

function startCalibration(){

    calibrationData = {};

    calibration.style.display =
        "block";

    choices.style.display =
        "none";

    progress.style.display =
        "none";

    reset.style.display =
        "none";


    let index = 0;


    function next(){

        points.forEach(
            p =>
            p.classList.remove("active")
        );


        if(index >= points.length){

            finishCalibration();

            return;

        }


        const point =
            points[index];

        const key =
            point.dataset.key;


        point.classList.add("active");


        samples = [];

        collecting = true;


        status.innerText =
            "Nöqtəyə baxın  " +
            (index+1) +
            " / " +
            points.length;


        setTimeout(
        function(){

            collecting = false;


            /*
               Nümunə yığılmayıbsa belə
               kalibrasiya ilişmir.
            */

            let x = .5;
            let y = .5;


            if(samples.length){

                for(
                    const s of samples
                ){

                    x += s.x;
                    y += s.y;

                }


                x =
                    x /
                    (samples.length+1);

                y =
                    y /
                    (samples.length+1);

            }


            const rect =
                point.getBoundingClientRect();


            calibrationData[key] = {

                eyeX:x,

                eyeY:y,

                screenX:
                    rect.left+
                    rect.width/2,

                screenY:
                    rect.top+
                    rect.height/2

            };


            index++;


            setTimeout(
                next,
                350
            );

        },
        CAL_TIME);

    }


    next();

}


/* =================================================
   KALİBRASİYA BİTİR
================================================= */

function finishCalibration(){

    points.forEach(
        p =>
        p.classList.remove("active")
    );


    localStorage.setItem(
        STORAGE,
        JSON.stringify(
            calibrationData
        )
    );


    calibration.style.display =
        "none";


    showChoices();

}


/* =================================================
   SEÇİM EKRANI
================================================= */

function showChoices(){

    choices.style.display =
        "flex";

    progress.style.display =
        "block";

    reset.style.display =
        "block";

    status.innerText =
        "Hazırdır — HƏ və ya YOX-a bax";

}


/* =================================================
   GAZE PREDICTION
================================================= */

function predict(x,y){

    const c =
        calibrationData.center;

    const l =
        calibrationData.left;

    const r =
        calibrationData.right;

    const u =
        calibrationData.up;

    const d =
        calibrationData.down;


    /*
       X
    */

    const minX =
        Math.min(
            l.eyeX,
            r.eyeX
        );

    const maxX =
        Math.max(
            l.eyeX,
            r.eyeX
        );


    let nx =
        (x-minX) /
        Math.max(
            maxX-minX,
            .0001
        );


    /*
       Y
    */

    const minY =
        Math.min(
            u.eyeY,
            d.eyeY
        );

    const maxY =
        Math.max(
            u.eyeY,
            d.eyeY
        );


    let ny =
        (y-minY) /
        Math.max(
            maxY-minY,
            .0001
        );


    nx =
        Math.max(
            0,
            Math.min(1,nx)
        );

    ny =
        Math.max(
            0,
            Math.min(1,ny)
        );


    /*
       HƏ solda,
       YOX sağda.
       Y koordinatı seçimə
       təsir etmir.
    */

    const leftX =
        window.innerWidth*.25;

    const rightX =
        window.innerWidth*.75;


    const screenX =
        leftX +
        (rightX-leftX)*nx;


    /*
       Yuxarı/aşağı baxış
       seçim sistemini pozmasın.
       Sadəcə ekran daxilində
       sabit saxlanır.
    */

    const screenY =
        window.innerHeight*.50;


    return {
        x:screenX,
        y:screenY
    };

}


/* =================================================
   SMOOTH
================================================= */

function updateGaze(x,y){

    if(gazeX === null){

        gazeX = x;
        gazeY = y;

    }
    else{

        gazeX +=
            (x-gazeX)*SMOOTH;

        gazeY +=
            (y-gazeY)*SMOOTH;

    }


    checkButton(
        gazeX,
        gazeY
    );

}


/* =================================================
   DÜYMƏ SEÇİMİ
================================================= */

function checkButton(x,y){

    if(locked){
        return;
    }


    if(
        Date.now()-lastFace >
        1500
    ){
        return;
    }


    let target = null;


    /*
       Düymənin mərkəzinə
       məsafə
    */

    let best =
        Infinity;


    for(
        const button of buttons
    ){

        const rect =
            button.getBoundingClientRect();


        const cx =
            rect.left+
            rect.width/2;


        const cy =
            rect.top+
            rect.height/2;


        const dx =
            x-cx;


        const dy =
            y-cy;


        const dist =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        const radius =
            Math.min(
                rect.width*.58,
                rect.height*.58
            );


        if(
            dist <= radius &&
            dist < best
        ){

            best = dist;

            target = button;

        }

    }


    if(!target){

        return;

    }


    if(
        target !== currentButton
    ){

        currentButton =
            target;

        lookStarted =
            Date.now();


        buttons.forEach(
            b =>
            b.classList.remove("active")
        );


        target.classList.add("active");

        bar.style.width =
            "0%";


        return;

    }


    const elapsed =
        Date.now() -
        lookStarted;


    const percent =
        Math.min(
            100,
            elapsed/DWELL*100
        );


    bar.style.width =
        percent+"%";


    if(
        elapsed >= DWELL
    ){

        select(
            target
        );

    }

}


/* =================================================
   SEÇ
================================================= */

function select(button){

    if(locked){
        return;
    }


    locked = true;


    const action =
        button.dataset.action;


    if(action === "YES"){

        status.innerText =
            "HƏ";

    }


    if(action === "NO"){

        status.innerText =
            "YOX";

    }


    console.log(
        "MEDELIN — PALATA 402 →",
        action
    );


    bar.style.width =
        "100%";


    setTimeout(
    function(){

        locked = false;

        currentButton =
            null;

        lookStarted =
            0;

        gazeX =
            null;

        gazeY =
            null;


        buttons.forEach(
            b =>
            b.classList.remove("active")
        );


        bar.style.width =
            "0%";


        status.innerText =
            "Hazırdır — HƏ və ya YOX-a bax";

    },
    1200);

}


/* =================================================
   RESET KALİBRASİYA
================================================= */

reset.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            STORAGE
        );

        gazeX = null;
        gazeY = null;
        currentButton = null;

        startCalibration();

    }
);


/* =================================================
   START
================================================= */

start.addEventListener(
    "click",
    startSystem
);

</script>

</body>
</html>
