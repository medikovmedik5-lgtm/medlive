<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medistyle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f7ff;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #3f51b5;
            margin-bottom: 35px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .menu button {
            width: 320px;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            background: #536dfe;
            color: white;
            cursor: pointer;
        }

        .menu button:hover {
            background: #3f51b5;
        }
    </style>
</head>

<body>

    <h1>🏥 Medistyle</h1>

    <div class="menu">

        <button>👨‍⚕️ Həkimlər</button>

        <button>🧪 Analizlər</button>

        <button>📅 Qəbul Vaxtları</button>

        <button>📞 Əlaqə</button>

        

    </div>

</body>

</html>
