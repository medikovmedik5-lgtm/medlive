<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palata 408</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f8f6;
            color: #1d2b26;
            padding: 25px 15px;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 12px;
            border-radius: 25px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 10px 30px rgba(30, 70, 55, 0.12);
            border: 1px solid #e2ebe6;
        }

        h1 {
            color: #244d3d;
            font-size: 32px;
            margin: 10px 0;
        }

        h2 {
            font-size: 22px;
            margin: 25px 0 18px;
        }

        .subtitle {
            color: #748078;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* DİL SEÇİMİ */

        #dilSechimi {
            max-width: 430px;
            margin: 40px auto;
            background: white;
            padding: 30px 22px;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(30, 70, 55, 0.12);
        }

        .dilBtn {
            display: block;
            width: 100%;
            padding: 17px;
            margin: 12px 0;
            border: 1px solid #dce7e1;
            border-radius: 16px;
            background: #ffffff;
            color: #244d3d;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .dilBtn:hover {
            background: #edf6f1;
            transform: translateY(-2px);
        }

        /* ƏSAS PALATA */

        #palata {
            display: none;
            max-width: 430px;
            margin: 20px auto;
            background: white;
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(30, 70, 55, 0.10);
        }

        .istek {
            display: block;
            width: 100%;
            margin: 12px auto;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #dce7e1;
            border-radius: 16px;
            background: #ffffff;
            color: #244d3d;
            cursor: pointer;
            transition: 0.2s;
        }

        .istek:hover {
            background: #edf6f1;
            transform: translateY(-2px);
        }

        .istek:disabled {
            opacity: 0.6;
        }

        .ses {
            background: #fff4f2;
            border-color: #f2d1cc;
            color: #a33d32;
        }

        .dayandir {
            background: #edf6f1;
            border-color: #cfe2d8;
            color: #2d654e;
        }

        textarea {
            width: 100%;
            height: 105px;
            margin-top: 10px;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid #dce7e1;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #6c9b84;
        }

        #status {
            font-weight: bold;
            margin: 15px;
            color: #65736c;
        }

        #cagirisStatus {
            margin: 20px auto;
            padding: 15px;
            border-radius: 14px;
            background: #edf6f1;
            color: #2d654e;
            font-weight: bold;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5ebe7;
            margin: 30px 0;
        }

        .footer {
            margin-top: 25px;
            color: #9aa59f;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- DİL SEÇİMİ -->

    <div id="dilSechimi">

        <div class="logo">
            🩺
        </div>

        <h1>MedElin</h1>

        <div class="subtitle">
            Palata 408
        </div>

        <h2>🌍 Dil seçin</h2>

        <button class="dilBtn" onclick="dilSec('az')">
            🇦🇿 Azərbaycan
        </button>

        <button class="dilBtn" onclick="dilSec('ru')">
            🇷🇺 Русский
        </button>

        <button class="dilBtn" onclick="dilSec('en')">
            🇬🇧 English
        </button>

    </div>


    <!-- PALATA -->

    <div id="palata">

        <div class="logo">
            🩺
        </div>

        <h1 id="basliq">
            Palata 406
        </h1>

        <div class="subtitle" id="altBasliq">
            Sizə nə lazımdır?
        </div>


        <button class="istek" onclick="cagirisGonder('Su istəyirəm')">
            💧 <span id="su">Su istəyirəm</span>
        </button>

        <button class="istek" onclick="cagirisGonder('Yemək istəyirəm')">
            🍽️ <span id="yemek">Yemək istəyirəm</span>
        </button>

        <button class="istek" onclick="cagirisGonder('Tibb bacısını çağır')">
            🧑‍⚕️ <span id="tibb">Tibb bacısını çağır</span>
        </button>

        <button class="istek" onclick="cagirisGonder('Yataqla bağlı kömək istəyirəm')">
            🛏️ <span id="yataq">Yataqla bağlı kömək</span>
        </button>


        <div id="cagirisStatus">
            Hazırdır ✅
        </div>


        <h3 id="serhBasliq">
            📝 Şərh
        </h3>

        <textarea
            id="serh"
            placeholder="İstəyinizi buraya yazın..."
        ></textarea>

        <br>

        <button class="istek" onclick="serhGonder()">
            📤 <span id="serhGonder">Şərhi göndər</span>
        </button>


        <hr>


        <h2 id="sesBasliq">
            🎙️ Səsli mesaj
        </h2>

        <button id="sesBaslat" class="istek ses">
            🎙️ <span id="sesYaz">Səs yaz</span>
        </button>

        <button id="sesDayandir" class="istek dayandir" disabled>
            ⏹️ <span id="sesDayan">Səsi dayandır</span>
        </button>

        <div id="status">
            Səs yazmağa hazırdır
        </div>

        <audio id="audio" controls></audio>


        <div class="footer">
            MedElin • Palata sistemi
        </div>

    </div>


<script>

    // ==================================
    // DİL SİSTEMİ
    // ==================================

    let secilenDil = "az";

    const metinler = {

        az: {
            alt: "Sizə nə lazımdır?",
            su: "Su istəyirəm",
            yemek: "Yemək istəyirəm",
            tibb: "Tibb bacısını çağır",
            yataq: "Yataqla bağlı kömək",
            hazir: "Hazırdır ✅",
            serh: "📝 Şərh",
            serhPlaceholder: "İstəyinizi buraya yazın...",
            serhGonder: "Şərhi göndər",
            ses: "🎙️ Səsli mesaj",
            sesYaz: "Səs yaz",
            sesDayan: "Səsi dayandır",
            sesHazir: "Səs yazmağa hazırdır",
            gonderilir: "⏳ Göndərilir...",
            serverXeta: "❌ Serverə qoşulmaq olmadı.",
            mikrofon: "❌ Mikrofon üçün icazə verilmədi.",
            sesYazildi: "✅ Səs yazıldı. Aşağıdan dinləyə bilərsiniz.",
            sesYazilir: "🔴 Səs yazılır...",
            serhBos: "Əvvəl şərh yazın."
        },

        ru: {
            alt: "Что вам нужно?",
            su: "Я хочу воды",
            yemek: "Я хочу есть",
            tibb: "Позвать медсестру",
            yataq: "Помощь с кроватью",
            hazir: "Готово ✅",
            serh: "📝 Комментарий",
            serhPlaceholder: "Напишите вашу просьбу...",
            serhGonder: "Отправить комментарий",
            ses: "🎙️ Голосовое сообщение",
            sesYaz: "Записать голос",
            sesDayan: "Остановить запись",
            sesHazir: "Готов к записи",
            gonderilir: "⏳ Отправляется...",
            serverXeta: "❌ Не удалось подключиться к серверу.",
            mikrofon: "❌ Нет доступа к микрофону.",
            sesYazildi: "✅ Голос записан. Вы можете прослушать его ниже.",
            sesYazilir: "🔴 Идёт запись...",
            serhBos: "Сначала напишите комментарий."
        },

        en: {
            alt: "What do you need?",
            su: "I want water",
            yemek: "I want food",
            tibb: "Call the nurse",
            yataq: "I need help with the bed",
            hazir: "Ready ✅",
            serh: "📝 Comment",
            serhPlaceholder: "Write your request here...",
            serhGonder: "Send comment",
            ses: "🎙️ Voice message",
            sesYaz: "Record voice",
            sesDayan: "Stop recording",
            sesHazir: "Ready to record",
            gonderilir: "⏳ Sending...",
            serverXeta: "❌ Could not connect to the server.",
            mikrofon: "❌ Microphone permission was denied.",
            sesYazildi: "✅ Voice recorded. You can listen below.",
            sesYazilir: "🔴 Recording...",
            serhBos: "Please write a comment first."
        }

    };


    function dilSec(dil) {

        secilenDil = dil;

        const t = metinler[dil];

        document.getElementById("dilSechimi").style.display = "none";

        document.getElementById("palata").style.display = "block";

        document.getElementById("altBasliq").textContent = t.alt;

        document.getElementById("su").textContent = t.su;

        document.getElementById("yemek").textContent = t.yemek;

        document.getElementById("tibb").textContent = t.tibb;

        document.getElementById("yataq").textContent = t.yataq;

        document.getElementById("cagirisStatus").textContent = t.hazir;

        document.getElementById("serhBasliq").textContent = t.serh;

        document.getElementById("serh").placeholder =
            t.serhPlaceholder;

        document.getElementById("serhGonder").textContent =
            t.serhGonder;

        document.getElementById("sesBasliq").textContent =
            t.ses;

        document.getElementById("sesYaz").textContent =
            t.sesYaz;

        document.getElementById("sesDayan").textContent =
            t.sesDayan;

        document.getElementById("status").textContent =
            t.sesHazir;

        document.documentElement.lang = dil;
    }


    // ==================================
    // MEDLIVE SERVER
    // ==================================

    const BACKEND_URL =
        "https://medlive.onrender.com";

    const PALATA = "408";


    // ==================================
    // ÇAĞIRIŞ GÖNDƏR
    // ==================================

    async function cagirisGonder(istek) {

        const status =
            document.getElementById("cagirisStatus");

        const t = metinler[secilenDil];

        status.textContent =
            t.gonderilir;

        try {

            const response = await fetch(
                BACKEND_URL + "/api/cagir",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        palata: PALATA,
                        istek: istek,
                        dil: secilenDil
                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Server xətası: " + response.status
                );
            }

            const data =
                await response.json();

            if (data.success) {

                status.textContent =
                    "🔔 " +
                    (secilenDil === "az"
                        ? "Göndərildi"
                        : secilenDil === "ru"
                            ? "Отправлено"
                            : "Sent"
                    ) +
                    ": Palata " +
                    PALATA;

            } else {

                status.textContent =
                    "❌ " +
                    (secilenDil === "az"
                        ? "Göndərmək mümkün olmadı."
                        : secilenDil === "ru"
                            ? "Не удалось отправить."
                            : "Could not send."
                    );
            }

        } catch (error) {

            console.error("Xəta:", error);

            status.textContent =
                t.serverXeta;
        }
    }


    // ==================================
    // ŞƏRH
    // ==================================

    async function serhGonder() {

        const serh =
            document.getElementById("serh")
                .value
                .trim();

        const t = metinler[secilenDil];

        if (!serh) {

            alert(t.serhBos);

            return;
        }

        await cagirisGonder(
            "📝 " + serh
        );

        document.getElementById("serh").value = "";
    }


    // ==================================
    // SƏS YAZMA
    // ==================================

    let recorder = null;

    let audioChunks = [];

    const sesBaslat =
        document.getElementById("sesBaslat");

    const sesDayandir =
        document.getElementById("sesDayandir");

    const status =
        document.getElementById("status");

    const audio =
        document.getElementById("audio");


    sesBaslat.addEventListener(
        "click",
        async function () {

            const t = metinler[secilenDil];

            try {

                const stream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                audioChunks = [];

                recorder =
                    new MediaRecorder(stream);


                recorder.ondataavailable =
                    function (event) {

                        if (event.data.size > 0) {

                            audioChunks.push(
                                event.data
                            );

                        }

                    };


                recorder.onstop =
                    function () {

                        const audioBlob =
                            new Blob(
                                audioChunks,
                                {
                                    type: "audio/webm"
                                }
                            );

                        const audioUrl =
                            URL.createObjectURL(
                                audioBlob
                            );

                        audio.src =
                            audioUrl;


                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );


                        status.textContent =
                            t.sesYazildi;

                    };


                recorder.start();

                status.textContent =
                    t.sesYazilir;

                sesBaslat.disabled =
                    true;

                sesDayandir.disabled =
                    false;

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    t.mikrofon;

            }

        }
    );


    sesDayandir.addEventListener(
        "click",
        function () {

            if (
                recorder &&
                recorder.state !== "inactive"
            ) {

                recorder.stop();

                sesBaslat.disabled =
                    false;

                sesDayandir.disabled =
                    true;

            }

        }
    );

</script>

</body>
</html>
