<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medistyle Hospital - Palata 408</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f8f6;
            color: #1d2b26;
            padding: 25px 15px;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 12px;
            border-radius: 25px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 10px 30px rgba(30, 70, 55, 0.12);
            border: 1px solid #e2ebe6;
        }

        h1 {
            color: #244d3d;
            font-size: 32px;
            margin: 10px 0;
        }

        h2 {
            font-size: 22px;
            margin: 25px 0 18px;
        }

        .hospital {
            color: #5d7469;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #748078;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #dilSechimi {
            max-width: 430px;
            margin: 40px auto;
            background: white;
            padding: 30px 22px;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(30, 70, 55, 0.12);
        }

        .dilBtn {
            display: block;
            width: 100%;
            padding: 17px;
            margin: 12px 0;
            border: 1px solid #dce7e1;
            border-radius: 16px;
            background: #ffffff;
            color: #244d3d;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #palata {
            display: none;
            max-width: 430px;
            margin: 20px auto;
            background: white;
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(30, 70, 55, 0.10);
        }

        .istek {
            display: block;
            width: 100%;
            margin: 12px auto;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #dce7e1;
            border-radius: 16px;
            background: #ffffff;
            color: #244d3d;
            cursor: pointer;
        }

        .istek:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .ses {
            background: #fff4f2;
            border-color: #f2d1cc;
            color: #a33d32;
        }

        .dayandir {
            background: #edf6f1;
            border-color: #cfe2d8;
            color: #2d654e;
        }

        .gonder {
            background: #eaf3ff;
            border-color: #c9ddf5;
            color: #28619b;
        }

        textarea {
            width: 100%;
            height: 105px;
            margin-top: 10px;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid #dce7e1;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        #status {
            font-weight: bold;
            margin: 15px;
            color: #65736c;
        }

        #cagirisStatus {
            margin: 20px auto;
            padding: 15px;
            border-radius: 14px;
            background: #edf6f1;
            color: #2d654e;
            font-weight: bold;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5ebe7;
            margin: 30px 0;
        }

        .footer {
            margin-top: 25px;
            color: #9aa59f;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- DİL SEÇİMİ -->

    <div id="dilSechimi">

        <div class="logo">
            🩺
        </div>

        <h1>MedElin</h1>

        <div class="hospital">
            Medistyle Hospital
        </div>

        <div class="subtitle">
            Palata 408
        </div>

        <h2>🌍 Dil seçin</h2>

        <button class="dilBtn" onclick="dilSec('az')">
            🇦🇿 Azərbaycan
        </button>

        <button class="dilBtn" onclick="dilSec('ru')">
            🇷🇺 Русский
        </button>

        <button class="dilBtn" onclick="dilSec('en')">
            🇬🇧 English
        </button>

    </div>


    <!-- PALATA -->

    <div id="palata">

        <div class="logo">
            🩺
        </div>

        <h1>
            Palata 408
        </h1>

        <div class="hospital">
            Medistyle Hospital
        </div>

        <div class="subtitle" id="altBasliq">
            Sizə nə lazımdır?
        </div>


        <!-- İSTƏKLƏR -->

        <button class="istek"
            onclick="cagirisGonder('Su istəyirəm')">

            💧 <span id="su">
                Su istəyirəm
            </span>

        </button>


        <button class="istek"
            onclick="cagirisGonder('Yemək istəyirəm')">

            🍽️ <span id="yemek">
                Yemək istəyirəm
            </span>

        </button>


        <button class="istek"
            onclick="cagirisGonder('Tibb bacısını çağır')">

            🧑‍⚕️ <span id="tibb">
                Tibb bacısını çağır
            </span>

        </button>


        <button class="istek"
            onclick="cagirisGonder('Yataqla bağlı kömək istəyirəm')">

            🛏️ <span id="yataq">
                Yataqla bağlı kömək
            </span>

        </button>


        <div id="cagirisStatus">
            Hazırdır ✅
        </div>


        <!-- ŞƏRH -->

        <h3 id="serhBasliq">
            📝 Şərh
        </h3>

        <textarea
            id="serh"
            placeholder="İstəyinizi buraya yazın..."
        ></textarea>

        <br>

        <button class="istek"
            onclick="serhGonder()">

            📤 <span id="serhGonder">
                Şərhi göndər
            </span>

        </button>


        <hr>


        <!-- SƏSLİ MESAJ -->

        <h2 id="sesBasliq">
            🎙️ Səsli mesaj
        </h2>


        <button
            id="sesBaslat"
            class="istek ses">

            🎙️ <span id="sesYaz">
                Səs yaz
            </span>

        </button>


        <button
            id="sesDayandir"
            class="istek dayandir"
            disabled>

            ⏹️ <span id="sesDayan">
                Səsi dayandır
            </span>

        </button>


        <button
            id="sesGonder"
            class="istek gonder"
            disabled>

            📤 <span id="sesGonderText">
                Səsi göndər
            </span>

        </button>


        <div id="status">
            Səs yazmağa hazırdır
        </div>


        <audio
            id="audio"
            controls>
        </audio>


        <div class="footer">
            MedElin • Medistyle Hospital
        </div>

    </div>


<script>

    // ==================================
    // DİL
    // ==================================

    let secilenDil = "az";


    const metinler = {

        az: {
            alt: "Sizə nə lazımdır?",
            su: "Su istəyirəm",
            yemek: "Yemək istəyirəm",
            tibb: "Tibb bacısını çağır",
            yataq: "Yataqla bağlı kömək",

            hazir: "Hazırdır ✅",

            serh: "📝 Şərh",
            serhPlaceholder:
                "İstəyinizi buraya yazın...",
            serhGonder:
                "Şərhi göndər",

            ses:
                "🎙️ Səsli mesaj",

            sesYaz:
                "Səs yaz",

            sesDayan:
                "Səsi dayandır",

            sesGonder:
                "Səsi göndər",

            sesHazir:
                "Səs yazmağa hazırdır",

            sesYazilir:
                "🔴 Səs yazılır...",

            sesYazildi:
                "✅ Səs yazıldı. İndi göndərə bilərsiniz.",

            sesGonderilir:
                "⏳ Səs göndərilir...",

            sesGonderildi:
                "✅ Səs göndərildi.",

            serverXeta:
                "❌ Serverə qoşulmaq olmadı.",

            mikrofon:
                "❌ Mikrofon üçün icazə verilmədi.",

            serhBos:
                "Əvvəl şərh yazın.",

            gonderilir:
                "⏳ Göndərilir..."
        },


        ru: {
            alt: "Что вам нужно?",
            su: "Я хочу воды",
            yemek: "Я хочу есть",
            tibb: "Позвать медсестру",
            yataq: "Помощь с кроватью",

            hazir: "Готово ✅",

            serh: "📝 Комментарий",
            serhPlaceholder:
                "Напишите вашу просьбу...",
            serhGonder:
                "Отправить комментарий",

            ses:
                "🎙️ Голосовое сообщение",

            sesYaz:
                "Записать голос",

            sesDayan:
                "Остановить запись",

            sesGonder:
                "Отправить голос",

            sesHazir:
                "Готов к записи",

            sesYazilir:
                "🔴 Идёт запись...",

            sesYazildi:
                "✅ Голос записан. Теперь его можно отправить.",

            sesGonderilir:
                "⏳ Отправляется...",

            sesGonderildi:
                "✅ Голос отправлен.",

            serverXeta:
                "❌ Не удалось подключиться к серверу.",

            mikrofon:
                "❌ Нет доступа к микрофону.",

            serhBos:
                "Сначала напишите комментарий.",

            gonderilir:
                "⏳ Отправляется..."
        },


        en: {
            alt: "What do you need?",
            su: "I want water",
            yemek: "I want food",
            tibb: "Call the nurse",
            yataq: "I need help with the bed",

            hazir: "Ready ✅",

            serh: "📝 Comment",
            serhPlaceholder:
                "Write your request here...",
            serhGonder:
                "Send comment",

            ses:
                "🎙️ Voice message",

            sesYaz:
                "Record voice",

            sesDayan:
                "Stop recording",

            sesGonder:
                "Send voice",

            sesHazir:
                "Ready to record",

            sesYazilir:
                "🔴 Recording...",

            sesYazildi:
                "✅ Voice recorded. You can send it now.",

            sesGonderilir:
                "⏳ Sending voice...",

            sesGonderildi:
                "✅ Voice sent.",

            serverXeta:
                "❌ Could not connect to the server.",

            mikrofon:
                "❌ Microphone permission was denied.",

            serhBos:
                "Please write a comment first.",

            gonderilir:
                "⏳ Sending..."
        }

    };


    // ==================================
    // DİL SEÇ
    // ==================================

    function dilSec(dil) {

        secilenDil = dil;

        const t = metinler[dil];

        document.getElementById(
            "dilSechimi"
        ).style.display = "none";

        document.getElementById(
            "palata"
        ).style.display = "block";


        document.getElementById(
            "altBasliq"
        ).textContent = t.alt;


        document.getElementById(
            "su"
        ).textContent = t.su;


        document.getElementById(
            "yemek"
        ).textContent = t.yemek;


        document.getElementById(
            "tibb"
        ).textContent = t.tibb;


        document.getElementById(
            "yataq"
        ).textContent = t.yataq;


        document.getElementById(
            "cagirisStatus"
        ).textContent = t.hazir;


        document.getElementById(
            "serhBasliq"
        ).textContent = t.serh;


        document.getElementById(
            "serh"
        ).placeholder =
            t.serhPlaceholder;


        document.getElementById(
            "serhGonder"
        ).textContent =
            t.serhGonder;


        document.getElementById(
            "sesBasliq"
        ).textContent = t.ses;


        document.getElementById(
            "sesYaz"
        ).textContent = t.sesYaz;


        document.getElementById(
            "sesDayan"
        ).textContent = t.sesDayan;


        document.getElementById(
            "sesGonderText"
        ).textContent = t.sesGonder;


        document.getElementById(
            "status"
        ).textContent = t.sesHazir;


        document.documentElement.lang = dil;
    }


    // ==================================
    // SERVER
    // ==================================

    const BACKEND_URL =
        "https://medlive.onrender.com";

    const PALATA = "408";


    // ==================================
    // ÇAĞIRIŞ
    // ==================================

    async function cagirisGonder(istek) {

        const status =
            document.getElementById(
                "cagirisStatus"
            );

        const t =
            metinler[secilenDil];


        status.textContent =
            t.gonderilir;


        try {

            const response =
                await fetch(
                    BACKEND_URL +
                    "/api/cagir",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                palata: PALATA,
                                istek: istek,
                                dil: secilenDil
                            })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server xətası"
                );

            }


            const data =
                await response.json();


            if (data.success) {

                status.textContent =
                    "🔔 " +
                    (secilenDil === "az"
                        ? "Göndərildi"
                        : secilenDil === "ru"
                            ? "Отправлено"
                            : "Sent"
                    ) +
                    ": Palata " +
                    PALATA;

            } else {

                status.textContent =
                    t.serverXeta;

            }


        } catch (error) {

            console.error(error);

            status.textContent =
                t.serverXeta;

        }

    }


    // ==================================
    // ŞƏRH
    // ==================================

    async function serhGonder() {

        const serh =
            document.getElementById(
                "serh"
            ).value.trim();


        const t =
            metinler[secilenDil];


        if (!serh) {

            alert(t.serhBos);

            return;

        }


        await cagirisGonder(
            "📝 " + serh
        );


        document.getElementById(
            "serh"
        ).value = "";

    }


    // ==================================
    // SƏS YAZMA
    // ==================================

    let recorder = null;

    let audioChunks = [];

    let audioBlob = null;


    const sesBaslat =
        document.getElementById(
            "sesBaslat"
        );


    const sesDayandir =
        document.getElementById(
            "sesDayandir"
        );


    const sesGonder =
        document.getElementById(
            "sesGonder"
        );


    const status =
        document.getElementById(
            "status"
        );


    const audio =
        document.getElementById(
            "audio"
        );


    // ==================================
    // SƏS YAZ
    // ==================================

    sesBaslat.addEventListener(
        "click",
        async function () {

            const t =
                metinler[secilenDil];


            try {

                const stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });


                audioChunks = [];

                audioBlob = null;


                recorder =
                    new MediaRecorder(
                        stream
                    );


                recorder.ondataavailable =
                    function (event) {

                        if (
                            event.data.size > 0
                        ) {

                            audioChunks.push(
                                event.data
                            );

                        }

                    };


                recorder.onstop =
                    function () {

                        audioBlob =
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        "audio/webm"
                                }
                            );


                        const audioUrl =
                            URL.createObjectURL(
                                audioBlob
                            );


                        audio.src =
                            audioUrl;


                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );


                        status.textContent =
                            t.sesYazildi;


                        sesGonder.disabled =
                            false;

                    };


                recorder.start();


                status.textContent =
                    t.sesYazilir;


                sesBaslat.disabled =
                    true;


                sesDayandir.disabled =
                    false;


                sesGonder.disabled =
                    true;

            }


            catch (error) {

                console.error(error);

                status.textContent =
                    t.mikrofon;

            }

        }
    );


    // ==================================
    // SƏSİ DAYANDIR
    // ==================================

    sesDayandir.addEventListener(
        "click",
        function () {

            if (
                recorder &&
                recorder.state !==
                    "inactive"
            ) {

                recorder.stop();

                sesBaslat.disabled =
                    false;

                sesDayandir.disabled =
                    true;

            }

        }
    );


    // ==================================
    // SƏSİ SERVERƏ GÖNDƏR
    // ==================================

    sesGonder.addEventListener(
        "click",
        async function () {

            const t =
                metinler[secilenDil];


            if (!audioBlob) {

                return;

            }


            status.textContent =
                t.sesGonderilir;


            sesGonder.disabled =
                true;


            try {

                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "palata-408.webm"
                );


                formData.append(
                    "palata",
                    PALATA
                );


                formData.append(
                    "dil",
                    secilenDil
                );


                const response =
                    await fetch(
                        BACKEND_URL +
                        "/api/ses-gonder",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Səs göndərilmədi"
                    );

                }


                const data =
                    await response.json();


                if (data.success) {

                    status.textContent =
                        t.sesGonderildi;

                    audioBlob = null;

                } else {

                    throw new Error(
                        "Server qəbul etmədi"
                    );

                }


            } catch (error) {

                console.error(error);

                status.textContent =
                    t.serverXeta;

                sesGonder.disabled =
                    false;

            }

        }
    );

</script>

</body>
</html>
